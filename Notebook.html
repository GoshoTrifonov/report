// Build resource list per BU, including Rework at the end
function getResourcesForBU(bu) {
  const resources = Object.entries(RESOURCE_BU_MAP)
    .filter(([, b]) => b === bu)
    .map(([r]) => r);
  resources.push("Rework");
  return resources;
}

function getAllResources() {
  const all = Object.keys(RESOURCE_BU_MAP);
  all.push("Rework");
  return all;
}

// Safe Firestore key from resource name
function resourceKey(name) {
  return name.replace(/[^a-zA-Z0-9_]/g, "_");
}

function tsToDate(ts) {
  if (!ts) return null;
  if (ts.toDate) return ts.toDate();          // Firestore Timestamp
  if (ts.seconds) return new Date(ts.seconds * 1000); // Firestore-like object
  return new Date(ts);                         // plain number or string
}

function formatTs(ts) {
  const d = tsToDate(ts);
  if (!d) return "";
  return d.toLocaleString("en-CA", { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit", hour12: true });
}

function formatDate(ts) {
  const d = tsToDate(ts);
  if (!d) return "";
  const days = Math.floor((Date.now() - d) / 86400000);
  if (days === 0) return "Today";
  if (days === 1) return "Yesterday";
  return `${days}d ago`;
}

// Safe Firestore key from part number
function skuKey(part) {
  return "sku_" + part.replace(/[^a-zA-Z0-9_]/g, "_");
}

// ─── SKU NOTES PANEL ─────────────────────────────────────────────────────────
// Notes attached to a part number — never auto-deleted
function SkuNotesPanel({ part, descr, author }) {
  const [notes, setNotes] = React.useState([]);
  const [showAdd, setShowAdd] = React.useState(false);
  const [noteText, setNoteText] = React.useState("");
  const [saving, setSaving] = React.useState(false);
  const [showClear, setShowClear] = React.useState(false);
  const [clearPw, setClearPw] = React.useState("");
  const [clearErr, setClearErr] = React.useState("");
  const [showAll, setShowAll] = React.useState(false);
  const docRef = React.useRef(null);
  const key = skuKey(part);

  React.useEffect(() => {
    docRef.current = db.collection("notebook_sku").doc(key);
    const unsub = docRef.current.onSnapshot(snap => {
      if (snap.exists) {
        const data = snap.data();
        setNotes((data.notes || []).sort((a, b) => {
          const ta = a.timestamp?.seconds ? a.timestamp.seconds * 1000 : (a.timestamp || 0);
          const tb = b.timestamp?.seconds ? b.timestamp.seconds * 1000 : (b.timestamp || 0);
          return tb - ta;
        }));
      } else {
        setNotes([]);
      }
    });
    return () => unsub();
  }, [key]);

  const saveNote = async () => {
    if (!noteText.trim() || !docRef.current) return;
    setSaving(true);
    try {
      const now = Date.now();
      const newNote = { id: now.toString(), text: noteText.trim(), author: author || "Unknown", timestamp: now, part };
      const snap = await docRef.current.get();
      const existing = snap.exists ? (snap.data().notes || []) : [];
      await docRef.current.set({ notes: [...existing, newNote], part, descr }, { merge: true });
      setNoteText(""); setShowAdd(false);
    } catch (err) {
      alert("Could not save note: " + err.message);
    } finally { setSaving(false); }
  };

  const confirmClear = async () => {
    if (clearPw !== "chepelare") { setClearErr("Wrong password"); return; }
    await docRef.current.set({ notes: [] }, { merge: true });
    setShowClear(false); setClearPw(""); setClearErr("");
  };

  const visibleNotes = showAll ? notes : notes.slice(0, 3);

  return (
    <div>
      {notes.length > 0 && (
        <div className="space-y-2">
          {visibleNotes.map(note => (
            <div key={note.id} className="rounded-r-lg p-2.5 fade-in" style={{borderLeft:"3px solid #a78bfa", background:"#0f172a"}}>
              <p className="text-sm text-slate-200 leading-relaxed">{note.text}</p>
              <div className="flex items-center gap-2 mt-1.5 flex-wrap">
                <span className="text-xs font-medium text-violet-400">{note.author}</span>
                <span className="text-slate-600 text-xs">·</span>
                <span className="text-xs text-slate-500">{formatTs(note.timestamp)}</span>
                <span className="text-slate-600 text-xs">·</span>
                <span className="text-xs text-slate-600">{formatDate(note.timestamp)}</span>
                {note.part && note.part !== part && (
                  <span className="text-xs text-slate-700 ml-auto">from {note.part}</span>
                )}
              </div>
            </div>
          ))}
          {notes.length > 3 && (
            <button onClick={() => setShowAll(v => !v)} className="text-xs text-slate-500 hover:text-slate-300 ml-3 mt-1 transition-colors">
              {showAll ? "▲ Show less" : `▼ Show ${notes.length - 3} more`}
            </button>
          )}
        </div>
      )}

      {notes.length === 0 && !showAdd && (
        <p className="text-xs text-slate-600 italic py-1">No history yet for this part</p>
      )}

      {/* Add note form */}
      {showAdd && (
        <div className="mt-2 fade-in space-y-2">
          <div className="text-xs text-slate-500">Signing as <span className="text-violet-400 font-medium">{author || "Unknown"}</span></div>
          <textarea
            autoFocus rows={3}
            placeholder={`Add a note about ${part}...`}
            value={noteText}
            onChange={e => setNoteText(e.target.value)}
            onKeyDown={e => { if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) saveNote(); }}
            className="w-full bg-slate-900 border border-slate-600 rounded-lg px-3 py-2 text-sm text-white placeholder-slate-500 resize-none"
          />
          <div className="flex gap-2 items-center">
            <button onClick={saveNote} disabled={!noteText.trim() || saving}
              className="bg-violet-600 hover:bg-violet-500 disabled:opacity-40 text-white text-xs font-semibold px-4 py-1.5 rounded-lg transition-colors flex items-center gap-1.5">
              {saving && <span className="saving-dot"></span>}
              {saving ? "Saving..." : "Save Note"}
            </button>
            <button onClick={() => { setShowAdd(false); setNoteText(""); }} className="text-xs text-slate-500 hover:text-slate-300 px-2 py-1.5">Cancel</button>
            <span className="text-xs text-slate-600 ml-auto">Ctrl+Enter</span>
          </div>
        </div>
      )}

      {/* Clear modal */}
      {showClear && (
        <div className="mt-2 fade-in bg-slate-900 border border-red-900 rounded-lg p-3 space-y-2">
          <p className="text-xs text-red-400 font-medium">Password to clear all notes for {part}:</p>
          <div className="flex gap-2">
            <input type="password" placeholder="Password" value={clearPw}
              onChange={e => { setClearPw(e.target.value); setClearErr(""); }}
              onKeyDown={e => e.key === "Enter" && confirmClear()} autoFocus
              className="flex-1 bg-slate-800 border border-slate-600 rounded-lg px-3 py-1.5 text-sm text-white placeholder-slate-500" />
            <button onClick={confirmClear} className="bg-red-700 hover:bg-red-600 text-white text-xs font-semibold px-3 py-1.5 rounded-lg">Clear</button>
            <button onClick={() => { setShowClear(false); setClearPw(""); setClearErr(""); }} className="text-xs text-slate-500 hover:text-slate-300 px-2">Cancel</button>
          </div>
          {clearErr && <p className="text-xs text-red-400">{clearErr}</p>}
        </div>
      )}

      {/* Action bar */}
      {!showAdd && !showClear && (
        <div className="mt-2 flex items-center gap-3">
          <button onClick={() => setShowAdd(true)} className="text-xs text-violet-400 hover:text-violet-300 font-medium transition-colors flex items-center gap-1">
            <span className="text-base leading-none">+</span> Add Part Note
          </button>
          {notes.length > 0 && (
            <button onClick={() => setShowClear(true)} className="text-xs text-slate-600 hover:text-red-400 transition-colors ml-auto">
              Clear part notes
            </button>
          )}
        </div>
      )}
    </div>
  );
}

// ─── SKU LOOKUP MODAL ─────────────────────────────────────────────────────────
function SkuLookup({ onClose, author }) {
  const [query, setQuery] = React.useState("");
  const [results, setResults] = React.useState(null); // null=idle, []= no match, [{part,descr,notes}]=found
  const [loading, setLoading] = React.useState(false);

  const search = async () => {
    const q = query.trim().toUpperCase();
    if (!q) return;
    setLoading(true);
    try {
      // Scan notebook_sku collection for matching part keys
      const snap = await db.collection("notebook_sku").get();
      const matched = [];
      snap.forEach(doc => {
        const data = doc.data();
        const p = (data.part || "").toUpperCase();
        const d = (data.descr || "").toUpperCase();
        if (p.includes(q) || d.includes(q)) matched.push({ ...data, id: doc.id });
      });
      matched.sort((a, b) => (a.part || "").localeCompare(b.part || ""));
      setResults(matched);
    } catch (err) {
      alert("Search failed: " + err.message);
    } finally { setLoading(false); }
  };

  return (
    <div className="fixed inset-0 z-50 flex items-start justify-center pt-10 px-4" style={{background:"rgba(0,0,0,0.85)"}}>
      <div className="bg-slate-900 border border-slate-700 rounded-2xl shadow-2xl w-full max-w-xl max-h-[85vh] flex flex-col fade-in">
        {/* Header */}
        <div className="flex items-center justify-between px-5 py-4 border-b border-slate-700">
          <div>
            <div className="text-white font-bold text-sm">Part / SKU Lookup</div>
            <div className="text-slate-500 text-xs mt-0.5">Search notes by part number or description</div>
          </div>
          <button onClick={onClose} className="text-slate-500 hover:text-slate-300 text-lg leading-none px-1">✕</button>
        </div>

        {/* Search bar */}
        <div className="px-5 py-3 border-b border-slate-800 flex gap-2">
          <input
            type="text" placeholder="e.g. VER-1234 or catheter" value={query} autoFocus
            onChange={e => setQuery(e.target.value)}
            onKeyDown={e => e.key === "Enter" && search()}
            className="flex-1 bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white placeholder-slate-500"
          />
          <button onClick={search} disabled={!query.trim() || loading}
            className="px-4 py-2 bg-violet-600 hover:bg-violet-500 disabled:opacity-40 text-white text-xs font-semibold rounded-lg transition-colors">
            {loading ? "..." : "Search"}
          </button>
        </div>

        {/* Results */}
        <div className="overflow-y-auto flex-1 px-5 py-4">
          {results === null && (
            <p className="text-xs text-slate-600 text-center py-6">Enter a part number or description above</p>
          )}
          {results !== null && results.length === 0 && (
            <p className="text-xs text-slate-600 text-center py-6">No notes found for "{query}"</p>
          )}
          {results !== null && results.map(r => (
            <div key={r.id} className="mb-6">
              <div className="flex items-center gap-2 mb-3">
                <span className="text-white font-bold text-sm">{r.part}</span>
                {r.descr && <span className="text-slate-400 text-xs">{r.descr}</span>}
                <span className="text-xs text-slate-600 ml-auto">{(r.notes || []).length} note{(r.notes||[]).length !== 1 ? "s" : ""}</span>
              </div>
              <SkuNotesPanel part={r.part} descr={r.descr} author={author} />
              <div className="mt-3 border-t border-slate-800"></div>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

// ─── SINGLE RESOURCE CARD ────────────────────────────────────────────────────
function ResourceCard({ name, bu, author, currentPart, currentDescr }) {
  const [scheduled, setScheduled] = React.useState(false);
  const [notes, setNotes] = React.useState([]);
  const [showAdd, setShowAdd] = React.useState(false);
  const [noteText, setNoteText] = React.useState("");
  const [saving, setSaving] = React.useState(false);
  const [showClear, setShowClear] = React.useState(false);
  const [clearPw, setClearPw] = React.useState("");
  const [clearErr, setClearErr] = React.useState("");
  const [showAll, setShowAll] = React.useState(false);
  const [activeTab, setActiveTab] = React.useState("line"); // "line" | "part"
  const key = resourceKey(name);
  const docRef = React.useRef(null);

  React.useEffect(() => {
    docRef.current = db.collection("notebook").doc(key);
    const unsub = docRef.current.onSnapshot(snap => {
      if (snap.exists) {
        const data = snap.data();
        setScheduled(!!data.scheduled);
        setNotes((data.notes || []).sort((a, b) => {
          const ta = a.timestamp?.seconds ? a.timestamp.seconds * 1000 : (a.timestamp || 0);
          const tb = b.timestamp?.seconds ? b.timestamp.seconds * 1000 : (b.timestamp || 0);
          return tb - ta;
        }));
      }
    });
    return () => unsub();
  }, [key]);

  const toggleScheduled = async () => {
    if (!docRef.current) return;
    const next = !scheduled;
    setScheduled(next);
    await docRef.current.set({ scheduled: next }, { merge: true });
  };

  const saveNote = async () => {
    if (!noteText.trim() || !docRef.current) return;
    setSaving(true);
    try {
      const now = Date.now();
      const newNote = {
        id: now.toString(),
        text: noteText.trim(),
        author: author || "Unknown",
        timestamp: now,
      };

      // Get current notes, prune older than 10 days, append new
      const snap = await docRef.current.get();
      const existing = snap.exists ? (snap.data().notes || []) : [];
      const cutoff = now - 10 * 24 * 60 * 60 * 1000;
      const pruned = existing.filter(n => {
        const ts = n.timestamp?.seconds ? n.timestamp.seconds * 1000 : (n.timestamp || 0);
        return ts > cutoff;
      });

      await docRef.current.set({ notes: [...pruned, newNote] }, { merge: true });
      setNoteText("");
      setShowAdd(false);
    } catch (err) {
      console.error("Save note failed:", err);
      alert("Could not save note: " + err.message);
    } finally {
      setSaving(false);
    }
  };

  const confirmClear = async () => {
    if (clearPw !== "chepelare") { setClearErr("Wrong password"); return; }
    await docRef.current.set({ notes: [] }, { merge: true });
    setShowClear(false);
    setClearPw("");
    setClearErr("");
  };

  const colors = BU_COLORS[bu] || BU_COLORS["Other"];
  const visibleNotes = showAll ? notes : notes.slice(0, 3);
  const hasOlder = notes.length > 3;

  return (
    <div className={`card p-4 mb-3 transition-all ${scheduled ? "scheduled-on" : ""}`}>
      {/* Header row */}
      <div className="flex items-center justify-between gap-3 flex-wrap">
        <div className="flex items-center gap-3 min-w-0">
          <span className="font-semibold text-white text-sm truncate">{name}</span>
          <span className={`text-xs px-2 py-0.5 rounded-full font-medium ${colors.pill}`}>{bu}</span>
        </div>
        <div className="flex items-center gap-2">
          {notes.length > 0 && (
            <span className="text-xs text-slate-500">{notes.length} note{notes.length !== 1 ? "s" : ""}</span>
          )}
          {/* Scheduled toggle */}
          <button
            onClick={toggleScheduled}
            className={`flex items-center gap-1.5 px-3 py-1.5 rounded-full text-xs font-semibold transition-all border ${
              scheduled
                ? "bg-green-600 border-green-500 text-white shadow-md shadow-green-900/40"
                : "bg-slate-700 border-slate-600 text-slate-400 hover:border-slate-500"
            }`}
          >
            <span className={`w-1.5 h-1.5 rounded-full ${scheduled ? "bg-green-300" : "bg-slate-500"}`}></span>
            {scheduled ? "Scheduled" : "Not Scheduled"}
          </button>
        </div>
      </div>

      {/* Current part badge */}
      {currentPart && (
        <div className="mt-2 flex items-center gap-2">
          <span className="text-xs px-2 py-0.5 rounded-full font-mono font-medium bg-violet-900/40 text-violet-300 border border-violet-800">{currentPart}</span>
          {currentDescr && <span className="text-xs text-slate-500 truncate">{currentDescr}</span>}
        </div>
      )}

      {/* Tabs — only show Part tab if there's a current part */}
      <div className="mt-3 flex gap-0 border-b border-slate-700">
        <button
          onClick={() => setActiveTab("line")}
          className={`px-3 py-1.5 text-xs font-medium border-b-2 transition-all -mb-px ${activeTab === "line" ? "border-blue-500 text-blue-400" : "border-transparent text-slate-500 hover:text-slate-300"}`}
        >
          🏭 Line Notes
          {notes.length > 0 && <span className="ml-1.5 text-slate-600">{notes.length}</span>}
        </button>
        {currentPart && (
          <button
            onClick={() => setActiveTab("part")}
            className={`px-3 py-1.5 text-xs font-medium border-b-2 transition-all -mb-px ${activeTab === "part" ? "border-violet-500 text-violet-400" : "border-transparent text-slate-500 hover:text-slate-300"}`}
          >
            🔧 Part Notes
            <span className="ml-1.5 text-xs text-violet-600 font-mono">{currentPart}</span>
          </button>
        )}
      </div>

      {/* Line Notes tab */}
      {activeTab === "line" && (
        <div className="mt-3">
          {notes.length > 0 && (
            <div className="space-y-2">
              {visibleNotes.map(note => (
                <div key={note.id} className="note-item rounded-r-lg p-2.5 fade-in">
                  <p className="text-sm text-slate-200 leading-relaxed">{note.text}</p>
                  <div className="flex items-center gap-2 mt-1.5">
                    <span className="text-xs font-medium text-blue-400">{note.author}</span>
                    <span className="text-slate-600 text-xs">·</span>
                    <span className="text-xs text-slate-500">{formatTs(note.timestamp)}</span>
                    <span className="text-slate-600 text-xs">·</span>
                    <span className="text-xs text-slate-600">{formatDate(note.timestamp)}</span>
                  </div>
                </div>
              ))}
              {hasOlder && (
                <button onClick={() => setShowAll(v => !v)} className="text-xs text-slate-500 hover:text-slate-300 ml-3 mt-1 transition-colors">
                  {showAll ? "▲ Show less" : `▼ Show ${notes.length - 3} more`}
                </button>
              )}
            </div>
          )}
          {notes.length === 0 && !showAdd && (
            <p className="text-xs text-slate-600 italic py-1">No line notes yet — auto-deleted after 10 days</p>
          )}

          {/* Add note form */}
          {showAdd && (
            <div className="mt-2 fade-in space-y-2">
              <div className="text-xs text-slate-500">Signing as <span className="text-blue-400 font-medium">{author || "Unknown"}</span></div>
              <textarea autoFocus rows={3}
                placeholder="Add a note for the next shift..."
                value={noteText}
                onChange={e => setNoteText(e.target.value)}
                onKeyDown={e => { if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) saveNote(); }}
                className="w-full bg-slate-900 border border-slate-600 rounded-lg px-3 py-2 text-sm text-white placeholder-slate-500 resize-none"
              />
              <div className="flex gap-2 items-center">
                <button onClick={saveNote} disabled={!noteText.trim() || saving}
                  className="bg-blue-600 hover:bg-blue-500 disabled:opacity-40 text-white text-xs font-semibold px-4 py-1.5 rounded-lg transition-colors flex items-center gap-1.5">
                  {saving && <span className="saving-dot"></span>}
                  {saving ? "Saving..." : "Save Note"}
                </button>
                <button onClick={() => { setShowAdd(false); setNoteText(""); }} className="text-xs text-slate-500 hover:text-slate-300 px-2 py-1.5">Cancel</button>
                <span className="text-xs text-slate-600 ml-auto">Ctrl+Enter</span>
              </div>
            </div>
          )}

          {/* Clear modal */}
          {showClear && (
            <div className="mt-2 fade-in bg-slate-900 border border-red-900 rounded-lg p-3 space-y-2">
              <p className="text-xs text-red-400 font-medium">Password to clear all line notes for {name}:</p>
              <div className="flex gap-2">
                <input type="password" placeholder="Password" value={clearPw}
                  onChange={e => { setClearPw(e.target.value); setClearErr(""); }}
                  onKeyDown={e => e.key === "Enter" && confirmClear()} autoFocus
                  className="flex-1 bg-slate-800 border border-slate-600 rounded-lg px-3 py-1.5 text-sm text-white placeholder-slate-500" />
                <button onClick={confirmClear} className="bg-red-700 hover:bg-red-600 text-white text-xs font-semibold px-3 py-1.5 rounded-lg">Clear</button>
                <button onClick={() => { setShowClear(false); setClearPw(""); setClearErr(""); }} className="text-xs text-slate-500 hover:text-slate-300 px-2">Cancel</button>
              </div>
              {clearErr && <p className="text-xs text-red-400">{clearErr}</p>}
            </div>
          )}

          {/* Action bar */}
          {!showAdd && !showClear && (
            <div className="mt-2 flex items-center gap-3">
              <button onClick={() => setShowAdd(true)} className="text-xs text-blue-400 hover:text-blue-300 font-medium transition-colors flex items-center gap-1">
                <span className="text-base leading-none">+</span> Add Note
              </button>
              {notes.length > 0 && (
                <button onClick={() => setShowClear(true)} className="text-xs text-slate-600 hover:text-red-400 transition-colors ml-auto">
                  Clear notes
                </button>
              )}
            </div>
          )}
        </div>
      )}

      {/* Part Notes tab */}
      {activeTab === "part" && currentPart && (
        <div className="mt-3">
          <SkuNotesPanel part={currentPart} descr={currentDescr} author={author} />
        </div>
      )}
    </div>
  );
}

// ─── CONFIG PANEL ─────────────────────────────────────────────────────────────
function ConfigPanel({ bu, allResources, order, hidden, onSave, onClose }) {
  const [localOrder, setLocalOrder] = React.useState(() => {
    const base = order.length ? order : allResources;
    const extra = allResources.filter(r => !base.includes(r));
    return [...base.filter(r => allResources.includes(r)), ...extra];
  });
  const [localHidden, setLocalHidden] = React.useState(() => new Set(hidden));

  // Drag state
  const dragIdx = React.useRef(null);
  const dragOverIdx = React.useRef(null);
  const [dragActive, setDragActive] = React.useState(null); // index being dragged
  const [dropTarget, setDropTarget] = React.useState(null); // index being hovered over

  const toggleHide = (name) => {
    setLocalHidden(prev => {
      const s = new Set(prev);
      if (s.has(name)) s.delete(name); else s.add(name);
      return s;
    });
  };

  const onDragStart = (e, idx) => {
    dragIdx.current = idx;
    setDragActive(idx);
    e.dataTransfer.effectAllowed = "move";
    // Transparent drag ghost (we style the row itself)
    const ghost = document.createElement("div");
    ghost.style.position = "absolute";
    ghost.style.top = "-1000px";
    document.body.appendChild(ghost);
    e.dataTransfer.setDragImage(ghost, 0, 0);
    setTimeout(() => document.body.removeChild(ghost), 0);
  };

  const onDragEnter = (e, idx) => {
    e.preventDefault();
    dragOverIdx.current = idx;
    setDropTarget(idx);
  };

  const onDragOver = (e) => { e.preventDefault(); e.dataTransfer.dropEffect = "move"; };

  const onDrop = (e, idx) => {
    e.preventDefault();
    const from = dragIdx.current;
    if (from === null || from === idx) { cleanup(); return; }
    const next = [...localOrder];
    const [item] = next.splice(from, 1);
    next.splice(idx, 0, item);
    setLocalOrder(next);
    cleanup();
  };

  const onDragEnd = () => cleanup();

  const cleanup = () => {
    dragIdx.current = null;
    dragOverIdx.current = null;
    setDragActive(null);
    setDropTarget(null);
  };

  const visibleCount = localOrder.filter(r => !localHidden.has(r)).length;

  return (
    <div className="fixed inset-0 z-50 flex items-start justify-center pt-8 px-4" style={{background:"rgba(0,0,0,0.7)"}}>
      <div className="bg-slate-900 border border-slate-700 rounded-2xl shadow-2xl w-full max-w-lg max-h-[85vh] flex flex-col">
        {/* Panel header */}
        <div className="flex items-center justify-between px-5 py-4 border-b border-slate-700">
          <div>
            <div className="text-white font-bold text-sm">Configure — {bu}</div>
            <div className="text-slate-500 text-xs mt-0.5">{visibleCount} visible · {localHidden.size} hidden</div>
          </div>
          <button onClick={onClose} className="text-slate-500 hover:text-slate-300 text-lg leading-none px-1">✕</button>
        </div>

        {/* Instructions */}
        <div className="px-5 py-2 border-b border-slate-800 flex items-center gap-4 text-xs text-slate-500">
          <span>👁 toggle visibility</span>
          <span>⠿ drag to reorder</span>
        </div>

        {/* Resource list */}
        <div className="overflow-y-auto flex-1 px-5 py-3 space-y-1">
          {localOrder.map((name, idx) => {
            const isHidden = localHidden.has(name);
            const isDragging = dragActive === idx;
            const isTarget = dropTarget === idx && dragActive !== idx;
            return (
              <div
                key={name}
                draggable
                onDragStart={e => onDragStart(e, idx)}
                onDragEnter={e => onDragEnter(e, idx)}
                onDragOver={onDragOver}
                onDrop={e => onDrop(e, idx)}
                onDragEnd={onDragEnd}
                className={`flex items-center gap-2 px-3 py-2 rounded-lg border transition-all select-none
                  ${isDragging ? "opacity-30 scale-95" : ""}
                  ${isTarget ? "border-blue-500 bg-blue-900/20" : isHidden ? "bg-slate-800/30 border-slate-800 opacity-50" : "bg-slate-800 border-slate-700"}
                `}
                style={{cursor: "grab"}}
              >
                {/* Drag handle */}
                <span className="flex-shrink-0 text-slate-600 hover:text-slate-400 transition-colors text-base leading-none px-0.5" style={{cursor:"grab"}}>
                  ⠿
                </span>

                {/* Visibility toggle */}
                <button
                  onClick={() => toggleHide(name)}
                  title={isHidden ? "Show" : "Hide"}
                  onMouseDown={e => e.stopPropagation()}
                  className={`flex-shrink-0 w-6 h-6 rounded-md flex items-center justify-center text-xs transition-colors ${isHidden ? "bg-slate-700 text-slate-500 hover:text-slate-300" : "bg-emerald-900 text-emerald-400 hover:bg-emerald-800"}`}
                >
                  {isHidden ? "✕" : "👁"}
                </button>

                {/* Name */}
                <span className={`flex-1 text-sm truncate ${isHidden ? "text-slate-600 line-through" : "text-slate-200"}`}>{name}</span>
              </div>
            );
          })}
        </div>

        {/* Footer */}
        <div className="px-5 py-4 border-t border-slate-700 flex gap-3 justify-end">
          <button onClick={onClose} className="px-4 py-2 text-xs text-slate-400 hover:text-slate-200 transition-colors">Cancel</button>
          <button
            onClick={() => onSave(localOrder, [...localHidden])}
            className="px-5 py-2 bg-blue-600 hover:bg-blue-500 text-white text-xs font-semibold rounded-lg transition-colors"
          >Save Changes</button>
        </div>
      </div>
    </div>
  );
}

// ─── INITIALS PROMPT ──────────────────────────────────────────────────────────
function InitialsPrompt({ onDone }) {
  const [val, setVal] = React.useState("");
  const submit = () => {
    const trimmed = val.trim();
    if (!trimmed) return;
    localStorage.setItem("nb_author", trimmed);
    onDone(trimmed);
  };
  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center px-4" style={{background:"rgba(0,0,0,0.85)"}}>
      <div className="bg-slate-900 border border-slate-700 rounded-2xl shadow-2xl w-full max-w-sm p-7 fade-in text-center">
        <div className="w-12 h-12 bg-blue-600 rounded-xl flex items-center justify-center mx-auto mb-4">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="white" strokeWidth="2.5"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        </div>
        <div className="text-white font-bold text-base mb-1">Who are you?</div>
        <div className="text-slate-500 text-xs mb-5">Enter your name or initials — used to sign notes you leave</div>
        <input
          type="text"
          placeholder="e.g. Gorgy or G.T."
          value={val}
          autoFocus
          maxLength={20}
          onChange={e => setVal(e.target.value)}
          onKeyDown={e => e.key === "Enter" && submit()}
          className="w-full bg-slate-800 border border-slate-600 rounded-lg px-4 py-2.5 text-sm text-white placeholder-slate-500 text-center mb-4"
        />
        <button
          onClick={submit}
          disabled={!val.trim()}
          className="w-full bg-blue-600 hover:bg-blue-500 disabled:opacity-40 text-white font-semibold text-sm py-2.5 rounded-lg transition-colors"
        >Continue</button>
      </div>
    </div>
  );
}

// ─── MAIN APP ─────────────────────────────────────────────────────────────────
function App() {
  const [selectedBU, setSelectedBU] = React.useState("BU Verathon");
  const [search, setSearch] = React.useState("");

  // Initials / author name — prompted once, stored in localStorage
  const [author, setAuthor] = React.useState(() => localStorage.getItem("nb_author") || "");
  const [showInitialsPrompt, setShowInitialsPrompt] = React.useState(() => !localStorage.getItem("nb_author"));

  // Build plan — live from Firestore (mirrors BuildTracker's fbParse exactly)
  // Doc: buildtracker/build_plan  →  { data: JSON.stringify({ rows: [...], fileName, uploadedAt }) }
  // Each row has: { resource, part, descr, wo, ... }
  const [buildPlanMap, setBuildPlanMap] = React.useState({}); // resource -> {part, descr}
  React.useEffect(() => {
    const unsub = db.collection("buildtracker").doc("build_plan").onSnapshot(snap => {
      if (!snap.exists) { setBuildPlanMap({}); return; }
      try {
        const parsed = JSON.parse(snap.data().data || "null");
        if (!parsed || !parsed.rows) { setBuildPlanMap({}); return; }
        const map = {};
        // First pass: prefer first non-done row with a part number
        parsed.rows.forEach(r => {
          if (!r.resource) return;
          if (map[r.resource]) return; // already have a winner
          const isDone = (r.status || "").toLowerCase() === "done";
          if (!isDone && r.part) {
            map[r.resource] = { part: r.part, descr: r.descr || "" };
          }
        });
        // Second pass: if a resource only has done/no-part rows, take what we can
        parsed.rows.forEach(r => {
          if (!r.resource || map[r.resource]) return;
          if (r.part) {
            map[r.resource] = { part: r.part, descr: r.descr || "" };
          }
        });
        setBuildPlanMap(map);
      } catch(e) {
        console.warn("Notebook: build plan parse error", e);
        setBuildPlanMap({});
      }
    });
    return () => unsub();
  }, []);

  // SKU lookup modal
  const [showSkuLookup, setShowSkuLookup] = React.useState(false);

  // Config state — loaded from Firestore per BU
  // Shape: { [bu]: { order: string[], hidden: string[] } }
  const [buConfig, setBuConfig] = React.useState({});
  const configDocRef = React.useRef(null);

  // Config panel state
  const [showConfigGate, setShowConfigGate] = React.useState(false);
  const [configPw, setConfigPw] = React.useState("");
  const [configPwErr, setConfigPwErr] = React.useState("");
  const [configUnlocked, setConfigUnlocked] = React.useState(false);
  const [showConfigPanel, setShowConfigPanel] = React.useState(false);

  // Load config from Firestore
  React.useEffect(() => {
    configDocRef.current = db.collection("notebook_config").doc("layout");
    const unsub = configDocRef.current.onSnapshot(snap => {
      if (snap.exists) setBuConfig(snap.data());
    });
    return () => unsub();
  }, []);

  const tryUnlock = () => {
    if (configPw === "chepelare") {
      setConfigUnlocked(true);
      setShowConfigGate(false);
      setShowConfigPanel(true);
      setConfigPw("");
      setConfigPwErr("");
    } else {
      setConfigPwErr("Wrong password");
    }
  };

  const openConfig = () => {
    if (configUnlocked) { setShowConfigPanel(true); }
    else { setShowConfigGate(true); }
  };

  const saveConfig = async (order, hidden) => {
    const next = { ...buConfig, [selectedBU]: { order, hidden } };
    await configDocRef.current.set(next);
    setShowConfigPanel(false);
  };

  // Get ordered, filtered resources for current BU
  const resources = React.useMemo(() => {
    const cfg = buConfig[selectedBU] || {};
    const hiddenSet = new Set(cfg.hidden || []);

    let base;
    if (selectedBU === "All") {
      base = getAllResources();
    } else {
      const raw = getResourcesForBU(selectedBU);
      const savedOrder = cfg.order || [];
      if (savedOrder.length) {
        // Apply saved order, add any new resources at end
        const extra = raw.filter(r => !savedOrder.includes(r));
        base = [...savedOrder.filter(r => raw.includes(r)), ...extra];
      } else {
        base = raw;
      }
      // Filter hidden
      base = base.filter(r => !hiddenSet.has(r));
    }
    return base;
  }, [selectedBU, buConfig]);

  const filtered = React.useMemo(() => {
    if (!search.trim()) return resources;
    return resources.filter(r => r.toLowerCase().includes(search.toLowerCase()));
  }, [resources, search]);

  const getBUForResource = (name) => {
    if (name === "Rework") return selectedBU === "All" ? "Other" : selectedBU;
    return RESOURCE_BU_MAP[name] || "Other";
  };

  // All resources for config panel (before hiding)
  const allResourcesForConfig = React.useMemo(() => {
    const cfg = buConfig[selectedBU] || {};
    const raw = selectedBU === "All" ? getAllResources() : getResourcesForBU(selectedBU);
    const savedOrder = cfg.order || [];
    if (savedOrder.length) {
      const extra = raw.filter(r => !savedOrder.includes(r));
      return [...savedOrder.filter(r => raw.includes(r)), ...extra];
    }
    return raw;
  }, [selectedBU, buConfig]);

  const hiddenForConfig = (buConfig[selectedBU] || {}).hidden || [];
  const hiddenCount = hiddenForConfig.length;

  return (
    <div className="min-h-screen bg-slate-900">
      {/* SKU Lookup modal */}
      {showSkuLookup && <SkuLookup onClose={() => setShowSkuLookup(false)} author={author} />}

      {/* Initials prompt — shown once if not set */}
      {showInitialsPrompt && (
        <InitialsPrompt onDone={name => { setAuthor(name); setShowInitialsPrompt(false); }} />
      )}

      {/* Config password gate modal */}
      {showConfigGate && (
        <div className="fixed inset-0 z-50 flex items-center justify-center px-4" style={{background:"rgba(0,0,0,0.7)"}}>
          <div className="bg-slate-900 border border-slate-700 rounded-2xl shadow-2xl w-full max-w-sm p-6 fade-in">
            <div className="text-white font-bold text-sm mb-1">Configuration</div>
            <div className="text-slate-500 text-xs mb-4">Enter password to access layout settings</div>
            <input
              type="password"
              placeholder="Password"
              value={configPw}
              autoFocus
              onChange={e => { setConfigPw(e.target.value); setConfigPwErr(""); }}
              onKeyDown={e => e.key === "Enter" && tryUnlock()}
              className="w-full bg-slate-800 border border-slate-600 rounded-lg px-3 py-2 text-sm text-white placeholder-slate-500 mb-2"
            />
            {configPwErr && <p className="text-xs text-red-400 mb-2">{configPwErr}</p>}
            <div className="flex gap-2 justify-end">
              <button onClick={() => { setShowConfigGate(false); setConfigPw(""); setConfigPwErr(""); }} className="px-4 py-2 text-xs text-slate-400 hover:text-slate-200">Cancel</button>
              <button onClick={tryUnlock} className="px-4 py-2 bg-blue-600 hover:bg-blue-500 text-white text-xs font-semibold rounded-lg">Unlock</button>
            </div>
          </div>
        </div>
      )}

      {/* Config panel */}
      {showConfigPanel && (
        <ConfigPanel
          bu={selectedBU}
          allResources={allResourcesForConfig}
          order={(buConfig[selectedBU] || {}).order || []}
          hidden={hiddenForConfig}
          onSave={saveConfig}
          onClose={() => setShowConfigPanel(false)}
        />
      )}

      {/* Header */}
      <div className="sticky top-0 z-10 shadow-lg" style={{background:"#1e3a5f",borderBottom:"1px solid #163058"}}>
        <div className="max-w-4xl mx-auto px-4 py-3">
          <div className="flex items-center justify-between gap-3 flex-wrap">
            <div className="flex items-center gap-3">
              <a href="hub.html" title="Back to Production Hub"
                style={{display:"flex",flexDirection:"column",alignItems:"center",textDecoration:"none",gap:2,padding:"2px 8px",borderRadius:6}}
                onMouseEnter={e=>e.currentTarget.style.background="rgba(255,255,255,0.1)"}
                onMouseLeave={e=>e.currentTarget.style.background="transparent"}>
                <img src={logoSrc} alt="SMI" style={{height:26,filter:"brightness(0) invert(1)"}} />
                <span style={{fontSize:8,color:"rgba(255,255,255,0.55)",letterSpacing:"0.08em",textTransform:"uppercase",whiteSpace:"nowrap"}}>Production Hub</span>
              </a>
              <div className="flex items-center gap-2">
                <div className="w-7 h-7 bg-blue-600 rounded-lg flex items-center justify-center">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="white" strokeWidth="2.5"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
                </div>
                <div>
                  <div className="text-white font-bold text-sm leading-tight">SMI Notebook</div>
                  <div className="text-slate-500 text-xs leading-tight">Communication Board</div>
                </div>
              </div>
            </div>
            <div className="flex items-center gap-2 flex-wrap">
              <input
                type="text"
                placeholder="Search resource..."
                value={search}
                onChange={e => setSearch(e.target.value)}
                className="bg-slate-800 border border-slate-700 rounded-lg px-3 py-1.5 text-sm text-white placeholder-slate-500 w-36"
              />
              {/* Part lookup button */}
              <button
                onClick={() => setShowSkuLookup(true)}
                title="Look up part / SKU notes"
                className="flex items-center gap-1.5 px-2.5 py-1.5 bg-violet-900/40 hover:bg-violet-900/70 border border-violet-800 hover:border-violet-600 text-violet-400 hover:text-violet-200 rounded-lg text-xs font-medium transition-all"
              >
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                Part Lookup
              </button>
              {/* Initials chip */}
              {author && (
                <button
                  onClick={() => setShowInitialsPrompt(true)}
                  title="Change initials"
                  className="flex items-center gap-1.5 px-2.5 py-1.5 bg-slate-800 border border-slate-700 hover:border-blue-500 text-slate-400 hover:text-blue-300 rounded-lg text-xs transition-all"
                >
                  <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                  {author}
                </button>
              )}
              {/* Config button — only show when a specific BU is selected */}
              {selectedBU !== "All" && (
                <button
                  onClick={openConfig}
                  title="Configure layout"
                  className="flex items-center gap-1.5 px-3 py-1.5 bg-slate-800 hover:bg-slate-700 border border-slate-700 hover:border-slate-500 text-slate-400 hover:text-slate-200 rounded-lg text-xs font-medium transition-all"
                >
                  <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="12" cy="12" r="3"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M4.93 4.93a10 10 0 0 0 0 14.14"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2"/></svg>
                  Config
                  {hiddenCount > 0 && <span className="bg-amber-600 text-white text-xs rounded-full px-1.5 py-0.5 leading-none">{hiddenCount}</span>}
                </button>
              )}
            </div>
          </div>

          {/* BU tabs */}
          <div className="flex gap-1.5 mt-3 overflow-x-auto pb-1 scrollbar-none">
            {BU_LIST.map(bu => (
              <button
                key={bu}
                onClick={() => { setSelectedBU(bu); setSearch(""); }}
                className={`whitespace-nowrap px-3 py-1 rounded-lg text-xs font-semibold transition-all flex-shrink-0 ${
                  selectedBU === bu
                    ? "bg-blue-600 text-white shadow-md"
                    : "bg-slate-800 text-slate-400 hover:bg-slate-700 hover:text-slate-200"
                }`}
              >
                {bu === "All" ? "All BUs" : bu.replace("BU ", "")}
              </button>
            ))}
          </div>
        </div>
      </div>

      {/* Resource list */}
      <div className="max-w-4xl mx-auto px-4 py-4">
        {/* BU header */}
        {selectedBU !== "All" && (
          <div className="flex items-center gap-3 mb-4">
            <h2 className={`text-base font-bold ${(BU_COLORS[selectedBU] || BU_COLORS["Other"]).text}`}>
              {selectedBU}
            </h2>
            <span className="text-slate-600 text-xs">{filtered.length} resource{filtered.length !== 1 ? "s" : ""}</span>
            {hiddenCount > 0 && !search && (
              <span className="text-xs text-amber-600">{hiddenCount} hidden</span>
            )}
          </div>
        )}

        {filtered.length === 0 && (
          <div className="text-center py-12 text-slate-600">
            <p className="text-sm">No resources found</p>
            {hiddenCount > 0 && <p className="text-xs mt-1 text-slate-700">{hiddenCount} resource{hiddenCount !== 1 ? "s are" : " is"} hidden — open Config to show them</p>}
          </div>
        )}

        {filtered.map(resource => (
          <ResourceCard
            key={`${selectedBU}-${resource}`}
            name={resource}
            bu={getBUForResource(resource)}
            author={author}
            currentPart={(buildPlanMap[resource] || {}).part || null}
            currentDescr={(buildPlanMap[resource] || {}).descr || ""}
          />
        ))}
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
<div id="root"></div>
</body>
</html>
