// Build resource list per BU, including Rework at the end
function getResourcesForBU(bu) {
  const resources = Object.entries(RESOURCE_BU_MAP)
    .filter(([, b]) => b === bu)
    .map(([r]) => r);
  resources.push("Rework");
  return resources;
}

function getAllResources() {
  const all = Object.keys(RESOURCE_BU_MAP);
  all.push("Rework");
  return all;
}

// Safe Firestore key from resource name
function resourceKey(name) {
  return name.replace(/[^a-zA-Z0-9_]/g, "_");
}

function formatTs(ts) {
  if (!ts) return "";
  const d = ts.toDate ? ts.toDate() : new Date(ts);
  return d.toLocaleString("en-CA", { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit", hour12: true });
}

function formatDate(ts) {
  if (!ts) return "";
  const d = ts.toDate ? ts.toDate() : new Date(ts);
  const now = new Date();
  const diff = now - d;
  const days = Math.floor(diff / 86400000);
  if (days === 0) return "Today";
  if (days === 1) return "Yesterday";
  return `${days}d ago`;
}

// ─── SINGLE RESOURCE CARD ────────────────────────────────────────────────────
function ResourceCard({ name, bu }) {
  const [scheduled, setScheduled] = React.useState(false);
  const [notes, setNotes] = React.useState([]);
  const [showAdd, setShowAdd] = React.useState(false);
  const [noteText, setNoteText] = React.useState("");
  const [author, setAuthor] = React.useState(() => localStorage.getItem("nb_author") || "");
  const [saving, setSaving] = React.useState(false);
  const [showClear, setShowClear] = React.useState(false);
  const [clearPw, setClearPw] = React.useState("");
  const [clearErr, setClearErr] = React.useState("");
  const [showAll, setShowAll] = React.useState(false);
  const key = resourceKey(name);
  const docRef = React.useRef(null);

  React.useEffect(() => {
    docRef.current = db.collection("notebook").doc(key);
    const unsub = docRef.current.onSnapshot(snap => {
      if (snap.exists) {
        const data = snap.data();
        setScheduled(!!data.scheduled);
        setNotes((data.notes || []).sort((a, b) => {
          const ta = a.timestamp?.seconds || 0;
          const tb = b.timestamp?.seconds || 0;
          return tb - ta;
        }));
      }
    });
    return () => unsub();
  }, [db, key]);

  const toggleScheduled = async () => {
    if (!docRef.current) return;
    const next = !scheduled;
    setScheduled(next);
    await docRef.current.set({ scheduled: next }, { merge: true });
  };

  const saveNote = async () => {
    if (!noteText.trim() || !docRef.current) return;
    setSaving(true);
    const newNote = {
      id: Date.now().toString(),
      text: noteText.trim(),
      author: author.trim() || "Unknown",
      timestamp: firebase.firestore.FieldValue.serverTimestamp(),
    };
    // Store author for next time
    if (author.trim()) localStorage.setItem("nb_author", author.trim());

    // Get current notes and append
    const snap = await docRef.current.get();
    const existing = snap.exists ? (snap.data().notes || []) : [];

    // Prune notes older than 10 days
    const cutoff = Date.now() - 10 * 24 * 60 * 60 * 1000;
    const pruned = existing.filter(n => {
      if (!n.timestamp) return true;
      const ts = n.timestamp.seconds ? n.timestamp.seconds * 1000 : n.timestamp;
      return ts > cutoff;
    });

    await docRef.current.set({ notes: [...pruned, newNote] }, { merge: true });
    setNoteText("");
    setShowAdd(false);
    setSaving(false);
  };

  const confirmClear = async () => {
    if (clearPw !== "chepelare") { setClearErr("Wrong password"); return; }
    await docRef.current.set({ notes: [] }, { merge: true });
    setShowClear(false);
    setClearPw("");
    setClearErr("");
  };

  const colors = BU_COLORS[bu] || BU_COLORS["Other"];
  const visibleNotes = showAll ? notes : notes.slice(0, 3);
  const hasOlder = notes.length > 3;

  return (
    <div className={`card p-4 mb-3 transition-all ${scheduled ? "scheduled-on" : ""}`}>
      {/* Header row */}
      <div className="flex items-center justify-between gap-3 flex-wrap">
        <div className="flex items-center gap-3 min-w-0">
          <span className="font-semibold text-white text-sm truncate">{name}</span>
          <span className={`text-xs px-2 py-0.5 rounded-full font-medium ${colors.pill}`}>{bu}</span>
        </div>
        <div className="flex items-center gap-2">
          {notes.length > 0 && (
            <span className="text-xs text-slate-500">{notes.length} note{notes.length !== 1 ? "s" : ""}</span>
          )}
          {/* Scheduled toggle */}
          <button
            onClick={toggleScheduled}
            className={`flex items-center gap-1.5 px-3 py-1.5 rounded-full text-xs font-semibold transition-all border ${
              scheduled
                ? "bg-green-600 border-green-500 text-white shadow-md shadow-green-900/40"
                : "bg-slate-700 border-slate-600 text-slate-400 hover:border-slate-500"
            }`}
          >
            <span className={`w-1.5 h-1.5 rounded-full ${scheduled ? "bg-green-300" : "bg-slate-500"}`}></span>
            {scheduled ? "Scheduled" : "Not Scheduled"}
          </button>
        </div>
      </div>

      {/* Notes list */}
      {notes.length > 0 && (
        <div className="mt-3 space-y-2">
          {visibleNotes.map(note => (
            <div key={note.id} className="note-item rounded-r-lg p-2.5 fade-in">
              <p className="text-sm text-slate-200 leading-relaxed">{note.text}</p>
              <div className="flex items-center gap-2 mt-1.5">
                <span className="text-xs font-medium text-blue-400">{note.author}</span>
                <span className="text-slate-600 text-xs">·</span>
                <span className="text-xs text-slate-500">{formatTs(note.timestamp)}</span>
                <span className="text-slate-600 text-xs">·</span>
                <span className="text-xs text-slate-600">{formatDate(note.timestamp)}</span>
              </div>
            </div>
          ))}
          {hasOlder && (
            <button
              onClick={() => setShowAll(v => !v)}
              className="text-xs text-slate-500 hover:text-slate-300 ml-3 mt-1 transition-colors"
            >
              {showAll ? "▲ Show less" : `▼ Show ${notes.length - 3} more`}
            </button>
          )}
        </div>
      )}

      {/* Add note form */}
      {showAdd && (
        <div className="mt-3 fade-in space-y-2">
          <input
            type="text"
            placeholder="Your name / initials"
            value={author}
            onChange={e => setAuthor(e.target.value)}
            className="w-full bg-slate-900 border border-slate-600 rounded-lg px-3 py-1.5 text-sm text-white placeholder-slate-500"
          />
          <textarea
            autoFocus
            rows={3}
            placeholder="Add a note for the next shift..."
            value={noteText}
            onChange={e => setNoteText(e.target.value)}
            onKeyDown={e => { if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) saveNote(); }}
            className="w-full bg-slate-900 border border-slate-600 rounded-lg px-3 py-2 text-sm text-white placeholder-slate-500 resize-none"
          />
          <div className="flex gap-2 items-center">
            <button
              onClick={saveNote}
              disabled={!noteText.trim() || saving}
              className="bg-blue-600 hover:bg-blue-500 disabled:opacity-40 text-white text-xs font-semibold px-4 py-1.5 rounded-lg transition-colors flex items-center gap-1.5"
            >
              {saving && <span className="saving-dot"></span>}
              {saving ? "Saving..." : "Save Note"}
            </button>
            <button onClick={() => { setShowAdd(false); setNoteText(""); }} className="text-xs text-slate-500 hover:text-slate-300 px-2 py-1.5 transition-colors">Cancel</button>
            <span className="text-xs text-slate-600 ml-auto">Ctrl+Enter to save</span>
          </div>
        </div>
      )}

      {/* Clear notes modal */}
      {showClear && (
        <div className="mt-3 fade-in bg-slate-900 border border-red-900 rounded-lg p-3 space-y-2">
          <p className="text-xs text-red-400 font-medium">Enter password to clear all notes for this resource:</p>
          <div className="flex gap-2">
            <input
              type="password"
              placeholder="Password"
              value={clearPw}
              onChange={e => { setClearPw(e.target.value); setClearErr(""); }}
              onKeyDown={e => e.key === "Enter" && confirmClear()}
              autoFocus
              className="flex-1 bg-slate-800 border border-slate-600 rounded-lg px-3 py-1.5 text-sm text-white placeholder-slate-500"
            />
            <button onClick={confirmClear} className="bg-red-700 hover:bg-red-600 text-white text-xs font-semibold px-3 py-1.5 rounded-lg">Clear</button>
            <button onClick={() => { setShowClear(false); setClearPw(""); setClearErr(""); }} className="text-xs text-slate-500 hover:text-slate-300 px-2">Cancel</button>
          </div>
          {clearErr && <p className="text-xs text-red-400">{clearErr}</p>}
        </div>
      )}

      {/* Action bar */}
      {!showAdd && !showClear && (
        <div className="mt-3 flex items-center gap-3">
          <button
            onClick={() => { setShowAdd(true); }}
            className="text-xs text-blue-400 hover:text-blue-300 font-medium transition-colors flex items-center gap-1"
          >
            <span className="text-base leading-none">+</span> Add Note
          </button>
          {notes.length > 0 && (
            <button
              onClick={() => setShowClear(true)}
              className="text-xs text-slate-600 hover:text-red-400 transition-colors ml-auto"
            >
              Clear notes
            </button>
          )}
        </div>
      )}
    </div>
  );
}

    return resources.filter(r => r.toLowerCase().includes(search.toLowerCase()));

        {selectedBU !== "All" && (
          <div className="flex items-center gap-3 mb-4">
            <h2 className={`text-base font-bold ${(BU_COLORS[selectedBU] || BU_COLORS["Other"]).text}`}>
              {selectedBU}
            </h2>
            <span className="text-slate-600 text-xs">{filtered.length} resource{filtered.length !== 1 ? "s" : ""}</span>
          </div>
        )}

        {filtered.length === 0 && (
          <div className="text-center py-12 text-slate-600">
            <p className="text-sm">No resources found</p>
          </div>
        )}

        {filtered.map(resource => (
          <ResourceCard
            key={`${selectedBU}-${resource}`}
            name={resource}
            bu={getBUForResource(resource)}
          />
        ))}
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
<div id="root"></div>
</body>
</html>
