function parseXlsm(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      try {
        const data = new Uint8Array(e.target.result);
        const wb = XLSX.read(data, { type: 'array', cellDates: true });
        const ws = wb.Sheets['SMI TRACKER'];
        if (!ws) return reject(new Error("Sheet 'SMI TRACKER' not found"));
        const rows = XLSX.utils.sheet_to_json(ws, { header: 1, raw: false, dateNF: 'yyyy-mm-dd' });
        const headerRow = rows[4] || [];
        const weekCols = [];
        for (let i = 9; i < headerRow.length; i++) {
          const v = headerRow[i];
          if (v && /^\d{4}-\d{2}-\d{2}/.test(String(v).trim())) {
            weekCols.push({ idx: i, label: String(v).trim().slice(0, 10) });
          }
        }
        const results = [];
        for (let r = 5; r < rows.length; r++) {
          const row = rows[r];
          const resource = row[0], partId = row[3], desc = row[4], rowType = row[8];
          if (rowType === 'Build Plan' && resource && partId) {
            const weeks = {};
            for (const { idx, label } of weekCols) {
              const qty = parseFloat(row[idx]);
              if (!isNaN(qty) && qty !== 0) weeks[label] = Math.round(qty);
            }
            if (Object.keys(weeks).length > 0) {
              results.push({ resource: String(resource).trim(), part_id: String(partId).trim(), description: desc ? String(desc).trim() : '', weeks });
            }
          }
        }
        resolve(results);
      } catch (err) { reject(err); }
    };
    reader.onerror = () => reject(new Error('File read error'));
    reader.readAsArrayBuffer(file);
  });
}

function fmtWeek(d) {
  const dt = new Date(d + 'T00:00:00');
  return dt.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
}
function fmtQty(n) { return n >= 1000 ? n.toLocaleString() : String(n); }

  const [selectedWeek, setSelectedWeek] = useState('');
  const [viewMode, setViewMode] = useState('week');

  const today = new Date().toISOString().slice(0, 10);

  const allWeeks = useMemo(() => {
    const s = new Set();
    data.forEach(r => Object.keys(r.weeks).forEach(w => s.add(w)));
    return Array.from(s).sort();
  }, [data]);

  const defaultWeek = useMemo(() => {
    return allWeeks.find(w => w >= today) || allWeeks[0] || '';
  }, [allWeeks, today]);

  const currentWeek = selectedWeek || defaultWeek;

  const filtered = useMemo(() => {
    const q = search.toLowerCase();
    if (!q) return data;
    return data.filter(r => r.resource.toLowerCase().includes(q) || r.part_id.toLowerCase().includes(q) || r.description.toLowerCase().includes(q));
  }, [data, search]);

  const weekRows = useMemo(() => filtered.filter(r => r.weeks[currentWeek] != null), [filtered, currentWeek]);

  const visibleWeeks = useMemo(() => allWeeks.filter(w => w >= today).slice(0, 8), [allWeeks, today]);

  const handleUpload = useCallback(async (file) => {
    if (!file) return;
    setUploading(true); setUploadError('');
    try {
      const parsed = await parseXlsm(file);
      if (parsed.length === 0) throw new Error('No Build Plan rows found in SMI TRACKER sheet.');
      setData(parsed);
      setDataDate(new Date().toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }));
      setSelectedWeek('');
    } catch (err) { setUploadError(err.message || 'Failed to parse file.'); }
    finally { setUploading(false); }
  }, []);

  const onFileInput = useCallback((e) => { const f = e.target.files[0]; if (f) handleUpload(f); e.target.value = ''; }, [handleUpload]);
  const onDrop = useCallback((e) => { e.preventDefault(); const f = e.dataTransfer.files[0]; if (f) handleUpload(f); }, [handleUpload]);

  return (
    <div style={{minHeight:'100vh',background:'#030712',color:'#f9fafb',display:'flex',flexDirection:'column',fontFamily:'system-ui,sans-serif'}}>
      {/* Header */}
      <div style={{background:'#111827',borderBottom:'1px solid #1f2937',padding:'16px 24px',display:'flex',alignItems:'center',justifyContent:'space-between',flexWrap:'wrap',gap:12}}>
        <div>
          <div style={{fontSize:18,fontWeight:600,color:'#fff'}}>SMI Build Plan Tracker</div>
          <div style={{fontSize:12,color:'#9ca3af',marginTop:2}}>Data as of {dataDate} · {data.length} parts</div>
        </div>
        <label style={{display:'flex',alignItems:'center',gap:8,cursor:'pointer',background:'#2563eb',color:'#fff',fontSize:13,fontWeight:500,padding:'8px 16px',borderRadius:8,border:'none'}}
          onDragOver={e=>e.preventDefault()} onDrop={onDrop}>
          {uploading ? <span>Parsing…</span> : <span>⬆ Update File (.xlsm/.xlsx)</span>}
          <input type="file" accept=".xlsm,.xlsx" style={{display:'none'}} onChange={onFileInput} />
        </label>
      </div>

      {uploadError && <div style={{background:'rgba(127,29,29,0.6)',borderBottom:'1px solid #991b1b',color:'#fca5a5',padding:'10px 24px',fontSize:13}}>⚠ {uploadError}</div>}

      {/* Controls */}
      <div style={{background:'rgba(17,24,39,0.5)',borderBottom:'1px solid #1f2937',padding:'10px 24px',display:'flex',alignItems:'center',gap:12,flexWrap:'wrap'}}>
        <input type="text" placeholder="Search part, resource, description…" value={search} onChange={e=>setSearch(e.target.value)}
          style={{flex:1,minWidth:200,background:'#1f2937',border:'1px solid #374151',borderRadius:8,padding:'8px 12px',fontSize:13,color:'#f9fafb',outline:'none'}} />
        <div style={{display:'flex',borderRadius:8,overflow:'hidden',border:'1px solid #374151'}}>
          {['week','table'].map(m => (
            <button key={m} onClick={()=>setViewMode(m)}
              style={{padding:'8px 14px',fontSize:13,fontWeight:500,cursor:'pointer',border:'none',background:viewMode===m?'#2563eb':'#1f2937',color:viewMode===m?'#fff':'#9ca3af'}}>
              {m==='week' ? 'Week View' : 'Multi-Week'}
            </button>
          ))}
        </div>
      </div>

      {/* Week selector */}
      {viewMode === 'week' && (
        <div style={{background:'rgba(17,24,39,0.3)',borderBottom:'1px solid #1f2937',padding:'10px 24px'}}>
          <div style={{display:'flex',alignItems:'center',gap:8,flexWrap:'wrap'}}>
            <span style={{fontSize:11,color:'#6b7280',fontWeight:600,textTransform:'uppercase',letterSpacing:'0.05em'}}>Week of:</span>
            {allWeeks.map(w => (
              <button key={w} onClick={()=>setSelectedWeek(w)}
                style={{fontSize:12,padding:'5px 12px',borderRadius:20,cursor:'pointer',border:'1px solid',
                  background: w===currentWeek?'#2563eb': w===defaultWeek?'#1f2937':'#1f2937',
                  borderColor: w===currentWeek?'#3b82f6': w===defaultWeek?'#1e3a5f':'#374151',
                  color: w===currentWeek?'#fff': w===defaultWeek?'#93c5fd':'#9ca3af',
                  fontWeight: w===currentWeek?600:400}}>
                {fmtWeek(w)}
              </button>
            ))}
          </div>
        </div>
      )}

      {/* Content */}
      <div style={{flex:1,overflow:'auto',padding:24}}>
        {viewMode === 'week' ? <WeekView rows={weekRows} week={currentWeek} /> : <TableView rows={filtered} weeks={visibleWeeks} allWeeks={allWeeks} />}
      </div>
    </div>
  );
}

function WeekView({ rows, week }) {
  if (!week) return <div style={{textAlign:'center',color:'#6b7280',paddingTop:80}}>No data loaded.</div>;
  if (rows.length === 0) return <div style={{textAlign:'center',color:'#6b7280',paddingTop:80}}>No build plan for week of {fmtWeek(week)}.</div>;
  const total = rows.reduce((s,r) => s+(r.weeks[week]||0), 0);
  return (
    <div>
      <div style={{color:'#9ca3af',fontSize:13,marginBottom:16}}>
        <span style={{color:'#fff',fontWeight:600}}>{rows.length}</span> parts · <span style={{color:'#fff',fontWeight:600}}>{total.toLocaleString()}</span> total units
      </div>
      <div style={{display:'grid',gap:8}}>
        {rows.map(r => (
          <div key={r.part_id} style={{background:'#111827',border:'1px solid #1f2937',borderRadius:12,padding:'12px 20px',display:'flex',alignItems:'center',justifyContent:'space-between',gap:16}}>
            <div style={{minWidth:0}}>
              <div style={{color:'#fff',fontWeight:500,fontSize:14,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{r.description || r.part_id}</div>
              <div style={{color:'#6b7280',fontSize:12,marginTop:3,display:'flex',gap:10}}>
                <span>{r.resource}</span><span style={{color:'#374151'}}>·</span><span>{r.part_id}</span>
              </div>
            </div>
            <div style={{textAlign:'right',flexShrink:0}}>
              <div style={{fontSize:26,fontWeight:700,color:'#60a5fa'}}>{fmtQty(r.weeks[week])}</div>
              <div style={{color:'#4b5563',fontSize:11}}>units</div>
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

function TableView({ rows, weeks, allWeeks }) {
  const [showAll, setShowAll] = useState(false);
  const displayWeeks = showAll ? allWeeks : weeks;
  if (rows.length === 0) return <div style={{textAlign:'center',color:'#6b7280',paddingTop:80}}>No results.</div>;
  return (
    <div>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:12,flexWrap:'wrap',gap:8}}>
        <div style={{color:'#9ca3af',fontSize:13}}>
          <span style={{color:'#fff',fontWeight:600}}>{rows.length}</span> parts · <span style={{color:'#fff',fontWeight:600}}>{displayWeeks.length}</span> weeks
        </div>
        <button onClick={()=>setShowAll(v=>!v)} style={{fontSize:12,color:'#60a5fa',background:'transparent',border:'1px solid #374151',borderRadius:8,padding:'6px 12px',cursor:'pointer'}}>
          {showAll ? 'Show near-term only' : `Show all ${allWeeks.length} weeks`}
        </button>
      </div>
      <div style={{overflowX:'auto',borderRadius:12,border:'1px solid #1f2937'}}>
        <table style={{minWidth:'100%',borderCollapse:'collapse',fontSize:13}}>
          <thead>
            <tr style={{background:'#111827',color:'#9ca3af',fontSize:11,textTransform:'uppercase',letterSpacing:'0.05em'}}>
              <th style={{position:'sticky',left:0,zIndex:10,background:'#111827',padding:'10px 16px',textAlign:'left',borderBottom:'1px solid #1f2937',borderRight:'1px solid #1f2937',minWidth:180,whiteSpace:'nowrap'}}>Part</th>
              <th style={{position:'sticky',left:180,zIndex:10,background:'#111827',padding:'10px 16px',textAlign:'left',borderBottom:'1px solid #1f2937',borderRight:'1px solid #1f2937',minWidth:160,whiteSpace:'nowrap'}}>Resource</th>
              {displayWeeks.map(w => <th key={w} style={{padding:'10px 12px',textAlign:'center',borderBottom:'1px solid #1f2937',minWidth:72,whiteSpace:'nowrap'}}>{fmtWeek(w)}</th>)}
            </tr>
          </thead>
          <tbody>
            {rows.map((r,i) => {
              const bg = i%2===0 ? '#030712' : 'rgba(17,24,39,0.4)';
              return (
                <tr key={r.part_id} style={{borderBottom:'1px solid rgba(31,41,55,0.5)'}}>
                  <td style={{position:'sticky',left:0,zIndex:5,background:bg,padding:'10px 16px',borderRight:'1px solid #1f2937',minWidth:180}}>
                    <div style={{color:'#f3f4f6',fontWeight:500,fontSize:12,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',maxWidth:160}}>{r.description||r.part_id}</div>
                    <div style={{color:'#4b5563',fontSize:11,marginTop:2,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{r.part_id}</div>
                  </td>
                  <td style={{position:'sticky',left:180,zIndex:5,background:bg,padding:'10px 16px',borderRight:'1px solid #1f2937',minWidth:160,color:'#9ca3af',fontSize:12,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',maxWidth:160}}>{r.resource}</td>
                  {displayWeeks.map(w => {
                    const qty = r.weeks[w];
                    return <td key={w} style={{padding:'10px 12px',textAlign:'center',whiteSpace:'nowrap'}}>
                      {qty != null ? <span style={{color:'#93c5fd',fontWeight:600}}>{fmtQty(qty)}</span> : <span style={{color:'#1f2937'}}>—</span>}
                    </td>;
                  })}
                </tr>
              );
            })}
          </tbody>
        </table>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
