<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0f1117;
    --surface: #1a1d27;
    --surface2: #22263a;
    --border: #2e3248;
    --border-light: #3a3f5c;
    --text: #e8eaf0;
    --text-muted: #7b82a0;
    --text-dim: #4a5070;
    --accent: #4f6ef7;
    --accent-dim: rgba(79,110,247,0.15);
    --green: #22c55e;
    --green-bg: rgba(34,197,94,0.12);
    --red: #ef4444;
    --red-bg: rgba(239,68,68,0.12);
    --amber: #f59e0b;
    --amber-bg: rgba(245,158,11,0.12);
    --pink-row: rgba(239,68,68,0.07);

  body { background: var(--bg); color: var(--text); font-family: var(--sans); min-height: 100vh; }

  /* HEADER */
  .header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 0 24px;
    height: 56px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;

  .header-left { display: flex; align-items: center; gap: 16px; }
  .hub-link {

    text-decoration: none; cursor: pointer; background: none; border: none;

  .hub-link:hover { background: var(--surface2); }
  .hub-link .logo-text { font-size: 9px; font-weight: 700; letter-spacing: 0.08em; color: var(--text-muted); margin-top: 3px; }
  .smi-logo { font-size: 20px; font-weight: 700; color: var(--accent); font-family: var(--mono); }
  .app-title { font-size: 18px; font-weight: 600; color: var(--text); }

  .header-center { display: flex; align-items: center; gap: 8px; }

  .week-display {

  /* Additional comment input */

  .comment-cell:focus { background: var(--surface2); border: 1px solid var(--border-light); }

  /* SKU text */

  /* Loading / empty */

  /* Status dot */
  .status-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green); display: inline-block; animation: pulse 2s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

  /* Date picker overlay */
  .date-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 200;
    display: flex; align-items: flex-start; justify-content: center; padding-top: 80px;
  }
  .date-picker-box {
    background: var(--surface); border: 1px solid var(--border-light);
    border-radius: 10px; padding: 20px; min-width: 260px;
  }
  .date-picker-box label { font-size: 12px; color: var(--text-muted); display: block; margin-bottom: 8px; }
  .date-picker-box input[type="date"] {
    width: 100%; background: var(--surface2); border: 1px solid var(--border-light);
    color: var(--text); font-size: 14px; padding: 8px 12px; border-radius: 6px;
    font-family: var(--sans); outline: none; margin-bottom: 12px;
  }
  .date-picker-box input[type="date"]:focus { border-color: var(--accent); }
  .dp-btns { display: flex; gap: 8px; justify-content: flex-end; }
  .dp-btn { padding: 7px 16px; border-radius: 6px; font-size: 13px; font-weight: 600; cursor: pointer; border: none; font-family: var(--sans); }
  .dp-btn.cancel { background: var(--surface2); color: var(--text-muted); }
  .dp-btn.confirm { background: var(--accent); color: #fff; }

  /* Column header row (top of table) */
  .col-headers {
    display: grid;
    grid-template-columns: 220px 48px 90px 90px 70px 80px 160px 1fr 200px;
    padding: 8px 12px;
    background: #13162080;

    gap: 4px;
  }
  .col-h {
    font-size: 10px; font-weight: 600; color: var(--text-dim);
    letter-spacing: 0.06em; text-transform: uppercase; text-align: right;
  }
  .col-h.left { text-align: left; }

  /* No data placeholder */

  @media (max-width: 1100px) {

    .resource-header, .shift-row, .totals-row, .col-headers {

<script type="text/babel">
dayjs.extend(dayjs_plugin_isoWeek);
dayjs.extend(dayjs_plugin_weekOfYear);

// ─── CONSTANTS ───────────────────────────────────────────────────────────────
const SHIFTS = ['M','D','A'];
const SHIFT_LABEL = { M:'Morning', D:'Day', A:'Afternoon' };
const PPH_TARGET = 4;
const BUS = [
  'All BUs',
  'BU Verathon',
  'BU Molding',
  'BU Tier 1',
  'BU Tier 1 - Respiratory',
  'BU Tier 1 - Blades',
  'BU Tier 2',
  'BU Tier 2 - DNA',
  'BU Tier 2 - FLEX',
  'BU Bell Farm',
];

// ─── HELPERS ─────────────────────────────────────────────────────────────────
function getWeekBounds(d) {
  const start = d.isoWeekday(1); // Monday
  return { start, end: start.add(6,'day') };
}
function fmtWeek(d) {
  const { start, end } = getWeekBounds(d);
  return `Wk ${d.isoWeek()} · ${start.format('MMM D')} – ${end.format('MMM D, YYYY')}`;
}
function fmtPPH(actual, hrs) {
  if (!hrs || hrs === 0) return null;
  return (actual / hrs).toFixed(2);
}

// ─── LEADER → BU MAP (mirrors BuildTracker) ───────────────────────────────────
const LEADER_TO_BU = {
  "George":                  "BU Verathon",
  "Andrew B.":               "BU Molding",
  "Mark P.":                 "BU Tier 1",
  "Lori F.":                 "BU Tier 2",
  "Rob S.":                  "BU Bell Farm",
  "BU Verathon":             "BU Verathon",
  "BU Molding":              "BU Molding",
  "BU Tier 1":               "BU Tier 1",
  "BU Tier 1 - Respiratory": "BU Tier 1 - Respiratory",
  "BU Tier 1 - Blades":      "BU Tier 1 - Blades",
  "BU Tier 2":               "BU Tier 2",
  "BU Tier 2 - DNA":         "BU Tier 2 - DNA",
  "BU Tier 2 - FLEX":        "BU Tier 2 - FLEX",
  "BU Bell Farm":            "BU Bell Farm",
  "BU Bellfarm":             "BU Bell Farm",
};

// Map shift index/label from shift_reports to M/D/A
// shift_reports use shiftNumber 1/2/3 or label S1/S2/S3
function toShiftCode(raw) {
  if (!raw) return null;
  const s = String(raw).trim();
  if (s==='1'||s==='S1'||s.toLowerCase()==='morning'||s==='M') return 'M';
  if (s==='2'||s==='S2'||s.toLowerCase()==='day'||s==='D')     return 'D';
  if (s==='3'||s==='S3'||s.toLowerCase()==='afternoon'||s==='A') return 'A';
  return null;
}

// Extract ISO week key from a JS Date or Firestore Timestamp
function weekKeyFromDate(d) {
  const dt = d && d.toDate ? d.toDate() : new Date(d);
  const day = dayjs(dt);
  return `${day.year()}-W${String(day.isoWeek()).padStart(2,'0')}`;
}

// ─── LOAD FROM FIRESTORE ───────────────────────────────────────────────────────
// VERBuildPlan stores: production_data/ver_build_plan → { rows: [ { resource, part_id, description, weeks: { "YYYY-MM-DD": qty } } ] }
// Week keys are Monday dates (YYYY-MM-DD). We sum all part rows for a resource to get the weekly plan total.

// Convert ISO week key (e.g. "2026-W41") → Monday date string "YYYY-MM-DD"
function weekKeyToMonday(weekKey) {
  const [yearStr, wStr] = weekKey.split('-W');
  const year = parseInt(yearStr), week = parseInt(wStr);
  // Jan 4 is always in week 1 (ISO)
  const jan4 = new Date(year, 0, 4);
  const jan4Day = jan4.getDay() || 7; // 1=Mon ... 7=Sun
  const monday = new Date(jan4);
  monday.setDate(jan4.getDate() - (jan4Day - 1) + (week - 1) * 7);
  return monday.toISOString().slice(0, 10);
}

async function loadFromFirestore(weekKey) {
  // ── 1. Build plan from VERBuildPlan ──────────────────────────────────────────
  // Collection: production_data, doc: ver_build_plan
  // rows: [ { resource: "LPS3 HDMI", part_id: "VER1/...", description: "...", weeks: { "2026-10-05": 1050, ... } } ]
  const mondayKey = weekKeyToMonday(weekKey); // e.g. "2026-10-06" for W41 2026

  const planSnap = await db.collection('production_data').doc('ver_build_plan').get();
  const planDoc  = planSnap.exists ? planSnap.data() : {};
  const planRows = planDoc.rows || [];

  // Aggregate plan qty per resource for this week's Monday
  // (multiple part_id rows per resource → sum them)
  const planMap = {}; // resourceName → { totalPlan, descriptions[] }
  planRows.forEach(row => {
    const name = (row.resource || '').trim();
    if (!name) return;
    const qty = Number((row.weeks || {})[mondayKey] || 0);
    if (!planMap[name]) planMap[name] = { plan: 0, description: row.description || '' };
    planMap[name].plan += qty;
    // Keep first non-empty description as the resource description
    if (!planMap[name].description && row.description) planMap[name].description = row.description;
  });

  // ── 2. Shift reports for this week ───────────────────────────────────────────
  // shift_reports docs: { leader, shiftNumber, date (Timestamp), resources: [ { name, qty, hrs, sku, notes } ] }
  const reportsSnap = await db.collection('shift_reports').get();
  // Filter to this week client-side (avoids composite index requirement)
  const weekReports = [];
  reportsSnap.forEach(doc => {
    const d = doc.data();
    const dateField = d.date || d.shiftDate || d.ts || d.timestamp;
    if (!dateField) return;
    if (weekKeyFromDate(dateField) !== weekKey) return;
    weekReports.push(d);
  });

  // ── 3. Build resource list + shift data from reports ─────────────────────────
  // resourceMap: resourceName → { id, name, bu, plan, shifts: { M:{}, D:{}, A:{} } }
  const resourceMap = {};

  // Seed from VER build plan — all these resources are BU Verathon
  Object.entries(planMap).forEach(([name, info]) => {
    if (info.plan === 0) return; // skip resources with no plan this week
    resourceMap[name] = {
      id: name,
      name,
      bu: 'BU Verathon',
      plan: info.plan,
      description: info.description,
      shifts: { M: null, D: null, A: null },
    };
  });

  // Merge actuals from shift reports
  weekReports.forEach(report => {
    const shiftCode = toShiftCode(report.shiftNumber || report.shift || report.shiftLabel);
    if (!shiftCode) return;
    const bu = LEADER_TO_BU[report.leader || ''] || report.leader || '';
    const rows = report.resources || report.lines || [];
    rows.forEach(row => {
      const rName = row.name || row.resource || row.line || '';
      if (!rName) return;
      if (!resourceMap[rName]) {
        resourceMap[rName] = {
          id: rName,
          name: rName,
          bu,
          plan: planMap[rName] ? planMap[rName].plan : 0,
          shifts: { M: null, D: null, A: null },
        };
      }
      // Only take the best/latest entry per shift (last write wins)
      resourceMap[rName].shifts[shiftCode] = {
        actual: Number(row.qty || row.actual || row.units || row.quantity || 0),
        hrs:    Number(row.hrs || row.hours || row.labourHrs || row.labr_hrs || row.labor_hrs || 0),
        sku:    row.sku || row.part_id || row.part || row.description || planMap[rName]?.description || '',
        notes:  row.notes || row.note || row.comments || row.comment || '',
      };
      // Fill in BU from report leader if missing
      if (!resourceMap[rName].bu && bu) resourceMap[rName].bu = bu;
    });
  });

  // Convert resourceMap to flat arrays
  const resources = Object.values(resourceMap).sort((a,b) => a.name.localeCompare(b.name));

  // Build shiftData keyed as "resourceName-shiftCode"
  const shiftData = {};
  resources.forEach(r => {
    SHIFTS.forEach(s => {
      shiftData[`${r.id}-${s}`] = r.shifts[s] || { actual:0, hrs:0, sku:'', notes:'' };
    });
  });

  // ── 4. Load saved comments ───────────────────────────────────────────────────
  const commentsSnap = await db.collection('attainment_comments').doc(weekKey).get();
  const savedComments = commentsSnap.exists ? commentsSnap.data() : {};

  return { resources, shiftData, savedComments };
}

// ─── COMPONENTS ───────────────────────────────────────────────────────────────
const { useState, useEffect, useRef, useCallback } = React;

function PPHBadge({ actual, hrs }) {
  const pph = fmtPPH(actual, hrs);
  if (pph === null) return <span className="pph-badge pph-none">—</span>;
  const ok = parseFloat(pph) >= PPH_TARGET;
  return <span className={`pph-badge ${ok ? 'pph-green' : 'pph-red'}`}>{pph}</span>;
}

function AttainmentBadge({ actual, plan }) {
  if (!plan) return <span className="attainment-badge att-none">No plan</span>;
  const pct = Math.round((actual / plan) * 100);
  const ok = pct >= 100;
  return (
    <span className={`attainment-badge ${ok ? 'att-green' : 'att-red'}`}>
      {pct}%
    </span>
  );
}

function ShiftBadge({ s }) {
  return <span className={`shift-badge shift-${s}`}>{s}</span>;
}

function ResourceBlock({ resource, shiftData, comments, onCommentChange }) {
  const shifts = SHIFTS.map(s => {
    const key = `${resource.id}-${s}`;
    return { s, key, ...(shiftData[key] || { actual:0, hrs:0, sku:'', notes:'' }) };
  });

  const totalActual = shifts.reduce((sum, r) => sum + (r.actual || 0), 0);
  const totalHrs = shifts.reduce((sum, r) => sum + (r.hrs || 0), 0);

  return (
    <div className="resource-block">
      {/* Shift rows */}
      {shifts.map(({ s, key, actual, hrs, sku, notes }) => {
        const hasData = actual > 0 || hrs > 0;
        const pph = fmtPPH(actual, hrs);
        const pphOk = pph !== null && parseFloat(pph) >= PPH_TARGET;
        const rowClass = hasData ? (pphOk ? 'green-row' : 'red-row') : '';
        return (
          <div key={key} className={`shift-row ${rowClass}`}>
            <div className="cell left" style={{paddingLeft: 8}}>
              {s === 'M' ? <span className="resource-name">{resource.name}</span> : <span />}
            </div>
            <div className="cell"><ShiftBadge s={s}/></div>
            <div className="cell muted">{s === 'M' ? resource.plan?.toLocaleString() ?? '—' : ''}</div>
            <div className="cell">{hasData ? actual.toLocaleString() : <span className="empty-shift">—</span>}</div>
            <div className="cell muted">{hasData ? hrs : <span className="empty-shift">—</span>}</div>
            <div className="cell"><PPHBadge actual={actual} hrs={hrs}/></div>
            <div className="cell left"><span className="sku-text">{sku || ''}</span></div>
            <div className="cell left"><span className="notes-text">{notes || ''}</span></div>
            <div className="cell">
              <textarea
                className="comment-cell"
                rows={1}
                placeholder="Add note…"
                value={comments[key] || ''}
                onChange={e => onCommentChange(key, e.target.value)}
              />
            </div>
          </div>
        );
      })}
      {/* Totals row */}
      <div className="totals-row">
        <div className="cell left" style={{paddingLeft:8, fontSize:11, color:'var(--text-muted)', fontFamily:'var(--sans)'}}>Week total</div>
        <div></div>
        <div className="cell"><AttainmentBadge actual={totalActual} plan={resource.plan}/></div>
        <div className="cell" style={{color:'var(--text)', fontWeight:700}}>{totalActual.toLocaleString()}</div>
        <div className="cell muted">{totalHrs}</div>
        <div className="cell"><PPHBadge actual={totalActual} hrs={totalHrs}/></div>
        <div></div>
        <div></div>
        <div></div>
      </div>
    </div>
  );
}

function App() {
  const [currentDay, setCurrentDay] = useState(dayjs());
  const [showDatePicker, setShowDatePicker] = useState(false);
  const [datePickerVal, setDatePickerVal] = useState('');
  const [selectedBU, setSelectedBU] = useState('All BUs');
  const [loading, setLoading] = useState(false);
  const [resources, setResources] = useState([]);
  const [shiftData, setShiftData] = useState({});
  const [comments, setComments] = useState({});
  const [lastRefresh, setLastRefresh] = useState(null);

  const weekKey = `${currentDay.year()}-W${String(currentDay.isoWeek()).padStart(2,'0')}`;

  // Load data from Firestore
  const loadData = useCallback(() => {
    setLoading(true);
    loadFromFirestore(weekKey)
      .then(({ resources, shiftData, savedComments }) => {
        setResources(resources);
        setShiftData(shiftData);
        setComments(savedComments);
        setLastRefresh(dayjs());
        setLoading(false);
      })
      .catch(err => {
        console.error('Attainment load error:', err);
        setLoading(false);
      });
  }, [weekKey]);

  useEffect(() => { loadData(); }, [loadData]);

  // Debounced comment save to Firestore
  const saveTimer = useRef(null);
  const handleCommentChange = (key, val) => {
    const next = { ...comments, [key]: val };
    setComments(next);
    if (saveTimer.current) clearTimeout(saveTimer.current);
    saveTimer.current = setTimeout(() => {
      db.collection('attainment_comments').doc(weekKey)
        .set(next, { merge: true })
        .catch(e => console.error('Comment save error:', e));
    }, 800);
  };

  // BU filter — parent BU includes subdivisions (e.g. "BU Tier 1" also shows Respiratory + Blades)
  const filteredResources = selectedBU === 'All BUs'
    ? resources
    : resources.filter(r => {
        if (!r.bu) return false;
        if (r.bu === selectedBU) return true;
        // Parent match: "BU Tier 1" matches "BU Tier 1 - Respiratory" etc.
        if (r.bu.startsWith(selectedBU + ' - ')) return true;
        return false;
      });

  // Week summaries
  const totalPlan = filteredResources.reduce((s, r) => s + (r.plan || 0), 0);
  const totalActual = filteredResources.reduce((s, r) => {
    return s + SHIFTS.reduce((ss, sh) => {
      const d = shiftData[`${r.id}-${sh}`];
      return ss + (d ? d.actual || 0 : 0);
    }, 0);
  }, 0);
  const totalHrs = filteredResources.reduce((s, r) => {
    return s + SHIFTS.reduce((ss, sh) => {
      const d = shiftData[`${r.id}-${sh}`];
      return ss + (d ? d.hrs || 0 : 0);
    }, 0);
  }, 0);
  const overallPPH = fmtPPH(totalActual, totalHrs);
  const overallAtt = totalPlan ? Math.round((totalActual / totalPlan) * 100) : null;

  const prevWeek = () => setCurrentDay(d => d.subtract(1,'week'));
  const nextWeek = () => setCurrentDay(d => d.add(1,'week'));
  const openDatePicker = () => {
    setDatePickerVal(currentDay.format('YYYY-MM-DD'));
    setShowDatePicker(true);
  };
  const confirmDate = () => {
    if (datePickerVal) setCurrentDay(dayjs(datePickerVal));
    setShowDatePicker(false);
  };

  return (
    <>
      {/* HEADER */}
      <div className="header">
        <div className="header-left">
          <button className="hub-link" onClick={() => window.location.href='hub.html'}>
            <span className="smi-logo">SMI</span>
            <span className="logo-text">PRODUCTION HUB</span>
          </button>
          <div>
            <div className="app-title">Attainment</div>
            <div className="app-subtitle">Weekly production vs plan</div>
          </div>
        </div>

        <div className="header-center">
          <button className="week-nav-btn" onClick={prevWeek} title="Previous week">‹</button>
          <button className="week-display" onClick={openDatePicker}>{fmtWeek(currentDay)}</button>
          <button className="week-nav-btn" onClick={nextWeek} title="Next week">›</button>
        </div>

        <div className="header-right">
          <select className="bu-select" value={selectedBU} onChange={e => setSelectedBU(e.target.value)}>
            {BUS.map(b => <option key={b}>{b}</option>)}
          </select>
          <button className="refresh-btn" onClick={loadData}>↺ Refresh</button>
          {lastRefresh && (
            <span style={{fontSize:11,color:'var(--text-dim)'}}>
              <span className="status-dot" style={{marginRight:5}}/>
              {lastRefresh.format('HH:mm')}
            </span>
          )}
        </div>
      </div>

      {/* MAIN */}
      <div className="main">

        {/* Week summary bar */}
        <div className="week-summary">
          <div className="summary-card">
            <div className="label">Week plan</div>
            <div className="value">{totalPlan.toLocaleString()}</div>
          </div>
          <div className="summary-card">
            <div className="label">Week actual</div>
            <div className="value">{totalActual.toLocaleString()}</div>
          </div>
          <div className="summary-card">
            <div className="label">Attainment</div>
            <div className={`value ${overallAtt === null ? '' : overallAtt >= 100 ? 'green' : 'red'}`}>
              {overallAtt !== null ? `${overallAtt}%` : '—'}
            </div>
          </div>
          <div className="summary-card">
            <div className="label">Total hours</div>
            <div className="value">{totalHrs}</div>
          </div>
          <div className="summary-card">
            <div className="label">Overall PPH</div>
            <div className={`value ${overallPPH === null ? '' : parseFloat(overallPPH) >= PPH_TARGET ? 'green' : 'red'}`}>
              {overallPPH ?? '—'}
            </div>
          </div>
          <div className="summary-card">
            <div className="label">Lines tracked</div>
            <div className="value">{filteredResources.length}</div>
          </div>
        </div>

        {/* Table */}
        {loading ? (
          <div className="table-wrap">
            <div className="state-msg">
              <div className="big">⏳</div>
              Loading week {weekKey}…
            </div>
          </div>
        ) : filteredResources.length === 0 ? (
          <div className="table-wrap">
            <div className="state-msg">
              <div className="big">📋</div>
              No data for {selectedBU} — {fmtWeek(currentDay)}
            </div>
          </div>
        ) : (
          <div className="table-wrap">
            {/* Column headers */}
            <div className="col-headers">
              <div className="col-h left">Resource / Line</div>
              <div className="col-h">Shift</div>
              <div className="col-h">Plan</div>
              <div className="col-h">Actual</div>
              <div className="col-h">Hrs</div>
              <div className="col-h">PPH</div>
              <div className="col-h left">SKU</div>
              <div className="col-h left">Notes</div>
              <div className="col-h left">Comments</div>
            </div>
            {filteredResources.map(r => (
              <ResourceBlock
                key={r.id}
                resource={r}
                shiftData={shiftData}
                comments={comments}
                onCommentChange={handleCommentChange}
              />
            ))}
          </div>
        )}
      </div>

      {/* Date picker overlay */}
      {showDatePicker && (
        <div className="date-overlay" onClick={() => setShowDatePicker(false)}>
          <div className="date-picker-box" onClick={e => e.stopPropagation()}>
            <label>Jump to any date — snaps to that week</label>
            <input
              type="date"
              value={datePickerVal}
              onChange={e => setDatePickerVal(e.target.value)}
              autoFocus
            />
            <div className="dp-btns">
              <button className="dp-btn cancel" onClick={() => setShowDatePicker(false)}>Cancel</button>
              <button className="dp-btn confirm" onClick={confirmDate}>Go to week</button>
            </div>
          </div>
        </div>
      )}
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
