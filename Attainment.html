<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<title>Attainment — SMI Production Hub</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #f1f5f9; --surface: #ffffff; --surface2: #f8fafc;
  --border: #e2e8f0; --border-light: #cbd5e1;
  --text: #0f172a; --text-muted: #64748b; --text-dim: #94a3b8;
  --accent: #2563eb; --accent-dim: rgba(37,99,235,0.10);
  --green: #16a34a; --green-bg: rgba(22,163,74,0.10);
  --red: #dc2626; --red-bg: rgba(220,38,38,0.08);
  --mono: 'JetBrains Mono', monospace; --sans: 'Inter', sans-serif;
}
body { background: var(--bg); color: var(--text); font-family: var(--sans); min-height: 100vh; }

/* HEADER */
.header {
  background: var(--surface); border-bottom: 1px solid var(--border);
  padding: 0 20px; height: 52px; display: flex; align-items: center;
  justify-content: space-between; position: sticky; top: 0; z-index: 100; gap: 12px;
}
.hub-link { display: flex; flex-direction: column; align-items: center; line-height: 1;
  text-decoration: none; cursor: pointer; background: none; border: none;
  padding: 4px 8px; border-radius: 6px; transition: background 0.15s; flex-shrink: 0; }
.hub-link:hover { background: var(--surface2); }
.hub-link .logo-text { font-size: 9px; font-weight: 700; letter-spacing: 0.08em; color: var(--text-muted); margin-top: 2px; }
.smi-logo { font-size: 18px; font-weight: 700; color: var(--accent); font-family: var(--mono); }
.app-title { font-size: 16px; font-weight: 600; color: var(--text); }
.app-sub { font-size: 11px; color: var(--text-muted); margin-top: 1px; }
.header-center { display: flex; align-items: center; gap: 6px; }
.week-nav-btn { background: var(--surface2); border: 1px solid var(--border); color: var(--text);
  width: 30px; height: 30px; border-radius: 6px; cursor: pointer; font-size: 16px;
  display: flex; align-items: center; justify-content: center; transition: border-color 0.15s; flex-shrink: 0; }
.week-nav-btn:hover { border-color: var(--accent); color: var(--accent); }
.week-display { background: var(--surface2); border: 1px solid var(--border); color: var(--text);
  font-size: 12px; font-weight: 500; padding: 5px 12px; border-radius: 6px;
  cursor: pointer; transition: border-color 0.15s; white-space: nowrap;
  font-family: var(--sans); min-width: 190px; text-align: center; }
.week-display:hover { border-color: var(--accent); }
.header-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
.bu-select { background: var(--surface2); border: 1px solid var(--border); color: var(--text);
  font-size: 12px; padding: 5px 8px; border-radius: 6px; cursor: pointer;
  font-family: var(--sans); outline: none; min-width: 150px; }
.bu-select:focus { border-color: var(--accent); }
.refresh-btn { background: var(--accent-dim); border: 1px solid var(--accent); color: var(--accent);
  font-size: 11px; font-weight: 600; padding: 5px 12px; border-radius: 6px;
  cursor: pointer; font-family: var(--sans); white-space: nowrap; }
.refresh-btn:hover { background: var(--accent); color: #fff; }
.status-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green);
  display: inline-block; animation: pulse 2s infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

/* SUMMARY BAR */
.main { padding: 16px 20px 48px; }
.week-summary { display: flex; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
.summary-card { background: var(--surface); border: 1px solid var(--border);
  border-radius: 8px; padding: 10px 16px; min-width: 120px; }
.summary-card .label { font-size: 10px; color: var(--text-muted); font-weight: 500; margin-bottom: 3px; }
.summary-card .value { font-size: 20px; font-weight: 700; font-family: var(--mono); color: var(--text); }
.summary-card .value.green { color: #15803d; }
.summary-card .value.amber { color: #b45309; }
.summary-card .value.red   { color: #dc2626; }

/* TABLE — no overflow:hidden; it breaks position:sticky on resource headers */
.table-outer { border: 1px solid var(--border); border-radius: 10px; }
.table-wrap  { background: var(--surface); border-radius: 10px; }
/* Round the very first and very last visible rows to fake overflow:hidden corners */
.resource-block:first-child .resource-header-row { border-radius: 6px 6px 0 0; }
.resource-block:last-child .totals-row { border-radius: 0 0 10px 10px; }

/* ── GRID: 9 cols (DAY removed — day label now inside first col) ──────────────
   Resource/Line | Shift | Plan | Actual | Hrs | Eff% | SKU/WO | Notes | Comments */
:root {
  --grid: 180px 44px 80px 80px 60px 70px 200px 200px 180px;
}

/* Column headers */
.col-headers {
  display: grid; grid-template-columns: var(--grid);
  padding: 8px 12px; background: #dde3ed;
  border: 1px solid #b6c2d4; border-radius: 8px 8px 0 0; gap: 4px;
  position: sticky; top: 52px; z-index: 50;
  box-shadow: 0 3px 6px rgba(0,0,0,0.08);
  margin-bottom: -1px;
}
.col-h { font-size: 10px; font-weight: 700; color: #334155;
  letter-spacing: 0.07em; text-transform: uppercase; text-align: right; }
.col-h.left { text-align: left; }

/* Resource block */
.resource-block { border-bottom: 2px solid var(--border); }
.resource-block:last-child { border-bottom: none; }

/* Resource header row — softer slate-blue, sticky */
.resource-header-row {
  display: grid; grid-template-columns: var(--grid);
  align-items: center; gap: 4px; padding: 8px 12px;
  background: #334155;
  border-bottom: 1px solid #293548;
  border-left: 4px solid #60a5fa;
  position: sticky; top: 88px; z-index: 40;
}
.resource-header-row .rh-name {
  font-size: 13px; font-weight: 700; color: #f1f5f9; padding-left: 2px;
}
.resource-header-row .rh-bu {
  font-size: 10px; color: #94a3b8; font-weight: 500; display: block; margin-top: 1px;
}
.resource-header-row .rh-plan-val {
  font-size: 13px; font-weight: 700; color: #f1f5f9; font-family: var(--mono); text-align: right;
}
.resource-header-row .rh-plan-label {
  font-size: 10px; color: #94a3b8; text-align: right; font-weight: 500;
}

/* Shift row — day label baked into first cell */
.shift-row {
  display: grid; grid-template-columns: var(--grid);
  padding: 5px 12px; align-items: center; gap: 4px;
  border-bottom: 1px solid #e2e8f0; transition: background 0.1s;
}
/* Day separator: first shift of each day gets a slightly stronger top border */
.shift-row.day-start { border-top: 1px solid #cbd5e1; }

/* Day label inside the Resource/Line cell */
.day-inline {
  font-size: 11px; color: var(--text-muted); font-family: var(--sans);
}
.shift-row:hover { background: #f8fafc; }
.shift-row.green-row { background: rgba(22,163,74,0.06); }
.shift-row.red-row   { background: rgba(220,38,38,0.05); }

.cell { font-size: 12px; font-family: var(--mono); text-align: right; color: var(--text); }
.cell.left { text-align: left; font-family: var(--sans); }
.cell.muted { color: var(--text-muted); }
.cell.dim { color: var(--text-dim); }

.shift-badge { display: inline-flex; align-items: center; justify-content: center;
  width: 22px; height: 18px; border-radius: 4px; font-size: 10px; font-weight: 700; font-family: var(--mono); }
.s1 { background: rgba(99,102,241,0.12); color: #4338ca; }
.s2 { background: rgba(217,119,6,0.12);  color: #b45309; }
.s3 { background: rgba(124,58,237,0.12); color: #6d28d9; }

.pph-badge { display: inline-flex; align-items: center; justify-content: center;
  padding: 2px 6px; border-radius: 4px; font-size: 11px; font-weight: 600;
  font-family: var(--mono); min-width: 48px; }
.pph-green { background: rgba(22,163,74,0.10);  color: #15803d; }
.pph-amber { background: rgba(217,119,6,0.12);  color: #b45309; }
.pph-red   { background: rgba(220,38,38,0.08);  color: #dc2626; }
.pph-none  { background: #f1f5f9; color: var(--text-dim); }

.att-badge { display: inline-flex; align-items: center; padding: 2px 8px;
  border-radius: 4px; font-size: 11px; font-weight: 700; font-family: var(--mono); }
.att-green { background: var(--green-bg); color: var(--green); border: 1px solid rgba(34,197,94,0.3); }
.att-red   { background: var(--red-bg); color: var(--red); border: 1px solid rgba(239,68,68,0.3); }
.att-none  { background: var(--surface); color: var(--text-dim); border: 1px solid var(--border); }

/* Totals row — visually distinct from shift rows */
.totals-row {
  display: grid; grid-template-columns: var(--grid);
  padding: 9px 12px; align-items: center; gap: 4px;
  background: #e8edf5;
  border-top: 2px solid #b6c2d4;
  border-left: 4px solid var(--accent);
}
.totals-row .cell { font-weight: 700; color: #0f172a; font-size: 13px; }

/* Comment textarea */
.comment-cell { width: 100%; background: transparent; border: 1px solid transparent; color: var(--text);
  font-size: 11px; font-family: var(--sans); padding: 2px 4px; border-radius: 4px;
  outline: none; resize: none; transition: background 0.15s, border-color 0.15s; line-height: 1.4; }
.comment-cell:hover { background: #f1f5f9; border-color: var(--border); }
.comment-cell:focus { background: #ffffff; border-color: var(--accent); }
.comment-cell::placeholder { color: var(--text-dim); }

.sku-text  { font-size: 11px; color: #334155; font-family: var(--sans);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }
.notes-text{ font-size: 11px; color: var(--text-muted); font-family: var(--sans);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }

.state-msg { padding: 48px; text-align: center; color: var(--text-muted); font-size: 14px; }
.state-msg .big { font-size: 28px; margin-bottom: 10px; }

/* ── MOBILE ──────────────────────────────────────────────────────────────── */
@media (max-width: 700px) {
  :root {
    /* Mobile grid: Day+Shift | Actual | Hrs | Eff% | (hide SKU/Notes/Comments/Plan) */
    --grid: 1fr 44px 68px 52px 64px;
  }
  .header { padding: 0 12px; height: 48px; gap: 8px; }
  .app-sub { display: none; }
  .hub-link .logo-text { display: none; }
  .smi-logo { font-size: 16px; }
  .app-title { font-size: 14px; }
  .week-display { min-width: 0; font-size: 11px; padding: 5px 8px; }
  .header-right { gap: 6px; }
  .bu-select { min-width: 0; max-width: 110px; font-size: 11px; }
  .refresh-btn { padding: 5px 8px; font-size: 10px; }
  .status-dot { display: none; }
  .main { padding: 10px 10px 40px; }
  /* Summary: 2-column grid on mobile */
  .week-summary { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .summary-card { padding: 8px 12px; }
  .summary-card .value { font-size: 17px; }
  /* Table scrolls horizontally — hide non-essential cols */
  .col-h.hide-mobile  { display: none; }
  .cell.hide-mobile   { display: none; }
  .col-headers { top: 48px; }
  .resource-header-row { top: 84px; padding: 7px 10px; }
  .resource-header-row .rh-name { font-size: 12px; }
  .shift-row { padding: 5px 10px; }
  .totals-row { padding: 7px 10px; }
  .cell { font-size: 11px; }
  .pph-badge { font-size: 10px; min-width: 40px; padding: 2px 4px; }
}

/* Date picker overlay */
.date-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 200;
  display: flex; align-items: flex-start; justify-content: center; padding-top: 72px; }
.date-picker-box { background: #ffffff; border: 1px solid var(--border-light);
  border-radius: 10px; padding: 18px; min-width: 240px; box-shadow: 0 8px 24px rgba(0,0,0,0.12); }
.date-picker-box label { font-size: 11px; color: var(--text-muted); display: block; margin-bottom: 6px; }
.date-picker-box input[type="date"] { width: 100%; background: #f8fafc; border: 1px solid var(--border-light);
  color: var(--text); font-size: 13px; padding: 7px 10px; border-radius: 6px;
  font-family: var(--sans); outline: none; margin-bottom: 10px; }
.date-picker-box input[type="date"]:focus { border-color: var(--accent); }
.dp-btns { display: flex; gap: 8px; justify-content: flex-end; }
.dp-btn { padding: 6px 14px; border-radius: 6px; font-size: 12px; font-weight: 600; cursor: pointer; border: none; font-family: var(--sans); }
.dp-btn.cancel  { background: var(--surface2); color: var(--text-muted); }
.dp-btn.confirm { background: var(--accent); color: #fff; }

/* resource name only on first day-shift */
.res-name-cell { font-size: 12px; font-weight: 600; color: var(--text); }
</style>

<script type="text/babel">
dayjs.extend(dayjs_plugin_isoWeek);

const { useState, useEffect, useRef, useCallback } = React;

// ── Constants ──────────────────────────────────────────────────────────────
const PPH_TARGET = 4;

// Maps VER Build Plan resource names → Labour ticket resource names
// Only lines in this map get planned quantities
const VER_PLAN_TO_LABOUR = {
  "LPS3 HDMI":  "LoPro S3 HDMI",
  "QCS3":       "Lopro QC S3",
  "QC MAC3":    "Lopro QC Mac 3",
  "QC MAC4":    "Lopro QC Mac 4",
  "LPS4 HDMI":  "LoPro S4 HDMI",
  "QCS4":       "Lopro QC S4",
  "HDMI MIX":   "Lopro HDMI Mix",
  "QC MIX":     "Lopro QC Mix",
  "SU Stylet":  "Multivac 2",
  "Multivac":   "Multivac",
};

const ALL_BU_KEYS = [
  "BU Verathon","BU Molding",
  "BU Tier 1","BU Tier 1 - Respiratory","BU Tier 1 - Blades",
  "BU Tier 2","BU Tier 2 - DNA","BU Tier 2 - FLEX",
  "BU Bell Farm",
];

const LEGACY_LEADER_TO_BU = {
  "George":"BU Verathon","Andrew B.":"BU Molding",
  "Mark P.":"BU Tier 1","Lori F.":"BU Tier 2","Rob S.":"BU Bell Farm",
};

const normBU = (bu) => (!bu || bu==="BU Bellfarm") ? "BU Bell Farm" : (bu||"");
const docBU  = (r)  => normBU(r.bu) || normBU(LEGACY_LEADER_TO_BU[r.leader]) || "";

// shiftId 1=S1(mid), 2=S2(day), 3=S3(aft)
const SHIFT_CODES = { 1:"S1", 2:"S2", 3:"S3" };
const SHIFT_CSS   = { 1:"s1", 2:"s2", 3:"s3" };
const DAYS_OF_WEEK = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];

// ── Week helpers ───────────────────────────────────────────────────────────
function weekBounds(day) {
  const start = day.isoWeekday(1);
  return { start, end: start.add(6,"day") };
}
function fmtWeek(day) {
  const { start, end } = weekBounds(day);
  return `Wk ${day.isoWeek()} \u00b7 ${start.format("MMM D")} \u2013 ${end.format("MMM D, YYYY")}`;
}
function weekDates(day) {
  const mon = day.isoWeekday(1);
  return Array.from({length:7}, (_,i) => mon.add(i,"day").format("YYYY-MM-DD"));
}

// Monday of the ISO week that contains `day`
function weekMonday(day) {
  return day.isoWeekday(1).format("YYYY-MM-DD");
}

// ── PPH & Attainment badges ────────────────────────────────────────────────
// Eff% = earned hours / hours worked * 100. Target 90%. Amber >= 76.5%, red < 76.5%.
const EFF_TARGET = 90;
const EFF_AMBER  = 76.5;
function EffBadge({ earned, hrs }) {
  if (!hrs || hrs === 0) return <span className="pph-badge pph-none">—</span>;
  const eff = earned / hrs * 100;
  const cls = eff >= EFF_TARGET ? "pph-green" : eff >= EFF_AMBER ? "pph-amber" : "pph-red";
  return <span className={`pph-badge ${cls}`}>{eff.toFixed(1)}%</span>;
}
function PPHBadge({ actual, hrs }) {
  if (!hrs || hrs === 0) return <span style={{fontSize:11,color:"var(--text-dim)"}}>—</span>;
  const v = actual / hrs;
  const ok = v >= PPH_TARGET;
  return <span style={{fontSize:11,fontFamily:"var(--mono)",fontWeight:600,color:ok?"var(--green)":"var(--red)"}}>{v.toFixed(2)}</span>;
}
function AttBadge({ actual, plan }) {
  if (!plan) return <span className="att-badge att-none">—</span>;
  const pct = Math.round(actual/plan*100);
  return <span className={`att-badge ${pct>=100?"att-green":"att-red"}`}>{pct}%</span>;
}

// ── Main App ───────────────────────────────────────────────────────────────
function App() {
  const [currentDay,    setCurrentDay]    = useState(dayjs());
  const [showDatePick,  setShowDatePick]  = useState(false);
  const [datePickVal,   setDatePickVal]   = useState("");
  const [selectedBU,    setSelectedBU]    = useState("All BUs");
  const [loading,       setLoading]       = useState(false);
  const [lastRefresh,   setLastRefresh]   = useState(null);

  // Data state
  // resources: [ { id, name, bu, plan } ]
  // actuals: { "resourceName|YYYY-MM-DD|shiftId": { qty, hrs, sku, notes } }
  const [resources,  setResources]  = useState([]);
  const [actuals,    setActuals]    = useState({});
  const [comments,   setComments]   = useState({});

  const dates = weekDates(currentDay); // ["2026-09-28", ..., "2026-10-04"]
  const mondayKey = weekMonday(currentDay); // for VER plan lookup

  // ── Load data ────────────────────────────────────────────────────────────
  const loadData = useCallback(async () => {
    setLoading(true);
    try {
      // 1. VER build plan → resource list + weekly plan qty
      const planSnap = await db.collection("production_data").doc("ver_build_plan").get();
      const planRows = planSnap.exists ? (planSnap.data().rows || []) : [];

      // Sum qty per resource for this week's Monday, translating VER plan names → labour names
      const planMap = {}; // labourName -> { plan, description }
      planRows.forEach(row => {
        const verName = (row.resource||"").trim();
        if (!verName) return;
        const labourName = VER_PLAN_TO_LABOUR[verName];
        if (!labourName) return; // skip resources not in the mapping
        const qty = Number((row.weeks||{})[mondayKey] || 0);
        if (!planMap[labourName]) planMap[labourName] = { plan:0, description: row.description||"" };
        planMap[labourName].plan += qty;
        if (!planMap[labourName].description && row.description) planMap[labourName].description = row.description;
      });

      // Build resource list from plan — keyed by labour ticket name, BU Verathon
      // Include all 10 mapped lines even if plan is 0 this week (so they always show)
      const verResources = Object.values(VER_PLAN_TO_LABOUR).map(labourName => ({
        id: labourName,
        name: labourName,
        bu: "BU Verathon",
        plan: planMap[labourName] ? planMap[labourName].plan : 0,
        description: planMap[labourName] ? planMap[labourName].description : "",
      }));

      // 2. Shift reports for this week's date range
      // dates[0] = Monday, dates[6] = Sunday
      const fromDate = dates[0];
      const toDate   = dates[6];

      const reportsSnap = await db.collection("shift_reports").get();

      // actuals map: "resource|date|shiftId" -> { qty, hrs, sku, notes, bu }
      const actualsMap = {};
      // Also collect non-VER resources seen in shift reports
      const extraResources = {}; // name -> { bu }

      reportsSnap.forEach(doc => {
        const d = doc.data();
        if (!d.date || d.date < fromDate || d.date > toDate) return;
        const bu = docBU(d);
        const shiftId = d.shiftId || 0;
        (d.wos || []).forEach(w => {
          const res = (w.resource||"").trim();
          if (!res) return;
          const key = `${res}|${d.date}|${shiftId}`;
          if (!actualsMap[key]) {
            actualsMap[key] = { qty:0, hrs:0, earned:0, sku:"", notes:"", bu };
          }
          actualsMap[key].qty    += Number(w.qty    || 0);
          actualsMap[key].hrs    += Number(w.hrs    || 0);
          actualsMap[key].earned += Number(w.earned || 0);
          actualsMap[key].sku    = w.descr || actualsMap[key].sku;
          actualsMap[key].notes  = w.notes || actualsMap[key].notes;
          // Track non-VER resources (skip any that are already in our VER mapped set)
          const isVerLine = Object.values(VER_PLAN_TO_LABOUR).includes(res);
          if (!isVerLine && bu) {
            if (!extraResources[res]) extraResources[res] = { bu };
          }
        });
      });

      // Build combined resource list: VER (from plan) + others (from shift reports)
      const otherResources = Object.entries(extraResources).map(([name,v]) => ({
        id: name, name, bu: v.bu, plan: 0, description: ""
      }));

      const allResources = [...verResources, ...otherResources]
        .sort((a,b) => a.name.localeCompare(b.name));

      // 3. Saved comments
      const weekKey = `${currentDay.year()}-W${String(currentDay.isoWeek()).padStart(2,"0")}`;
      const commSnap = await db.collection("attainment_comments").doc(weekKey).get();
      const savedComments = commSnap.exists ? commSnap.data() : {};

      setResources(allResources);
      setActuals(actualsMap);
      setComments(savedComments);
      setLastRefresh(dayjs());
    } catch(err) {
      console.error("Attainment load error:", err);
    }
    setLoading(false);
  }, [mondayKey, dates[0], dates[6]]);

  useEffect(() => { loadData(); }, [loadData]);

  // ── Comment save (debounced) ─────────────────────────────────────────────
  const saveTimer = useRef(null);
  const handleCommentChange = (key, val) => {
    const next = { ...comments, [key]: val };
    setComments(next);
    if (saveTimer.current) clearTimeout(saveTimer.current);
    const weekKey = `${currentDay.year()}-W${String(currentDay.isoWeek()).padStart(2,"0")}`;
    saveTimer.current = setTimeout(() => {
      db.collection("attainment_comments").doc(weekKey)
        .set(next, { merge: true })
        .catch(e => console.error("Comment save:", e));
    }, 800);
  };

  // ── BU filter ────────────────────────────────────────────────────────────
  const filteredResources = selectedBU === "All BUs"
    ? resources
    : resources.filter(r => r.bu === selectedBU || r.bu.startsWith(selectedBU + " - "));

  // ── Week-level totals ────────────────────────────────────────────────────
  let totalPlan=0, totalActual=0, totalHrs=0, totalEarned=0;
  filteredResources.forEach(r => {
    totalPlan += r.plan || 0;
    dates.forEach(date => {
      [1,2,3].forEach(sid => {
        const a = actuals[`${r.id}|${date}|${sid}`];
        if (a) { totalActual += a.qty||0; totalHrs += a.hrs||0; totalEarned += a.earned||0; }
      });
    });
  });
  const overallPPH = totalHrs > 0 ? (totalActual/totalHrs).toFixed(2) : null;
  const overallEff = totalHrs > 0 ? (totalEarned/totalHrs*100).toFixed(1) : null;
  const overallAtt = totalPlan > 0 ? Math.round(totalActual/totalPlan*100) : null;

  // ── Navigation ───────────────────────────────────────────────────────────
  const prevWeek = () => setCurrentDay(d => d.subtract(1,"week"));
  const nextWeek = () => setCurrentDay(d => d.add(1,"week"));
  const openDatePick = () => { setDatePickVal(currentDay.format("YYYY-MM-DD")); setShowDatePick(true); };
  const confirmDate  = () => { if (datePickVal) setCurrentDay(dayjs(datePickVal)); setShowDatePick(false); };

  return (
    <>
      {/* HEADER */}
      <div className="header">
        <div style={{display:"flex",alignItems:"center",gap:10}}>
          <button className="hub-link" onClick={() => window.location.href="hub.html"}>
            <span className="smi-logo">SMI</span>
            <span className="logo-text">PRODUCTION HUB</span>
          </button>
          <div>
            <div className="app-title">Attainment</div>
            <div className="app-sub">Weekly production vs plan</div>
          </div>
        </div>

        <div className="header-center">
          <button className="week-nav-btn" onClick={prevWeek} title="Previous week">&#8249;</button>
          <button className="week-display" onClick={openDatePick}>{fmtWeek(currentDay)}</button>
          <button className="week-nav-btn" onClick={nextWeek} title="Next week">&#8250;</button>
        </div>

        <div className="header-right">
          <select className="bu-select" value={selectedBU} onChange={e => setSelectedBU(e.target.value)}>
            <option>All BUs</option>
            {ALL_BU_KEYS.map(b => <option key={b}>{b}</option>)}
          </select>
          <button className="refresh-btn" onClick={loadData}>&#8635; Refresh</button>
          {lastRefresh && (
            <span style={{fontSize:10,color:"var(--text-dim)"}}>
              <span className="status-dot" style={{marginRight:4}}/>
              {lastRefresh.format("HH:mm")}
            </span>
          )}
        </div>
      </div>

      {/* MAIN */}
      <div className="main">
        {/* Summary bar */}
        <div className="week-summary">
          {[
            { label:"Week plan",   val: totalPlan.toLocaleString(), cls:"" },
            { label:"Week actual", val: totalActual.toLocaleString(), cls:"" },
            { label:"Attainment",  val: overallAtt!=null ? overallAtt+"%" : "—", cls: overallAtt==null?"":overallAtt>=100?"green":"red" },
            { label:"Total hours", val: totalHrs.toFixed(1), cls:"" },
            { label:"Overall Eff%", val: overallEff!=null ? overallEff+"%" : "—", cls: overallEff==null?"":parseFloat(overallEff)>=EFF_TARGET?"green":parseFloat(overallEff)>=EFF_AMBER?"amber":"red" },
            { label:"Lines",       val: filteredResources.length, cls:"" },
          ].map(c => (
            <div key={c.label} className="summary-card">
              <div className="label">{c.label}</div>
              <div className={`value ${c.cls}`}>{c.val}</div>
            </div>
          ))}
        </div>

        {/* Sticky column header — outside table-outer so overflow:hidden doesn't trap it */}
        {!loading && filteredResources.length > 0 && (
          <div className="col-headers">
            <div className="col-h left">Resource / Line</div>
            <div className="col-h">Shift</div>
            <div className="col-h hide-mobile">Plan</div>
            <div className="col-h">Actual</div>
            <div className="col-h">Hrs</div>
            <div className="col-h">Eff %</div>
            <div className="col-h left hide-mobile">Description</div>
            <div className="col-h left hide-mobile">Notes</div>
            <div className="col-h left hide-mobile">Comments</div>
          </div>
        )}

        {/* Table */}
        {loading ? (
          <div className="table-outer"><div className="table-wrap"><div className="state-msg"><div className="big">&#9203;</div>Loading&hellip;</div></div></div>
        ) : filteredResources.length === 0 ? (
          <div className="table-outer"><div className="table-wrap"><div className="state-msg"><div className="big">&#128203;</div>No data for {selectedBU} &mdash; {fmtWeek(currentDay)}</div></div></div>
        ) : (
          <div className="table-outer"><div className="table-wrap">

            {filteredResources.map((r) => {
              // compute week totals for this resource
              let wActual=0, wHrs=0, wEarned=0;
              dates.forEach(date => [1,2,3].forEach(sid => {
                const a = actuals[`${r.id}|${date}|${sid}`];
                if (a) { wActual += a.qty||0; wHrs += a.hrs||0; wEarned += a.earned||0; }
              }));

              return (
                <div key={r.id} className="resource-block">
                  {/* Resource header row — sticky, slate-blue */}
                  <div className="resource-header-row">
                    {/* Col 1: name + bu */}
                    <div>
                      <span className="rh-name">{r.name}</span>
                      <span className="rh-bu">{r.bu}</span>
                    </div>
                    {/* Col 2: Shift — empty */}
                    <div/>
                    {/* Col 3: Plan */}
                    <div className="hide-mobile">
                      {r.plan > 0 ? (
                        <>
                          <div className="rh-plan-label">Week plan</div>
                          <div className="rh-plan-val">{r.plan.toLocaleString()}</div>
                        </>
                      ) : null}
                    </div>
                    {/* Remaining cols empty */}
                    <div/><div/><div/>
                    <div className="hide-mobile"/><div className="hide-mobile"/><div className="hide-mobile"/>
                  </div>

                  {dates.map((date, di) => {
                    const dow = DAYS_OF_WEEK[di];
                    const dayjsDate = dayjs(date);
                    const dateLabel = `${dow} ${dayjsDate.format("MMM D")}`;
                    return [1,2,3].map((sid, si) => {
                      const a = actuals[`${r.id}|${date}|${sid}`] || { qty:0, hrs:0, earned:0, sku:"", notes:"" };
                      const hasData = (a.qty||0) > 0 || (a.hrs||0) > 0;
                      const effVal  = a.hrs > 0 ? (a.earned||0) / a.hrs * 100 : null;
                      const rowCls  = !hasData ? "" : effVal === null ? "" : effVal >= EFF_TARGET ? "green-row" : "red-row";
                      const commKey = `${r.id}|${date}|${sid}`;
                      const isFirstShiftOfDay = si===0;

                      return (
                        <div key={commKey} className={`shift-row ${rowCls}${isFirstShiftOfDay && di>0 ? " day-start" : ""}`}>
                          {/* Col 1: day label (first shift of day) + shift badge */}
                          <div className="cell left" style={{paddingLeft:8, display:"flex", alignItems:"center", gap:6}}>
                            {isFirstShiftOfDay
                              ? <span className="day-inline">{dateLabel}</span>
                              : null}
                          </div>
                          {/* Shift badge */}
                          <div className="cell">
                            <span className={`shift-badge ${SHIFT_CSS[sid]}`}>{SHIFT_CODES[sid]}</span>
                          </div>
                          {/* Plan — hidden on mobile */}
                          <div className="cell muted hide-mobile"></div>
                          {/* Actual */}
                          <div className="cell">{hasData ? (a.qty||0).toLocaleString() : <span className="dim">—</span>}</div>
                          {/* Hrs */}
                          <div className="cell muted">{hasData ? (a.hrs||0) : <span className="dim">—</span>}</div>
                          {/* Eff% */}
                          <div className="cell"><EffBadge earned={a.earned||0} hrs={a.hrs||0}/></div>
                          {/* SKU — hidden on mobile */}
                          <div className="cell left hide-mobile"><span className="sku-text">{a.sku||""}</span></div>
                          {/* Notes — hidden on mobile */}
                          <div className="cell left hide-mobile"><span className="notes-text">{a.notes||""}</span></div>
                          {/* Comments — hidden on mobile */}
                          <div className="cell hide-mobile">
                            <textarea className="comment-cell" rows={1} placeholder="Add note…"
                              value={comments[commKey]||""}
                              onChange={e => handleCommentChange(commKey, e.target.value)}/>
                          </div>
                        </div>
                      );
                    });
                  })}

                  {/* Week totals row */}
                  <div className="totals-row">
                    {/* Col 1: label */}
                    <div className="cell left" style={{paddingLeft:10, fontSize:11, fontWeight:700, color:"#334155", fontFamily:"var(--sans)"}}>Week total</div>
                    {/* Col 2: Shift — empty */}
                    <div/>
                    {/* Col 3: Attainment badge (Plan col) */}
                    <div className="cell hide-mobile"><AttBadge actual={wActual} plan={r.plan}/></div>
                    {/* Col 4: Actual */}
                    <div className="cell" style={{color:"var(--text)",fontWeight:700}}>{wActual.toLocaleString()}</div>
                    {/* Col 5: Hrs */}
                    <div className="cell muted">{wHrs > 0 ? wHrs.toFixed(1) : "—"}</div>
                    {/* Col 6: Eff% */}
                    <div className="cell"><EffBadge earned={wEarned} hrs={wHrs}/></div>
                    {/* Col 7: Attainment on mobile (visible), SKU col on desktop */}
                    <div className="cell hide-mobile"/>
                    <div className="cell hide-mobile"/>
                    {/* Col 9: PPH in comments col */}
                    <div className="cell left hide-mobile" style={{fontSize:11, color:"var(--text-muted)", fontFamily:"var(--sans)"}}>
                      {wHrs > 0 ? <span>PPH: <PPHBadge actual={wActual} hrs={wHrs}/></span> : ""}
                    </div>
                  </div>
                </div>
              );
            })}
          </div></div>
        )}
      </div>

      {/* Date picker overlay */}
      {showDatePick && (
        <div className="date-overlay" onClick={() => setShowDatePick(false)}>
          <div className="date-picker-box" onClick={e => e.stopPropagation()}>
            <label>Jump to any date &mdash; snaps to that week</label>
            <input type="date" value={datePickVal} onChange={e => setDatePickVal(e.target.value)} autoFocus/>
            <div className="dp-btns">
              <button className="dp-btn cancel" onClick={() => setShowDatePick(false)}>Cancel</button>
              <button className="dp-btn confirm" onClick={confirmDate}>Go to week</button>
            </div>
          </div>
        </div>
      )}
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
