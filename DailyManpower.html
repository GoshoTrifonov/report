  .status-yellow { background: var(--st-yellow-bg); color: var(--st-yellow-fg); }

// ─── Helpers ──────────────────────────────────────────────────────────────────
function detectShift() {
  const h = new Date().getHours();
  const m = new Date().getMinutes();
  const mins = h * 60 + m;
  // Midnight: 23:00–07:30 (1380–450)
  if (mins >= 23*60 || mins < 7*60+30) return "Midnight";
  // Days: 07:00–15:30
  if (mins >= 7*60 && mins < 15*60+30) return "Days";
  // Afternoon: 15:00–23:30
  return "Afternoon";
}

function todayKey() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

function statusClass(plan, actual) {
  if (plan === 0 && actual === 0) return "status-zero";
  if (plan === 0) return "status-green";
  const ratio = actual / plan;
  if (ratio >= 1) return "status-green";
  if (ratio >= 0.85) return "status-yellow";
  return "status-red";
}

function sumPlan(planObj, lines) {
  return lines.reduce((s, l) => s + (planObj[l] || 0), 0);
}
function sumActual(actualObj, lines) {
  return lines.reduce((s, l) => s + (Number(actualObj?.[l]) || 0), 0);
}

function formatTs(ts) {
  if (!ts) return "";
  const d = ts.toDate ? ts.toDate() : new Date(ts);
  return d.toLocaleDateString("en-CA") + " " + d.toLocaleTimeString("en-US", {hour:"2-digit",minute:"2-digit"});
}

      } else {

        const defaults = { plan: DEFAULT_PLAN, lines: DEFAULT_LINES };
        db.collection("manpower").doc("config").set(defaults);
        setConfig(defaults);
      }
    });

    const unsubLive = db.collection("manpower").doc("live").onSnapshot(snap => {
      if (snap.exists) {
        const d = snap.data();
        setLiveData(d.data || {});
        setLastUpdate(d.updatedAt || null);
      }
      setLoading(false);
    }, () => setLoading(false));

    return () => { unsubConfig(); unsubLive(); };
  }, []);

  // Load history once

      if (snap.exists) setHistory(snap.data().entries || []);

// ─── Dashboard ────────────────────────────────────────────────────────────────
function Dashboard({ cfg, liveData, onSaveSnapshot, onClear }) {
  const [selectedShift, setSelectedShift] = React.useState(detectShift());
  const [selectedBUs, setSelectedBUs] = React.useState(new Set()); // empty = All
  const [snapLabel, setSnapLabel] = React.useState("");
  const [saving, setSaving] = React.useState(false);

  const shiftData = liveData[selectedShift] || {};
  const displayBUs = selectedBUs.size === 0 ? BUS : BUS.filter(b => selectedBUs.has(b));

  const toggleBU = (b) => {
    setSelectedBUs(prev => {
      const next = new Set(prev);
      if (next.has(b)) next.delete(b); else next.add(b);
      return next;
    });
  };

  // Grand totals (always across ALL BUs regardless of filter)
  const grandPlan = BUS.reduce((s, bu) => {
    const lines = cfg.lines[bu] || DEFAULT_LINES[bu];
    const plan = (cfg.plan[bu] || DEFAULT_PLAN[bu])[selectedShift] || {};
    return s + sumPlan(plan, lines);
  }, 0);
  const grandActual = BUS.reduce((s, bu) => {
    const lines = cfg.lines[bu] || DEFAULT_LINES[bu];
    return s + sumActual(shiftData[bu]?.lines, lines);
  }, 0);
  const grandAbsent = BUS.reduce((s, bu) => s + (shiftData[bu]?.absent || 0), 0);
  const grandAssigned = BUS.reduce((s, bu) => {
    const a = (cfg.assigned || DEFAULT_ASSIGNED)[bu] || DEFAULT_ASSIGNED[bu] || {};
    return s + (a[selectedShift] || 0);
  }, 0);
  const efficiency = grandPlan > 0 ? Math.round(grandActual / grandPlan * 100) : 0;
  const effColor = grandActual >= grandPlan ? "#22c55e" : grandActual >= grandPlan * 0.85 ? "#eab308" : "#ef4444";
  const assignedSurplus = grandAssigned - grandPlan; // positive = extra people vs plan

  const doSnapshot = async () => {
    if (!snapLabel.trim()) { alert("Enter a label for this snapshot."); return; }
    setSaving(true);
    await onSaveSnapshot(snapLabel.trim());
    setSnapLabel("");
    setSaving(false);
    alert("Snapshot saved to history.");
  };

  // Date display
  const now = new Date();
  const dateStr = now.toLocaleDateString("en-US", { weekday:"long", month:"long", day:"numeric", year:"numeric" });

  return (
    <div>
      {/* Shift selector + BU multi-filter */}
      <div className="flex flex-wrap items-center gap-3 mb-4">
        <div className="flex gap-1">
          {SHIFTS.map(s => (
            <button key={s} onClick={() => setSelectedShift(s)}
              className={`px-4 py-2 rounded-lg text-sm font-semibold transition-all ${selectedShift===s?"tab-active":"tab-inactive"}`}>
              {s}
              {s === detectShift() && <span className="ml-1 text-xs opacity-70">�—�</span>}
            </button>
          ))}
        </div>
        {/* Multi-select BU filter */}
        <div className="flex gap-1 flex-wrap items-center">
          <button onClick={() => setSelectedBUs(new Set())}
            className={`px-3 py-1.5 rounded-md text-xs font-medium transition-all ${selectedBUs.size===0?"tab-active":"tab-inactive"}`}>
            All
          </button>
          {BUS.map(b => {
            const on = selectedBUs.has(b);
            return (
              <button key={b} onClick={() => toggleBU(b)}
                className={`px-3 py-1.5 rounded-md text-xs font-medium transition-all ${on?"tab-active":"tab-inactive"}`}
                style={on ? {background: BU_COLORS[b]} : {}}>
                {b}
                {on && <span className="ml-1 text-xs">✓</span>}
              </button>
            );
          })}
        </div>
      </div>

      {/* Summary bar: date/shift left, totals center, snapshot right */}
      <div className="card mb-4 flex flex-wrap gap-4 items-center">
        {/* Date + Shift */}
        <div className="flex flex-col">
          <div className="text-2xl font-black leading-tight" style={{color:"var(--text)"}}>{selectedShift} Shift</div>
          <div className="text-sm font-semibold" style={{color:"var(--text3)"}}>{dateStr}</div>
        </div>

        <div className="w-px h-12 hidden sm:block" style={{background:"var(--border)"}}/>

        {/* Totals */}
        <div className="flex gap-5 items-end flex-wrap">
          <div>
            <div className="text-xs mb-0.5" style={{color:"var(--text3)"}}>Assigned</div>
            <div className="text-3xl font-bold" style={{color:"var(--text)"}}>{grandAssigned}</div>
            {assignedSurplus !== 0 && (
              <div className="text-xs font-semibold mt-0.5" style={{color: assignedSurplus > 0 ? "#22c55e" : "#ef4444"}}>
                {assignedSurplus > 0 ? `+${assignedSurplus} extra` : `${assignedSurplus} short`}
              </div>
            )}
          </div>
          <div>
            <div className="text-xs mb-0.5" style={{color:"var(--text3)"}}>Planned</div>
            <div className="text-3xl font-bold" style={{color:"var(--text)"}}>{grandPlan}</div>
          </div>
          <div>
            <div className="text-xs mb-0.5" style={{color:"var(--text3)"}}>Actual</div>
            <div className="text-3xl font-bold" style={{color: effColor}}>{grandActual}</div>
          </div>
          <div>
            <div className="text-xs mb-0.5" style={{color:"var(--text3)"}}>Absent</div>
            <div className="text-3xl font-bold" style={{color:"#fb923c"}}>{grandAbsent}</div>
          </div>
          <div>
            <div className="text-xs mb-0.5" style={{color:"var(--text3)"}}>Manpower</div>
            <div className="text-3xl font-bold" style={{color: effColor}}>{efficiency}%</div>
          </div>
        </div>

        <div className="flex-1"/>

        {/* Snapshot */}
        <div className="flex gap-2 items-center">
          <input value={snapLabel} onChange={e=>setSnapLabel(e.target.value)} placeholder="Snapshot label…"
            className="input-comment w-40 text-sm" onKeyDown={e=>e.key==="Enter"&&doSnapshot()}/>
          <button onClick={doSnapshot} disabled={saving} className="btn-primary text-sm py-2">{saving?"Saving…":"💾 Save"}</button>
          <button onClick={onClear} className="btn-danger text-sm py-2">�—� Clear</button>
        </div>
      </div>

      {/* BU Cards grid */}
      <div className="grid gap-4" style={{gridTemplateColumns:"repeat(auto-fill,minmax(320px,1fr))"}}>
        {displayBUs.map(bu => (
          <BUCard key={bu} bu={bu} cfg={cfg} shiftData={shiftData[bu]} shift={selectedShift} />
        ))}
      </div>
    </div>
  );
}

function BUCard({ bu, cfg, shiftData, shift }) {
  const lines = cfg.lines[bu] || DEFAULT_LINES[bu];
  const plan = (cfg.plan[bu] || DEFAULT_PLAN[bu])[shift] || {};
  const actual = shiftData?.lines || {};
  const absent = shiftData?.absent || 0;
  const savedAt = shiftData?.savedAt;
  const assigned = ((cfg.assigned || DEFAULT_ASSIGNED)[bu] || DEFAULT_ASSIGNED[bu] || {})[shift] || 0;

  const totalPlan = sumPlan(plan, lines);
  const totalActual = sumActual(actual, lines);
  const sc = statusClass(totalPlan, totalActual);
  const color = BU_COLORS[bu];
  const surplus = assigned - totalPlan; // positive = extra vs plan

  // 5-col grid: line | assigned | plan | actual | delta
  const ROW = "1fr 46px 46px 46px 42px";

  return (
    <div className="card" style={{borderLeft:`4px solid ${color}`}}>
      <div className="flex items-center justify-between mb-2">
        <div>
          <div className="font-bold text-base" style={{color:"var(--text)"}}>{bu}</div>
          {savedAt && <div className="text-xs" style={{color:"var(--text4)"}}>{formatTs({toDate:()=>new Date(savedAt)})}</div>}
        </div>
        <div className="flex gap-2 items-center flex-wrap justify-end">
          {absent > 0 && <span className="text-xs px-2 py-0.5 rounded-full" style={{background:"rgba(194,65,12,0.25)",color:"#fb923c"}}>-{absent} absent</span>}
          {assigned > 0 && <span className="text-xs px-2 py-0.5 rounded-full font-semibold"
            style={{background: surplus > 0 ? "rgba(34,197,94,0.15)" : surplus < 0 ? "rgba(239,68,68,0.15)" : "var(--bg3)",
                    color: surplus > 0 ? "#22c55e" : surplus < 0 ? "#ef4444" : "var(--text3)"}}>
            {assigned} asgn {surplus > 0 ? `+${surplus}` : surplus < 0 ? surplus : ""}
          </span>}
          <span className={`text-sm font-bold px-3 py-1 rounded-full ${sc}`}>{totalActual} / {totalPlan}</span>
        </div>
      </div>

      {/* Header row */}
      <div className="text-xs mb-1 px-1" style={{display:"grid", gridTemplateColumns:ROW, color:"var(--text4)"}}>
        <span>Line</span>
        <span className="text-center">Asgn</span>
        <span className="text-center">Plan</span>
        <span className="text-center">Actual</span>
        <span className="text-center">Δ</span>
      </div>

      <div className="space-y-0.5 max-h-72 overflow-y-auto scrollbar-thin">
        {(() => {
          const cfgSet = new Set(lines);
          const extraKeys = Object.keys(actual).filter(k => !cfgSet.has(k) && Number(actual[k]) > 0);
          const allLines = [...lines, ...extraKeys];
          return allLines.map(line => {
            const p = plan[line] || 0;
            const a = Number(actual[line]) || 0;
            const delta = a - p;
            const isExtra = !cfgSet.has(line);
            return (
              <div key={line} className={`text-sm px-1 py-0.5 rounded ${p===0&&a===0&&!isExtra?"opacity-40":""}`}
                style={{display:"grid", gridTemplateColumns:ROW, alignItems:"center",
                        background: isExtra ? "rgba(245,158,11,0.08)" : ""}}>
                <span className="truncate" style={{color: isExtra ? "#f59e0b" : "var(--text2)"}}
                  title={isExtra?"Key not in config":line}>{line}{isExtra?" ⚠️":""}</span>
                <span className="text-center" style={{color:"var(--text4)"}}>—</span>
                <span className="text-center" style={{color:"var(--text3)"}}>{p||"—"}</span>
                <span className="text-center font-semibold" style={{color: a>0 ? "var(--text)" : "var(--text4)"}}>{a||"—"}</span>
                <span className="text-center text-xs" style={{color: delta>0?"#22c55e":delta<0?"#ef4444":"var(--text4)"}}>
                  {delta>0?`+${delta}`:delta<0?delta:""}
                </span>
              </div>
            );
          });
        })()}
      </div>
    </div>
  );
}

// ─── Input View ───────────────────────────────────────────────────────────────
function InputView({ cfg, liveData, onSave }) {
  const [shift, setShift] = React.useState(detectShift());
  const [bu, setBU] = React.useState(null);
  const [absent, setAbsent] = React.useState("");
  const [actuals, setActuals] = React.useState({});
  const [comments, setComments] = React.useState({});
  const [saving, setSaving] = React.useState(false);
  const [saved, setSaved] = React.useState(false);

  // When shift+bu changes, pre-load existing data
  React.useEffect(() => {
    if (!bu) return;
    const existing = liveData[shift]?.[bu];
    if (existing) {
      setActuals(existing.lines || {});
      setComments(existing.comments || {});
      setAbsent(existing.absent || "");
    } else {
      // Pre-fill actuals with plan numbers
      const lines = cfg.lines[bu] || DEFAULT_LINES[bu];
      const plan = (cfg.plan[bu] || DEFAULT_PLAN[bu])[shift] || {};
      const prefilled = {};
      lines.forEach(l => { if ((plan[l]||0) > 0) prefilled[l] = plan[l]; });
      setActuals(prefilled);
      setComments({});
      setAbsent("");
    }
    setSaved(false);
  }, [shift, bu]);

  const lines = bu ? (cfg.lines[bu] || DEFAULT_LINES[bu]) : [];
  const plan = bu ? ((cfg.plan[bu] || DEFAULT_PLAN[bu])[shift] || {}) : {};
  const totalPlan = sumPlan(plan, lines);
  const totalActual = lines.reduce((s,l) => s + (Number(actuals[l])||0), 0);

  const handleSave = async () => {
    setSaving(true);
    await onSave(shift, bu, actuals, absent);
    setSaving(false);
    setSaved(true);
    setTimeout(() => setSaved(false), 3000);
  };

  return (
    <div className="max-w-lg mx-auto">
      {/* Step 1: Shift */}
      <div className="card mb-4">
        <div className="text-sm font-semibold mb-2" style={{color:"var(--text3)"}}>1 �· Select Shift</div>
        <div className="flex gap-2">
          {SHIFTS.map(s => (
            <button key={s} onClick={() => { setShift(s); setBU(null); }}
              className={`flex-1 py-3 rounded-lg text-sm font-bold transition-all ${shift===s?"tab-active":"tab-inactive"}`}>
              {s}
              {s === detectShift() && <span className="block text-xs font-normal opacity-70">current</span>}
            </button>
          ))}
        </div>
      </div>

      {/* Step 2: BU */}
      <div className="card mb-4">
        <div className="text-sm font-semibold mb-2" style={{color:"var(--text3)"}}>2 �· Select Your BU</div>
        <div className="grid grid-cols-2 gap-2">
          {BUS.map(b => {
            const isSubmitted = !!liveData[shift]?.[b];
            return (
              <button key={b} onClick={() => setBU(b)}
                className={`py-3 px-4 rounded-lg text-sm font-semibold transition-all text-left flex items-center justify-between ${bu===b?"tab-active":"tab-inactive"}`}
                style={bu===b?{background:BU_COLORS[b]}:{}}>
                <span>{b}</span>
                {isSubmitted && <span className="text-green-400 text-xs">✓</span>}
              </button>
            );
          })}
        </div>
      </div>

      {bu && (
        <>
          {/* Step 3: Absent */}
          <div className="card mb-4">
            <div className="text-sm font-semibold mb-2" style={{color:"var(--text3)"}}>3 �· Absent Associates</div>
            <div className="flex items-center gap-4">
              <input type="number" min="0" max="99" value={absent} onChange={e=>setAbsent(e.target.value)}
                className="input-num text-xl" placeholder="0"/>
              <span className="text-sm" style={{color:"var(--text3)"}}>people absent this shift (vacation / call-in)</span>
            </div>
          </div>

          {/* Step 4: Actuals */}
          <div className="card mb-4">
            <div className="flex items-center justify-between mb-3">
              <div className="text-sm font-semibold" style={{color:"var(--text3)"}}>4 �· Enter Actuals — <span style={{color:BU_COLORS[bu]}}>{bu}</span></div>
              <span className={`text-sm font-bold px-3 py-1 rounded-full ${statusClass(totalPlan,totalActual)}`}>{totalActual} / {totalPlan}</span>
            </div>

            {/* Column headers */}
            <div className="grid text-xs mb-2 px-1" style={{color:"var(--text4)"}} style={{gridTemplateColumns:"1fr 52px 72px"}}>
              <span>Line</span><span className="text-center">Plan</span><span className="text-center">Actual</span>
            </div>

            <div className="space-y-2">
              {lines.map(line => {
                const p = plan[line] || 0;
                const a = Number(actuals[line]) || 0;
                const delta = a - p;
                return (
                  <div key={line}>
                    <div className="grid items-center gap-2 px-1" style={{gridTemplateColumns:"1fr 52px 72px"}}>
                      <span className="text-sm" style={{color:"var(--text)"}}>{line}</span>
                      <span className="text-center text-sm" style={{color:"var(--text3)"}}>{p||"—"}</span>
                      <div className="flex items-center gap-1">
                        <input type="number" min="0" max="99"
                          value={actuals[line] ?? ""}
                          onChange={e => setActuals(prev => ({...prev, [line]: e.target.value === "" ? "" : Number(e.target.value)}))}
                          className="input-num"/>
                        {delta !== 0 && (
                          <span className={`text-xs w-6 ${delta>0?"text-green-400":"text-red-400"}`}>
                            {delta>0?`+${delta}`:delta}
                          </span>
                        )}
                      </div>
                    </div>
                    <input value={comments[line]||""} onChange={e=>setComments(prev=>({...prev,[line]:e.target.value}))}
                      placeholder="Comment (optional)…" className="input-comment mt-1 text-xs"/>
                  </div>
                );
              })}
            </div>
          </div>

          {/* Submit */}
          <button onClick={handleSave} disabled={saving}
            className={`w-full py-4 rounded-xl text-lg font-bold transition-all mb-8 ${saved?"bg-green-600 text-white":"btn-primary"}`}>
            {saving ? "Saving…" : saved ? "✓ Saved!" : "Submit Manpower"}
          </button>
        </>
      )}
    </div>
  );
}

// ─── History View ─────────────────────────────────────────────────────────────
function HistoryView({ history, cfg }) {
  const [selected, setSelected] = React.useState(null);
  const [filterShift, setFilterShift] = React.useState("All");

  const filtered = history.filter(h => {
    if (filterShift === "All") return true;
    return Object.keys(h.data || {}).includes(filterShift);
  });

  const exportToExcel = (entry) => {
    const rows = [["Shift","BU","Line","Plan","Actual","Delta","Comment"]];
    SHIFTS.forEach(shift => {
      BUS.forEach(bu => {
        const lines = cfg.lines[bu] || DEFAULT_LINES[bu];
        const plan = (cfg.plan[bu] || DEFAULT_PLAN[bu])[shift] || {};
        const lineData = entry.data?.[shift]?.[bu]?.lines || {};
        const absent = entry.data?.[shift]?.[bu]?.absent || 0;
        if (absent > 0) rows.push([shift, bu, "ABSENT", "", absent, "", ""]);
        lines.forEach(l => {
          const p = plan[l] || 0;
          const a = Number(lineData[l]) || 0;
          rows.push([shift, bu, l, p, a, a-p, ""]);
        });
      });
    });
    const ws = XLSX.utils.aoa_to_sheet(rows);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "Manpower");
    XLSX.writeFile(wb, `manpower_${entry.date}_${entry.label}.xlsx`);
  };

  return (
    <div>
      <div className="flex flex-wrap items-center gap-3 mb-4">
        <h2 className="text-lg font-bold" style={{color:"var(--text)"}}>Shift History</h2>
        <div className="flex gap-1">
          {["All",...SHIFTS].map(s => (
            <button key={s} onClick={() => setFilterShift(s)}
              className={`px-3 py-1.5 rounded-md text-xs font-medium ${filterShift===s?"tab-active":"tab-inactive"}`}>
              {s}
            </button>
          ))}
        </div>
        <span className="text-sm" style={{color:"var(--text4)"}}>{filtered.length} entries (max 100)</span>
      </div>

      <div className="grid gap-3" style={{gridTemplateColumns:"300px 1fr"}}>
        {/* List */}
        <div className="space-y-2 max-h-screen overflow-y-auto scrollbar-thin pr-1">
          {filtered.length === 0 && <div className="card text-slate-500 text-sm">No history yet.</div>}
          {filtered.map((entry, i) => (
            <div key={i} onClick={() => setSelected(entry)}
              className={`card cursor-pointer transition-all hover:border-blue-500 ${selected===entry?"border-blue-500":""}`}>
              <div className="font-semibold text-sm" style={{color:"var(--text)"}}>{entry.label}</div>
              <div className="text-xs" style={{color:"var(--text3)"}}>{entry.date} �· {formatTs({toDate:()=>new Date(entry.savedAt)})}</div>
              <div className="flex gap-2 mt-1 flex-wrap">
                {SHIFTS.filter(s => entry.data?.[s]).map(s => (
                  <span key={s} className="text-xs px-2 py-0.5 rounded" style={{background:"var(--bg3)",color:"var(--text2)"}}>{s}</span>
                ))}
              </div>
            </div>
          ))}
        </div>

        {/* Detail */}
        <div>
          {!selected ? (
            <div className="card text-center py-12" style={{color:"var(--text4)"}}>Select an entry to view details</div>
          ) : (
            <div className="card">
              <div className="flex items-center justify-between mb-4">
                <div>
                  <div className="text-lg font-bold" style={{color:"var(--text)"}}>{selected.label}</div>
                  <div className="text-sm" style={{color:"var(--text3)"}}>{selected.date}</div>
                </div>
                <button onClick={() => exportToExcel(selected)} className="btn-secondary text-sm">⬇ Export Excel</button>
              </div>
              {SHIFTS.map(shift => {
                const shiftData = selected.data?.[shift];
                if (!shiftData || Object.keys(shiftData).length === 0) return null;
                return (
                  <div key={shift} className="mb-4">
                    <div className="font-semibold text-sm mb-2 border-b pb-1" style={{color:"#60a5fa",borderColor:"var(--border)"}}>{shift}</div>
                    {BUS.filter(bu => shiftData[bu]).map(bu => {
                      const lines = cfg.lines[bu] || DEFAULT_LINES[bu];
                      const plan = (cfg.plan[bu] || DEFAULT_PLAN[bu])[shift] || {};
                      const lineData = shiftData[bu]?.lines || {};
                      const absent = shiftData[bu]?.absent || 0;
                      const tp = sumPlan(plan, lines);
                      const ta = sumActual(lineData, lines);
                      return (
                        <div key={bu} className="mb-3">
                          <div className="flex items-center gap-2 mb-1">
                            <span className="text-sm font-semibold" style={{color:BU_COLORS[bu]}}>{bu}</span>
                            <span className={`text-xs px-2 py-0.5 rounded-full ${statusClass(tp,ta)}`}>{ta}/{tp}</span>
                            {absent>0 && <span className="text-xs" style={{color:"#fb923c"}}>-{absent} absent</span>}
                          </div>
                          <div className="grid gap-1 pl-2">
                            {lines.filter(l => (plan[l]||0)>0 || (Number(lineData[l])||0)>0).map(l => {
                              const p = plan[l]||0, a = Number(lineData[l])||0;
                              return (
                                <div key={l} className="flex items-center gap-3 text-xs" style={{color:"var(--text3)"}}>
                                  <span className="w-40 truncate">{l}</span>
                                  <span className="w-8 text-right" style={{color:"var(--text4)"}}>{p}</span>
                                  <span className="w-8 text-right font-medium" style={{color:"var(--text)"}}>{a}</span>
                                  <span className={`w-8 text-right ${a-p>0?"text-green-400":a-p<0?"text-red-400":""}`}>{a-p!==0?(a-p>0?`+${a-p}`:a-p):""}</span>
                                </div>
                              );
                            })}
                          </div>
                        </div>
                      );
                    })}
                  </div>
                );
              })}
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

// ─── Config View ──────────────────────────────────────────────────────────────
function ConfigView({ cfg, onSave }) {
  const [authed, setAuthed] = React.useState(false);
  const [pw, setPw] = React.useState("");
  const [editBU, setEditBU] = React.useState(BUS[0]);
  const [editShift, setEditShift] = React.useState("Days");
  const [localCfg, setLocalCfg] = React.useState(null);
  const [saving, setSaving] = React.useState(false);
  const [saved, setSaved] = React.useState(false);
  const [newLineName, setNewLineName] = React.useState("");
  const [renamingLine, setRenamingLine] = React.useState(null); // line name being renamed
  const [renameVal, setRenameVal] = React.useState("");

  React.useEffect(() => { setLocalCfg(JSON.parse(JSON.stringify(cfg))); }, [cfg]);

  if (!authed) return (
    <div className="max-w-sm mx-auto mt-20">
      <div className="card text-center">
        <div className="text-4xl mb-4">🔒</div>
        <div className="text-lg font-bold mb-4" style={{color:"var(--text)"}}>Configuration</div>
        <input type="password" value={pw} onChange={e=>setPw(e.target.value)} placeholder="Password"
          onKeyDown={e=>e.key==="Enter"&&(pw===CONFIG_PASSWORD?setAuthed(true):alert("Wrong password"))}
          className="input-comment mb-3 text-center text-lg"/>
        <button onClick={() => pw===CONFIG_PASSWORD?setAuthed(true):alert("Wrong password")} className="btn-primary w-full">Unlock</button>
      </div>
    </div>
  );

  if (!localCfg) return <div style={{color:"var(--text3)"}}>Loading…</div>;

  const lines = localCfg.lines[editBU] || [...(DEFAULT_LINES[editBU] || [])];
  const plan = (localCfg.plan[editBU] || DEFAULT_PLAN[editBU] || {})[editShift] || {};

  const cloneCfg = () => JSON.parse(JSON.stringify(localCfg));

  const setPlanVal = (line, val) => {
    const c = cloneCfg();
    if (!c.plan[editBU]) c.plan[editBU] = {};
    if (!c.plan[editBU][editShift]) c.plan[editBU][editShift] = {};
    c.plan[editBU][editShift][line] = Number(val) || 0;
    setLocalCfg(c); setSaved(false);
  };

  const addLine = () => {
    const name = newLineName.trim();
    if (!name) return;
    if (lines.includes(name)) { alert("A line with that name already exists."); return; }
    const c = cloneCfg();
    if (!c.lines[editBU]) c.lines[editBU] = [...lines];
    c.lines[editBU].push(name);
    // Init plan 0 for all shifts
    SHIFTS.forEach(s => {
      if (!c.plan[editBU]) c.plan[editBU] = {};
      if (!c.plan[editBU][s]) c.plan[editBU][s] = {};
      c.plan[editBU][s][name] = 0;
    });
    setLocalCfg(c); setNewLineName(""); setSaved(false);
  };

  const removeLine = (line) => {
    if (!window.confirm(`Remove "${line}" from ${editBU}? This removes it from all shifts.`)) return;
    const c = cloneCfg();
    if (!c.lines[editBU]) c.lines[editBU] = [...lines];
    c.lines[editBU] = c.lines[editBU].filter(l => l !== line);
    SHIFTS.forEach(s => {
      if (c.plan[editBU]?.[s]) delete c.plan[editBU][s][line];
    });
    setLocalCfg(c); setSaved(false);
  };

  const startRename = (line) => { setRenamingLine(line); setRenameVal(line); };

  const commitRename = (oldName) => {
    const newName = renameVal.trim();
    if (!newName || newName === oldName) { setRenamingLine(null); return; }
    if (lines.includes(newName)) { alert("That name already exists."); return; }
    const c = cloneCfg();
    if (!c.lines[editBU]) c.lines[editBU] = [...lines];
    const idx = c.lines[editBU].indexOf(oldName);
    if (idx !== -1) c.lines[editBU][idx] = newName;
    // Migrate plan values across all shifts
    SHIFTS.forEach(s => {
      if (c.plan[editBU]?.[s] !== undefined) {
        const val = c.plan[editBU][s][oldName] ?? 0;
        delete c.plan[editBU][s][oldName];
        c.plan[editBU][s][newName] = val;
      }
    });
    setLocalCfg(c); setRenamingLine(null); setSaved(false);
  };

  const moveLine = (line, dir) => {
    const c = cloneCfg();
    if (!c.lines[editBU]) c.lines[editBU] = [...lines];
    const arr = c.lines[editBU];
    const i = arr.indexOf(line);
    if (i < 0) return;
    const j = i + dir;
    if (j < 0 || j >= arr.length) return;
    [arr[i], arr[j]] = [arr[j], arr[i]];
    setLocalCfg(c); setSaved(false);
  };

  const handleSave = async () => {
    setSaving(true);
    await onSave(localCfg);
    setSaving(false); setSaved(true);
    setTimeout(() => setSaved(false), 3000);
  };

  const totalPlan = lines.reduce((s,l) => s + (plan[l]||0), 0);

  return (
    <div className="max-w-2xl">
      <div className="flex items-center gap-3 mb-4">
        <h2 className="text-lg font-bold" style={{color:"var(--text)"}}>Configuration</h2>
        <button onClick={() => setAuthed(false)} className="btn-secondary text-xs py-1 px-3">🔒 Lock</button>
      </div>

      {/* BU + Shift pickers */}
      <div className="card mb-4">
        <div className="text-sm mb-2" style={{color:"var(--text3)"}}>Business Unit</div>
        <div className="flex flex-wrap gap-2 mb-4">
          {BUS.map(b => (
            <button key={b} onClick={() => { setEditBU(b); setRenamingLine(null); setNewLineName(""); }}
              className={`px-3 py-2 rounded-lg text-sm font-semibold transition-all ${editBU===b?"tab-active":"tab-inactive"}`}
              style={editBU===b?{background:BU_COLORS[b]}:{}}>
              {b}
            </button>
          ))}
        </div>
        <div className="text-sm mb-2" style={{color:"var(--text3)"}}>Shift (for plan numbers)</div>
        <div className="flex gap-2">
          {SHIFTS.map(s => (
            <button key={s} onClick={() => setEditShift(s)}
              className={`px-4 py-2 rounded-lg text-sm font-semibold transition-all ${editShift===s?"tab-active":"tab-inactive"}`}>
              {s}
            </button>
          ))}
        </div>
      </div>

      {/* Line manager */}
      <div className="card mb-4">
        <div className="flex items-center justify-between mb-3">
          <div className="text-sm font-semibold" style={{color:"var(--text3)"}}>
            Lines — <span style={{color:BU_COLORS[editBU]}}>{editBU}</span>
            <span className="ml-2 font-normal" style={{color:"var(--text4)"}}>Plan shown for {editShift}</span>
          </div>
          <span className="text-sm" style={{color:"var(--text3)"}}>Total: <strong style={{color:"var(--text)"}}>{totalPlan}</strong></span>
        </div>

        {/* Column headers */}
        <div className="grid text-xs mb-2 px-1" style={{gridTemplateColumns:"1fr 70px 44px 80px",color:"var(--text4)"}}>
          <span>Line name</span><span className="text-center">Plan ({editShift})</span><span></span><span className="text-right">Actions</span>
        </div>

        <div className="space-y-1.5">
          {lines.map((line, idx) => (
            <div key={line} className="grid items-center gap-2 px-1 py-1 rounded-lg" style={{gridTemplateColumns:"1fr 70px 44px 80px", background:"var(--bg3)"}}>

              {/* Name / rename input */}
              {renamingLine === line ? (
                <input autoFocus value={renameVal} onChange={e=>setRenameVal(e.target.value)}
                  onKeyDown={e=>{ if(e.key==="Enter") commitRename(line); if(e.key==="Escape") setRenamingLine(null); }}
                  onBlur={() => commitRename(line)}
                  className="input-comment text-sm font-medium" style={{padding:"3px 6px"}}/>
              ) : (
                <span className="text-sm font-medium truncate" style={{color:"var(--text)"}}>{line}</span>
              )}

              {/* Plan number */}
              <div className="flex justify-center">
                <input type="number" min="0" max="99"
                  value={plan[line] ?? 0}
                  onChange={e => setPlanVal(line, e.target.value)}
                  className="input-num" style={{width:"56px"}}/>
              </div>

              {/* Move up/down */}
              <div className="flex flex-col gap-0.5 items-center">
                <button onClick={() => moveLine(line, -1)} disabled={idx===0}
                  style={{background:"none",border:"none",cursor:idx===0?"default":"pointer",color:idx===0?"var(--text4)":"var(--text3)",fontSize:"0.7rem",lineHeight:1,padding:"1px 4px"}}>▲</button>
                <button onClick={() => moveLine(line, 1)} disabled={idx===lines.length-1}
                  style={{background:"none",border:"none",cursor:idx===lines.length-1?"default":"pointer",color:idx===lines.length-1?"var(--text4)":"var(--text3)",fontSize:"0.7rem",lineHeight:1,padding:"1px 4px"}}>▼</button>
              </div>

              {/* Rename + Remove */}
              <div className="flex gap-1 justify-end">
                <button onClick={() => renamingLine===line ? commitRename(line) : startRename(line)}
                  style={{background:"var(--bg2)",border:"1px solid var(--border)",color:"var(--text3)",borderRadius:"5px",padding:"3px 8px",cursor:"pointer",fontSize:"0.75rem"}}>
                  {renamingLine===line?"✓":"✏️"}
                </button>
                <button onClick={() => removeLine(line)}
                  style={{background:"rgba(220,38,38,0.15)",border:"1px solid rgba(220,38,38,0.3)",color:"#f87171",borderRadius:"5px",padding:"3px 8px",cursor:"pointer",fontSize:"0.75rem"}}>
                  �—�
                </button>
              </div>
            </div>
          ))}
        </div>

        {/* Add new line */}
        <div className="flex gap-2 mt-4 pt-3" style={{borderTop:"1px solid var(--border)"}}>
          <input value={newLineName} onChange={e=>setNewLineName(e.target.value)}
            placeholder="New line name…" className="input-comment flex-1"
            onKeyDown={e=>e.key==="Enter"&&addLine()}/>
          <button onClick={addLine} className="btn-primary text-sm py-2 px-4">+ Add</button>
        </div>
        <p className="text-xs mt-2" style={{color:"var(--text4)"}}>
          Line names are shared across all shifts. Plan numbers are per-shift — switch shift above to edit each.
        </p>
      </div>

      {/* Assigned headcount per shift */}
      <div className="card mb-4">
        <div className="text-sm font-semibold mb-1" style={{color:"var(--text3)"}}>
          Assigned Headcount — <span style={{color:BU_COLORS[editBU]}}>{editBU}</span>
        </div>
        <p className="text-xs mb-3" style={{color:"var(--text4)"}}>
          Total people assigned to this BU per shift. If everyone shows up, surplus = Assigned − Plan.
        </p>
        <div className="flex gap-6 flex-wrap">
          {SHIFTS.map(s => {
            const val = (localCfg.assigned?.[editBU] || DEFAULT_ASSIGNED[editBU] || {})[s] || 0;
            const planTotal = lines.reduce((sum, l) => sum + ((localCfg.plan[editBU]?.[s]?.[l]) || (DEFAULT_PLAN[editBU]?.[s]?.[l]) || 0), 0);
            const surplus = val - planTotal;
            return (
              <div key={s} className="flex flex-col items-center gap-1">
                <div className="text-xs font-semibold" style={{color:"var(--text3)"}}>{s}</div>
                <input type="number" min="0" max="999"
                  value={val}
                  onChange={e => {
                    const c = cloneCfg();
                    if (!c.assigned) c.assigned = JSON.parse(JSON.stringify(DEFAULT_ASSIGNED));
                    if (!c.assigned[editBU]) c.assigned[editBU] = {};
                    c.assigned[editBU][s] = Number(e.target.value) || 0;
                    setLocalCfg(c); setSaved(false);
                  }}
                  className="input-num" style={{width:"72px", fontSize:"1.1rem"}}/>
                <div className="text-xs" style={{color: surplus > 0 ? "#22c55e" : surplus < 0 ? "#ef4444" : "var(--text4)"}}>
                  {planTotal > 0 ? (surplus > 0 ? `+${surplus} extra` : surplus < 0 ? `${surplus} short` : "exact") : ""}
                </div>
              </div>
            );
          })}
        </div>
      </div>

      <button onClick={handleSave} disabled={saving}
        className="btn-primary w-full py-3 text-base"
        style={saved?{background:"#16a34a"}:{}}>
        {saving ? "Saving…" : saved ? "✓ Saved!" : "💾 Save Configuration"}
      </button>

      <div className="card mt-6">
        <div className="text-sm font-semibold mb-2" style={{color:"var(--text3)"}}>⚠️ Danger Zone</div>
        <p className="text-xs mb-3" style={{color:"var(--text4)"}}>Reset all lines and plan numbers back to the original defaults from the whiteboard.</p>
        <button onClick={() => {
          if (!window.confirm("Reset ALL lines and plan numbers to defaults? This cannot be undone.")) return;
          const c = cloneCfg();
          c.plan = JSON.parse(JSON.stringify(DEFAULT_PLAN));
          c.lines = JSON.parse(JSON.stringify(DEFAULT_LINES));
          c.assigned = JSON.parse(JSON.stringify(DEFAULT_ASSIGNED));
          setLocalCfg(c); setSaved(false);
        }} className="btn-danger text-sm">Reset Everything to Defaults</button>
      </div>
    </div>
  );
}

// ─── Mount ────────────────────────────────────────────────────────────────────
const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
</html>
