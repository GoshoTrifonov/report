  async function getGoogleAccessToken() {
    const now = Math.floor(Date.now() / 1000);
    const header = { alg: "RS256", typ: "JWT" };
    const payload = {
      iss: SHEETS_CONFIG.clientEmail,
      scope: "https://www.googleapis.com/auth/spreadsheets",
      aud: "https://oauth2.googleapis.com/token",
      exp: now + 3600, iat: now,
    };
    const b64 = obj => btoa(JSON.stringify(obj)).replace(/=/g,"").replace(/\+/g,"-").replace(/\//g,"_");
    const sigInput = `${b64(header)}.${b64(payload)}`;
    const pemBody = SHEETS_CONFIG.privateKey.replace(/-----BEGIN PRIVATE KEY-----|-----END PRIVATE KEY-----|\n/g,"");
    const keyData = Uint8Array.from(atob(pemBody), c => c.charCodeAt(0));
    const cryptoKey = await crypto.subtle.importKey("pkcs8", keyData.buffer, { name:"RSASSA-PKCS1-v1_5", hash:"SHA-256" }, false, ["sign"]);
    const sig = await crypto.subtle.sign("RSASSA-PKCS1-v1_5", cryptoKey, new TextEncoder().encode(sigInput));
    const sigB64 = btoa(String.fromCharCode(...new Uint8Array(sig))).replace(/=/g,"").replace(/\+/g,"-").replace(/\//g,"_");
    const jwt = `${sigInput}.${sigB64}`;
    const resp = await fetch("https://oauth2.googleapis.com/token", {
      method:"POST", headers:{"Content-Type":"application/x-www-form-urlencoded"},
      body:`grant_type=urn%3Aietf%3Aparams%3Aoauth%3Agrant-type%3Ajwt-bearer&assertion=${jwt}`,
    });
    const data = await resp.json();
    if (!data.access_token) throw new Error("Token error: " + JSON.stringify(data));
    return data.access_token;
  }

  async function exportReportsToSheet(docs, token) {
    const SHEET_ID = SHEETS_CONFIG.spreadsheetId;
    const API = `https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}`;
    const headers = { Authorization: `Bearer ${token}`, "Content-Type": "application/json" };
    const byMonth = {};
    for (const doc of docs) {
      if (!doc.date) continue;
      const d = new Date(doc.date + "T12:00:00");
      const tab = d.toLocaleDateString("en-US", { month:"short", year:"numeric" });
      if (!byMonth[tab]) byMonth[tab] = [];
      byMonth[tab].push(doc);
    }
    const metaResp = await fetch(`${API}?fields=sheets.properties`, { headers });
    const meta = await metaResp.json();
    const existingTabs = (meta.sheets||[]).map(s => s.properties.title);
    for (const [tabName, tabDocs] of Object.entries(byMonth)) {
      if (!existingTabs.includes(tabName)) {
        await fetch(`${API}:batchUpdate`, { method:"POST", headers,
          body: JSON.stringify({ requests:[{ addSheet:{ properties:{ title:tabName } } }] }) });
      }
      const rows = [["Date","Day","Shift","BU","Resource","WO","Description","Qty","Eff%","Hrs Worked","Lost/Earned","Notes","Reason","By"]];
      for (const doc of tabDocs.sort((a,b) => a.date.localeCompare(b.date)||a.shiftId-b.shiftId)) {
        const d = new Date(doc.date+"T12:00:00");
        const dateStr = d.toLocaleDateString("en-CA");
        const dayStr  = d.toLocaleDateString("en-US",{weekday:"short"});
        const sl = doc.shiftLabel||`Shift ${doc.shiftId}`;
        const bu = doc.bu||"";
        for (const w of (doc.wos||[])) {
          if (!w.qty && !w.notes) continue;
          rows.push([dateStr,dayStr,sl,bu,w.resource||"",w.wo||"",w.descr||"",w.qty||0,
            w.eff!=null?parseFloat(w.eff.toFixed(1)):"",
            w.hrs>0?parseFloat(w.hrs.toFixed(1)):"",
            w.lost!==0?parseFloat(w.lost.toFixed(1)):"",
            w.notes||"",w.reason||"",w.by||""]);
        }
      }
      await fetch(`${API}/values/${encodeURIComponent(tabName)}:clear`,{method:"POST",headers});
      await fetch(`${API}/values/${encodeURIComponent(tabName)}!A1?valueInputOption=RAW`,{
        method:"PUT",headers,body:JSON.stringify({values:rows})});
      const sm = await fetch(`${API}?fields=sheets.properties`,{headers});
      const sd = await sm.json();
      const so = (sd.sheets||[]).find(s=>s.properties.title===tabName);
      if (so) {
        await fetch(`${API}:batchUpdate`,{method:"POST",headers,
          body:JSON.stringify({requests:[{autoResizeDimensions:{dimensions:{sheetId:so.properties.sheetId,dimension:"COLUMNS",startIndex:0,endIndex:14}}}]})});
      }
    }
    return Object.keys(byMonth).length;
  }

<script type="text/babel" data-presets="react">

// ── Constants ──────────────────────────────────────────────────────────────
const LEADER_TO_BU = {
  "George":    "BU Verathon",
  "Andrew B.": "BU Molding",
  "Mark P.":   "BU Tier 1",

const buName = (leader) => LEADER_TO_BU[leader] || leader;

  { id:1, label:"Shift 1", time:"11pm–7am" },

];
const fmtNum = (n) => n==null ? "–" : Number(n).toLocaleString(undefined,{maximumFractionDigits:1});

// ── Date helpers ───────────────────────────────────────────────────────────
const ymd = (d) => d.toISOString().slice(0,10);
const sow = (d) => { const r=new Date(d); r.setDate(r.getDate()-r.getDay()); r.setHours(0,0,0,0); return r; };
const som = (d) => new Date(d.getFullYear(), d.getMonth(), 1);

function rangeISO(key, now) {
  let fromISO="", toISO=ymd(now), prevFrom="", prevTo="";
  if (key==="today") {
    fromISO=toISO=ymd(now);
    const y=new Date(now); y.setDate(y.getDate()-1);
    prevFrom=prevTo=ymd(y);
  } else if (key==="yesterday") {
    const y=new Date(now); y.setDate(y.getDate()-1);
    fromISO=toISO=ymd(y);
    const y2=new Date(now); y2.setDate(y2.getDate()-2);
    prevFrom=prevTo=ymd(y2);
  } else if (key==="this_week") {
    fromISO=ymd(sow(now)); toISO=ymd(now);
    const lws=sow(now); lws.setDate(lws.getDate()-7);
    const lwe=new Date(lws); lwe.setDate(lwe.getDate()+6);
    prevFrom=ymd(lws); prevTo=ymd(lwe);
  } else if (key==="last_week") {
    const lws=sow(now); lws.setDate(lws.getDate()-7);
    const lwe=new Date(lws); lwe.setDate(lwe.getDate()+6);
    fromISO=ymd(lws); toISO=ymd(lwe);
    const plws=new Date(lws); plws.setDate(plws.getDate()-7);
    const plwe=new Date(plws); plwe.setDate(plwe.getDate()+6);
    prevFrom=ymd(plws); prevTo=ymd(plwe);
  } else if (key==="this_month") {
    fromISO=ymd(som(now)); toISO=ymd(now);
    const lm=new Date(now.getFullYear(),now.getMonth()-1,1);
    const lme=new Date(now.getFullYear(),now.getMonth(),0);
    prevFrom=ymd(lm); prevTo=ymd(lme);
  } else if (key==="last_month") {
    const lm=new Date(now.getFullYear(),now.getMonth()-1,1);
    const lme=new Date(now.getFullYear(),now.getMonth(),0);
    fromISO=ymd(lm); toISO=ymd(lme);
    const pm=new Date(now.getFullYear(),now.getMonth()-2,1);
    const pme=new Date(now.getFullYear(),now.getMonth()-1,0);
    prevFrom=ymd(pm); prevTo=ymd(pme);
  }
  return { fromISO, toISO, prevFrom, prevTo };
}

function StatCard({ label, value, accent="slate", big=false }) {
  const colors = {
    slate: { bg:"bg-slate-50",  border:"border-slate-200",  text:"text-slate-800" },
    green: { bg:"bg-emerald-50",border:"border-emerald-300",text:"text-emerald-700"},
    amber: { bg:"bg-amber-50",  border:"border-amber-300",  text:"text-amber-700" },
    rose:  { bg:"bg-rose-50",   border:"border-rose-300",   text:"text-rose-700"  },

  const c = colors[accent]||colors.slate;
  return (
    <div className={`rounded-lg border px-3 py-2.5 flex flex-col justify-center ${c.bg} ${c.border}`}>

  const sz = size==="lg"?"text-2xl font-bold":size==="sm"?"text-[11px] font-semibold":"text-sm font-bold";
  return <span className={`tabular-nums ${color} ${sz}`}>{eff.toFixed(1)}%</span>;

// ── History tab ────────────────────────────────────────────────────────────
function HistoryTab({ allDocs, shiftLogsRef }) {
  const [buFilter,   setBuFilter]   = useState("__ALL__");
  const [shiftF,     setShiftF]     = useState(0);
  const [rangeF,     setRangeF]     = useState("this_week");
  const [selected,   setSelected]   = useState(null);
  const [noteInput,  setNoteInput]  = useState("");
  const [noteSaving, setNoteSaving] = useState(false);
  const [woNoteTarget, setWoNoteTarget] = useState(null);
  const [woNoteInput,  setWoNoteInput]  = useState("");
  // local copy so note saves reflect immediately
  const [docs, setDocs] = useState(allDocs);
  useEffect(() => { setDocs(allDocs); }, [allDocs]);

  const now = new Date();
  const { fromISO, toISO } = rangeISO(rangeF, now);

  const filtered = useMemo(() => {
    return docs
      .filter(r =>
        r.date >= fromISO && r.date <= toISO &&
        (buFilter==="__ALL__" || r.leader===buFilter) &&
        (shiftF===0 || r.shiftId===shiftF)
      )
      .sort((a,b) => b.date!==a.date ? b.date.localeCompare(a.date) : b.shiftId-a.shiftId);
  }, [docs, fromISO, toISO, buFilter, shiftF]);

  const saveHistoryNote = async () => {
    if (!noteInput.trim()||!selected) return;
    setNoteSaving(true);
    const newNote = { text:noteInput.trim(), by:localStorage.getItem("build_tracker_initials")||"?", at:new Date().toISOString() };
    try {
      await SHIFT_REPORTS_REF.doc(selected.id).update({
        reportNotes: firebase.firestore.FieldValue.arrayUnion(newNote)
      });
      const updated = { ...selected, reportNotes:[...(selected.reportNotes||[]),newNote] };
      setSelected(updated);
      setDocs(prev => prev.map(d => d.id===selected.id ? updated : d));
      setNoteInput("");
    } catch(e) { console.error(e); }
    setNoteSaving(false);
  };

  const saveWoNote = async (woKey) => {
    if (!woNoteInput.trim()||!selected) return;
    const by = localStorage.getItem("build_tracker_initials")||"?";
    const updatedWos = (selected.wos||[]).map(w => {
      if (w.wo===woKey) {
        const existing = w.notes ? w.notes+" | " : "";
        return { ...w, notes: existing+`[${by}] ${woNoteInput.trim()}` };
      }
      return w;
    });
    try {
      await SHIFT_REPORTS_REF.doc(selected.id).update({ wos:updatedWos });
      const updated = { ...selected, wos:updatedWos };
      setSelected(updated);
      setDocs(prev => prev.map(d => d.id===selected.id ? updated : d));
      setWoNoteTarget(null); setWoNoteInput("");
    } catch(e) { console.error(e); }
  };

  const printReport = () => window.print();

  const copyReport = (r) => {
    const lines = [];
    lines.push(`SHIFT REPORT — ${r.bu||buName(r.leader)}`);
    const dt = new Date(r.date+"T12:00:00");
    lines.push(dt.toLocaleDateString(undefined,{weekday:"long",month:"short",day:"numeric",year:"numeric"})+" — "+(r.shiftLabel||`Shift ${r.shiftId}`)+" ("+(r.shiftTime||"")+")" );
    lines.push("=".repeat(60));
    lines.push(`Total units: ${(r.totalUnits||0).toLocaleString()}`);
    if (r.totalEff!=null) lines.push(`Efficiency: ${r.totalEff.toFixed(1)}%`);
    if (r.totalHrs>0) lines.push(`Hours: ${r.totalHrs.toFixed(1)}h`);
    lines.push("");
    const wos=r.wos||[]; const byRes={};
    for (const w of wos) { if (!byRes[w.resource]) byRes[w.resource]=[]; byRes[w.resource].push(w); }
    for (const [res,items] of Object.entries(byRes)) {
      lines.push(`--- ${res} ---`);
      for (const w of items) {
        lines.push(`  ${w.wo} — ${w.descr||""}: +${w.qty} units${w.eff!=null?" Eff "+w.eff.toFixed(1)+"%" : ""}`);
        if (w.notes) lines.push(`    ${w.notes}`);
      }
    }
    navigator.clipboard.writeText(lines.join("\n")).then(()=>alert("Copied!")).catch(()=>alert("Copy failed"));
  };

  if (selected) {
    const wos = selected.wos||[];
    const byRes = {};
    for (const w of wos) { if (!byRes[w.resource]) byRes[w.resource]=[]; byRes[w.resource].push(w); }
    const dt = new Date(selected.date+"T12:00:00");
    const dateStr = dt.toLocaleDateString(undefined,{weekday:"long",month:"short",day:"numeric",year:"numeric"});

    return (
      <div className="flex flex-col h-full print-area">
        {/* Back bar */}

          </button>
          <span className="text-slate-300">|</span>

          <span className="text-slate-300">—</span>

        <div className="flex-1 overflow-auto p-4">

          <div className="hidden print:block mb-4 pb-3 border-b-2 border-slate-900">

          <div className="grid grid-cols-4 gap-2 mb-3">

            <StatCard label="Entries"     value={selected.entries||0} />
            <StatCard label="Resources"   value={selected.resourceCount||0} />

          </div>
          {(selected.totalEff!=null||selected.totalHrs>0) && (
            <div className="grid grid-cols-3 gap-2 mb-4">
              {selected.totalEff!=null && (

                      {w.downtimeReason && (

                      )}
                      {w.notes && <div className="mt-1 text-[11px] text-slate-600 italic border-l-2 border-stone-300 pl-2">{w.notes}</div>}
                      {/* WO note input */}
                      {woNoteTarget===w.wo ? (
                        <div className="flex gap-1.5 mt-2 print:hidden">
                          <input autoFocus value={woNoteInput} onChange={e=>setWoNoteInput(e.target.value)}

                            onKeyDown={e=>{ if(e.key==="Enter"&&woNoteInput.trim()) saveWoNote(w.wo); if(e.key==="Escape"){setWoNoteTarget(null);setWoNoteInput("");} }}
                          />
                          <button onClick={()=>saveWoNote(w.wo)} disabled={!woNoteInput.trim()}
                            className="px-2 py-1 text-xs font-semibold bg-blue-600 text-white rounded disabled:opacity-40">Save</button>
                          <button onClick={()=>{setWoNoteTarget(null);setWoNoteInput("");}}
                            className="px-2 py-1 text-xs font-semibold bg-stone-200 text-slate-700 rounded">Cancel</button>
                        </div>
                      ) : (
                        <button onClick={()=>{setWoNoteTarget(w.wo);setWoNoteInput("");}}
                          className="mt-1 text-[10px] text-blue-500 hover:text-blue-700 print:hidden">+ Add note</button>
                      )}
                    </div>

        {/* Footer */}
        <div className="px-4 py-3 border-t border-stone-200 bg-stone-50 flex-shrink-0 print:hidden">
          {/* Report-level notes */}
          {(selected.reportNotes||[]).length>0 && (
            <div className="mb-3 space-y-1.5">
              <div className="text-[10px] font-semibold uppercase tracking-wider text-slate-400 mb-1">Report notes</div>
              {selected.reportNotes.map((n,i)=>(
                <div key={i} className="bg-white border border-stone-200 rounded p-2">

          )}
          <div className="flex gap-2 mb-2">
            <input value={noteInput} onChange={e=>setNoteInput(e.target.value)}
              placeholder="Add a note to this report…"

              onKeyDown={e=>{ if(e.key==="Enter"&&noteInput.trim()) saveHistoryNote(); }}

            <button onClick={()=>copyReport(selected)} className="flex-1 flex items-center justify-center gap-1.5 px-3 py-2 rounded-md bg-slate-900 text-white text-sm font-semibold hover:bg-slate-800">
              <Clipboard className="w-4 h-4"/> Copy
            </button>
            <button onClick={printReport} className="px-3 py-2 rounded-md bg-stone-200 text-slate-800 text-sm font-semibold hover:bg-stone-300 flex items-center gap-1.5">
              <Printer className="w-4 h-4"/> Print
            </button>
          </div>
        </div>
      </div>
    );
  }

  // List view
  return (
    <div className="flex flex-col h-full">
      {/* Filters */}
      <div className="px-4 pt-3 pb-2 border-b border-stone-100 bg-stone-50 flex flex-col gap-2 flex-shrink-0">
        <div className="flex items-center gap-2 flex-wrap">
          <span className="text-[10px] font-semibold uppercase tracking-wider text-slate-400">BU</span>
          <BUPicker value={buFilter} onChange={v=>{setBuFilter(v);setSelected(null);}} />
        </div>
        <div className="flex items-center gap-4 flex-wrap">
          <div className="flex items-center gap-2">
            <span className="text-[10px] font-semibold uppercase tracking-wider text-slate-400">Shift</span>
            <ShiftPicker value={shiftF} onChange={setShiftF} />
          </div>
          <RangePicker value={rangeF} onChange={setRangeF} />
          <span className="text-[10px] text-slate-400 ml-auto">{filtered.length} report{filtered.length!==1?"s":""}</span>
        </div>
      </div>

      {/* List */}
      <div className="flex-1 overflow-auto p-4">
        {filtered.length===0 && (
          <div className="text-center py-12 text-sm text-slate-400 italic">No saved reports for this selection.</div>
        )}
        <div className="space-y-2">
          {filtered.map(r=>{
            const effColor = r.totalEff==null?"text-slate-400":r.totalEff>=90?"text-emerald-600":r.totalEff>=76.5?"text-amber-600":"text-rose-600";
            const effBg    = r.totalEff==null?"bg-slate-50 border-slate-200":r.totalEff>=90?"bg-emerald-50 border-emerald-200":r.totalEff>=76.5?"bg-amber-50 border-amber-200":"bg-rose-50 border-rose-200";
            const dt = new Date(r.date+"T12:00:00");

            const sMeta = SHIFTS.find(s=>s.id===r.shiftId)||SHIFTS[0];
            return (
              <div key={r.id} onClick={()=>setSelected(r)}
                className="border border-stone-200 rounded-lg p-3 bg-white hover:border-blue-300 hover:shadow-sm cursor-pointer transition-all">
                <div className="flex items-center justify-between gap-3">
                  <div className="flex items-center gap-2 flex-wrap min-w-0">
                    <span className="text-[10px] font-bold uppercase tracking-wide bg-slate-100 text-slate-600 px-1.5 py-0.5 rounded">
                      {r.bu||buName(r.leader)}
                    </span>

                    <span className="text-[11px] text-slate-400">{r.shiftLabel||sMeta.label} · {r.shiftTime||sMeta.time}</span>
                  </div>
                  <div className="flex items-center gap-2 shrink-0">
                    {r.totalEff!=null && (
                      <span className={`text-[11px] font-bold px-1.5 py-0.5 rounded border ${effBg} ${effColor}`}>

                      </span>

                  {r.entries>0   && <span className="text-[10px] text-slate-500">{r.entries} WOs</span>}

}

// ── Analytics tab ──────────────────────────────────────────────────────────
function AnalyticsTab({ allDocs, allLogsSnap }) {
  const [buFilter,    setBuFilter]    = useState("__ALL__");
  const [rangeF,      setRangeF]      = useState("this_week");
  const [shiftF,      setShiftF]      = useState(0);
  const [loading,     setLoading]     = useState(false);
  const [data,        setData]        = useState(null);

  useEffect(() => {
    setLoading(true);
    setData(null);
    const now = new Date();
    const { fromISO, toISO, prevFrom, prevTo } = rangeISO(rangeF, now);
    const TARGET = 90;

    const docs = allDocs.filter(d =>
      d.date>=fromISO && d.date<=toISO &&
      (buFilter==="__ALL__" || d.leader===buFilter) &&
      (shiftF===0 || d.shiftId===shiftF)
    );
    const prevDocs = allDocs.filter(d =>
      d.date>=prevFrom && d.date<=prevTo &&
      (buFilter==="__ALL__" || d.leader===buFilter)
    );

    const byResource = {};
    const byShift = {1:{earned:0,hrs:0,units:0,count:0},2:{earned:0,hrs:0,units:0,count:0},3:{earned:0,hrs:0,units:0,count:0}};
    let thisEarned=0,thisHrs=0,thisUnits=0,thisLost=0;
    let prevEarned=0,prevHrs=0;
    const reasonCount={};
    const dailyEff={};

    for (const doc of docs) {
      const s=byShift[doc.shiftId]||byShift[2];
      for (const w of (doc.wos||[])) {
        if (!w.qty&&!w.hrs) continue;
        if (!byResource[w.resource]) byResource[w.resource]={resource:w.resource,earned:0,hrs:0,lost:0,units:0,reasons:{},downtimeHrs:0,downtimeReasons:{},downtimeNotes:[]};
        const r=byResource[w.resource];
        r.earned+=w.earned||0; r.hrs+=w.hrs||0; r.lost+=w.lost||0; r.units+=w.qty||0;
        if (w.reason) { r.reasons[w.reason]=(r.reasons[w.reason]||0)+1; reasonCount[w.reason]=reasonCount[w.reason]||{count:0,lost:0}; reasonCount[w.reason].count+=1; reasonCount[w.reason].lost+=w.lost||0; }
        if (w.downtimeReason&&w.downtimeDuration>0) {
          r.downtimeHrs+=w.downtimeDuration; r.downtimeReasons[w.downtimeReason]=(r.downtimeReasons[w.downtimeReason]||0)+w.downtimeDuration;
          if (w.notes) r.downtimeNotes.push({wo:w.wo,note:w.notes,reason:w.downtimeReason});
        }
        // Collect all WO notes for AI summary
        if (w.notes) {
          if (!r.allNotes) r.allNotes=[];
          r.allNotes.push({wo:w.wo,note:w.notes,reason:w.reason||'',lost:w.lost||0});
        }
        s.earned+=w.earned||0; s.hrs+=w.hrs||0; s.units+=w.qty||0; s.count++;
        thisEarned+=w.earned||0; thisHrs+=w.hrs||0; thisUnits+=w.qty||0; thisLost+=w.lost||0;
        if (!dailyEff[doc.date]) dailyEff[doc.date]={earned:0,hrs:0};
        dailyEff[doc.date].earned+=w.earned||0; dailyEff[doc.date].hrs+=w.hrs||0;
      }
    }
    for (const doc of prevDocs) {
      for (const w of (doc.wos||[])) { prevEarned+=w.earned||0; prevHrs+=w.hrs||0; }
    }
    // Line-level downtime
    for (const doc of docs) {
      for (const d of (doc.linesDown||[])) {
        if (!d.resource||!d.reason||d.reason==="Not Scheduled"||!(d.duration>0)) continue;
        if (!byResource[d.resource]) continue;
        byResource[d.resource].downtimeHrs=(byResource[d.resource].downtimeHrs||0)+d.duration;
        byResource[d.resource].downtimeReasons=byResource[d.resource].downtimeReasons||{};
        byResource[d.resource].downtimeReasons[d.reason]=(byResource[d.resource].downtimeReasons[d.reason]||0)+d.duration;
      }
    }

    const thisEff = thisHrs>0 ? Math.round(thisEarned/thisHrs*1000)/10 : null;
    const prevEff = prevHrs>0 ? Math.round(prevEarned/prevHrs*1000)/10 : null;
    const totalDowntimeHrs = Object.values(byResource).reduce((s,r)=>s+(r.downtimeHrs||0),0);
    const resources = Object.values(byResource).map(r=>({
      ...r,
      eff: r.hrs>0 ? Math.round(r.earned/r.hrs*1000)/10 : null,
      topReason: (() => {
        // Prefer downtime reason (most hours), fall back to underperf reason (most occurrences)
        const dtTop = Object.entries(r.downtimeReasons||{}).sort((a,b)=>b[1]-a[1])[0];
        if (dtTop) return dtTop[0] + ' (' + dtTop[1].toFixed(0) + 'h)';
        return Object.entries(r.reasons).sort((a,b)=>b[1]-a[1])[0]?.[0]||'';
      })(),
    })).sort((a,b)=>(a.lost||0)-(b.lost||0));
    const dailyEffSorted = Object.entries(dailyEff).sort(([a],[b])=>a.localeCompare(b)).map(([date,d])=>({ date, eff:d.hrs>0?Math.round(d.earned/d.hrs*1000)/10:null }));

    // Safety/NC from allLogsSnap
    let safetyCount=0, ncCount=0;
    if (allLogsSnap) {
      allLogsSnap.forEach(doc => {
        const log=doc.data();
        if (log.shiftDate<fromISO||log.shiftDate>toISO) return;
        if (buFilter!=="__ALL__"&&log.bu!==buFilter) return;
        if (shiftF!==0&&log.shiftId!==shiftF) return;
        if (log.type==="safety") safetyCount++;
        if (log.type==="nc") ncCount++;
      });
    }

    setData({ thisEff, prevEff, thisUnits, thisLost, thisHrs, byShift, resources, reasonCount, TARGET, safetyCount, ncCount, totalDowntimeHrs, dailyEffSorted });
    setLoading(false);
  }, [allDocs, allLogsSnap, buFilter, rangeF, shiftF]);

  return (
    <div className="flex flex-col h-full">
      {/* Filters */}
      <div className="px-4 pt-3 pb-2 border-b border-stone-100 bg-stone-50 flex flex-col gap-2 flex-shrink-0">
        <div className="flex items-center gap-2 flex-wrap">
          <span className="text-[10px] font-semibold uppercase tracking-wider text-slate-400">BU</span>
          <BUPicker value={buFilter} onChange={setBuFilter} />
        </div>
        <div className="flex items-center gap-4 flex-wrap">
          <div className="flex items-center gap-2">
            <span className="text-[10px] font-semibold uppercase tracking-wider text-slate-400">Shift</span>
            <ShiftPicker value={shiftF} onChange={setShiftF} />
          </div>
          <RangePicker value={rangeF} onChange={setRangeF} />
        </div>
      </div>

      <div className="flex-1 overflow-auto">
        {loading && <div className="text-center py-12 text-sm text-slate-400">Loading analytics…</div>}
        {!loading && !data && <div className="text-center py-12 text-sm text-slate-400 italic">No data</div>}
        {!loading && data && (() => {
          const { thisEff, prevEff, thisUnits, thisLost, thisHrs, byShift, resources, reasonCount, TARGET, safetyCount, ncCount, totalDowntimeHrs, dailyEffSorted } = data;
          const trend = thisEff!=null&&prevEff!=null ? thisEff-prevEff : null;
          const effColor = thisEff==null?"#64748b":thisEff>=TARGET?"#16a34a":thisEff>=76.5?"#d97706":"#dc2626";
          const effBg    = thisEff==null?"#f8fafc":thisEff>=TARGET?"#f0fdf4":thisEff>=76.5?"#fffbeb":"#fff1f2";
          return (
            <div className="p-4 space-y-5">

              {/* At a glance */}
              <div>
                <div className="text-[10px] font-semibold uppercase tracking-wider text-slate-400 mb-2">At a glance</div>
                <div className="grid grid-cols-2 sm:grid-cols-4 gap-2 mb-2">
                  <div className="col-span-1 rounded-lg border-2 px-3 py-3 flex flex-col items-center justify-center" style={{backgroundColor:effBg,borderColor:effColor}}>
                    <div className="text-[10px] font-semibold uppercase tracking-wider mb-1" style={{color:effColor}}>Efficiency</div>
                    <div className="text-2xl font-bold tabular-nums" style={{color:effColor}}>{thisEff!=null?thisEff.toFixed(1)+"%":"—"}</div>
                    <div className="text-[10px] font-semibold mt-1" style={{color:effColor}}>target {TARGET}%</div>
                    {trend!=null && (
                      <div className={`text-[11px] font-bold mt-1 ${trend>=0?"text-emerald-600":"text-rose-600"}`}>
                        {trend>=0?"↑":"↓"} {Math.abs(trend).toFixed(1)}% vs prev
                      </div>
                    )}
                  </div>
                  <div className="rounded-lg border border-stone-200 bg-stone-50 px-3 py-3 flex flex-col justify-center">
                    <div className="text-[10px] font-semibold uppercase tracking-wider text-slate-400 mb-1">Total units</div>
                    <div className="text-xl font-bold text-slate-800 tabular-nums">{thisUnits.toLocaleString()}</div>
                  </div>
                  <div className="rounded-lg border border-stone-200 bg-stone-50 px-3 py-3 flex flex-col justify-center">
                    <div className="text-[10px] font-semibold uppercase tracking-wider text-slate-400 mb-1">Hours worked</div>
                    <div className="text-xl font-bold text-slate-800 tabular-nums">{thisHrs.toFixed(0)}h</div>
                  </div>
                  <div className={`rounded-lg border px-3 py-3 flex flex-col justify-center ${thisLost<0?"bg-rose-50 border-rose-300":"bg-emerald-50 border-emerald-200"}`}>
                    <div className="text-[10px] font-semibold uppercase tracking-wider text-slate-400 mb-1">{thisLost<0?"Lost hrs":"Earned hrs"}</div>
                    <div className={`text-xl font-bold tabular-nums ${thisLost<0?"text-rose-700":"text-emerald-700"}`}>{thisLost.toFixed(1)}h</div>
                  </div>
                  {totalDowntimeHrs>0 && (
                    <div className="rounded-lg border bg-rose-50 border-rose-300 px-3 py-3 flex flex-col justify-center">
                      <div className="text-[10px] font-semibold uppercase tracking-wider text-rose-400 mb-1">Downtime</div>
                      <div className="text-xl font-bold tabular-nums text-rose-700">{totalDowntimeHrs.toFixed(1)}h</div>
                    </div>
                  )}
                </div>
                {(safetyCount>0||ncCount>0) && (
                  <div className="flex gap-2 mt-2">
                    {safetyCount>0 && (
                      <div className="flex items-center gap-2 px-3 py-2 rounded-lg bg-red-50 border border-red-200">
                        <span className="text-[10px] font-bold uppercase tracking-wider text-red-600">Safety</span>
                        <span className="text-lg font-bold text-red-700 tabular-nums">{safetyCount}</span>
                        <span className="text-[10px] text-red-400">incident{safetyCount!==1?"s":""}</span>
                      </div>
                    )}
                    {ncCount>0 && (
                      <div className="flex items-center gap-2 px-3 py-2 rounded-lg bg-orange-50 border border-orange-200">
                        <span className="text-[10px] font-bold uppercase tracking-wider text-orange-600">NC</span>
                        <span className="text-lg font-bold text-orange-700 tabular-nums">{ncCount}</span>
                        <span className="text-[10px] text-orange-400">incident{ncCount!==1?"s":""}</span>
                      </div>
                    )}
                  </div>
                )}
              </div>

              {/* Where we struggle */}
              <div>
                <div className="flex items-baseline justify-between mb-2">
                  <div className="text-[10px] font-semibold uppercase tracking-wider text-slate-400">Where we struggle</div>
                  {(() => {
                    const withEff = resources.filter(r=>r.eff!=null);
                    const above=withEff.filter(r=>r.eff>=TARGET).length;
                    const near =withEff.filter(r=>r.eff>=76.5&&r.eff<TARGET).length;
                    const below=withEff.filter(r=>r.eff<76.5).length;
                    return (
                      <div className="flex items-center gap-1.5">
                        {above>0 && <span className="text-[10px] font-bold px-1.5 py-0.5 rounded bg-emerald-100 text-emerald-700">{above} ✓</span>}
                        {near >0 && <span className="text-[10px] font-bold px-1.5 py-0.5 rounded bg-amber-100 text-amber-700">{near} ~</span>}
                        {below>0 && <span className="text-[10px] font-bold px-1.5 py-0.5 rounded bg-rose-100 text-rose-700">{below} ✗</span>}
                      </div>
                    );
                  })()}
                </div>
                <div className="border border-stone-200 rounded-lg overflow-hidden">
                  <table className="w-full text-sm">
                    <thead>
                      <tr className="bg-stone-100 border-b border-stone-200">
                        <th className="text-left px-3 py-2 text-[10px] font-semibold uppercase tracking-wider text-slate-500">Resource</th>
                        <th className="text-right px-3 py-2 text-[10px] font-semibold uppercase tracking-wider text-slate-500">Eff</th>
                        <th className="text-right px-3 py-2 text-[10px] font-semibold uppercase tracking-wider text-slate-500">Lost</th>
                        <th className="text-right px-3 py-2 text-[10px] font-semibold uppercase tracking-wider text-slate-500">Units</th>
                        <th className="text-left px-3 py-2 text-[10px] font-semibold uppercase tracking-wider text-slate-500">Top reason</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-stone-100">
                      {resources.map((r,i)=>{
                        const rc=r.eff==null?"#64748b":r.eff>=TARGET?"#16a34a":r.eff>=76.5?"#d97706":"#dc2626";
                        const rb=r.eff==null?"white":r.eff>=TARGET?"#f0fdf4":r.eff>=76.5?"#fffbeb":"#fff1f2";
                        return (
                          <tr key={i} style={{backgroundColor:rb}}>
                            <td className="px-3 py-2 font-semibold text-slate-800 text-xs">{r.resource}</td>
                            <td className="px-3 py-2 text-right">
                              <span className="text-xs font-bold tabular-nums" style={{color:rc}}>{r.eff!=null?r.eff.toFixed(1)+"%":"—"}</span>
                            </td>
                            <td className="px-3 py-2 text-right">
                              <span className={`text-xs font-semibold tabular-nums ${r.lost<0?"text-rose-600":"text-emerald-600"}`}>{r.lost.toFixed(1)}h</span>
                            </td>
                            <td className="px-3 py-2 text-right text-xs text-slate-600 tabular-nums">{r.units.toLocaleString()}</td>
                            <td className="px-3 py-2 text-xs text-slate-500">
                              {r.topReason ? <span className="italic">{r.topReason}</span> : <span className="text-slate-300">—</span>}
                            </td>
                          </tr>
                        );
                      })}
                    </tbody>
                  </table>
                </div>
                {resources.filter(r=>r.eff!=null&&r.eff<TARGET).length===0 && (
                  <div className="text-center text-xs text-emerald-600 font-semibold mt-2">✓ All resources at or above target</div>
                )}
              </div>

              {/* Downtime by resource */}
              {totalDowntimeHrs>0 && (() => {
                const withDowntime = resources.filter(r=>r.downtimeHrs>0).sort((a,b)=>b.downtimeHrs-a.downtimeHrs);
                return (
                  <div>
                    <div className="flex items-baseline gap-2 mb-2">
                      <div className="text-[10px] font-semibold uppercase tracking-wider text-slate-400">Downtime by resource</div>
                      <div className="text-[11px] font-bold text-rose-600">{totalDowntimeHrs.toFixed(1)}h total</div>
                    </div>
                    <div className="space-y-1.5">
                      {withDowntime.map(r=><DowntimeCard key={r.resource} r={r} />)}
                    </div>
                  </div>
                );
              })()}

              {/* Shift breakdown */}
              <div>
                <div className="text-[10px] font-semibold uppercase tracking-wider text-slate-400 mb-2">Shift breakdown</div>
                <div className="grid grid-cols-3 gap-2">
                  {SHIFTS.map(s=>{
                    const sd=byShift[s.id]||{earned:0,hrs:0,units:0};
                    const sEff=sd.hrs>0?Math.round(sd.earned/sd.hrs*1000)/10:null;
                    const sc=sEff==null?"#64748b":sEff>=TARGET?"#16a34a":sEff>=76.5?"#d97706":"#dc2626";
                    const sb=sEff==null?"#f8fafc":sEff>=TARGET?"#f0fdf4":sEff>=76.5?"#fffbeb":"#fff1f2";
                    return (
                      <div key={s.id} className="rounded-lg border-2 px-3 py-3" style={{backgroundColor:sb,borderColor:sc}}>
                        <div className="text-[10px] font-bold uppercase tracking-wider mb-0.5" style={{color:sc}}>{s.label}</div>
                        <div className="text-[9px] text-slate-400 mb-2">{s.time}</div>
                        <div className="text-xl font-bold tabular-nums mb-1" style={{color:sc}}>{sEff!=null?sEff.toFixed(1)+"%":"—"}</div>
                        <div className="text-[10px] text-slate-500">{sd.units.toLocaleString()} units</div>
                        <div className="text-[10px] text-slate-400">{sd.hrs.toFixed(0)}h worked</div>
                      </div>
                    );
                  })}
                </div>
              </div>

              {/* Top underperformance reasons */}
              {Object.keys(reasonCount).length>0 && (
                <div>
                  <div className="text-[10px] font-semibold uppercase tracking-wider text-slate-400 mb-2">Top underperformance reasons</div>
                  <div className="space-y-1.5">
                    {Object.entries(reasonCount).sort((a,b)=>(b[1].lost||0)-(a[1].lost||0)).map(([reason,d])=>{
                      const maxLost=Math.abs(Object.values(reasonCount).sort((a,b)=>(b.lost||0)-(a.lost||0))[0]?.lost||1);
                      const pct=Math.min(100,Math.abs(d.lost||0)/maxLost*100);
                      return (
                        <div key={reason} className="flex items-center gap-2">
                          <div className="w-28 shrink-0 text-xs font-semibold text-slate-700 truncate">{reason}</div>
                          <div className="flex-1 bg-stone-100 rounded-full h-2 overflow-hidden">
                            <div className="h-full bg-amber-400 rounded-full" style={{width:pct+"%"}} />
                          </div>
                          <div className="text-[11px] text-slate-500 tabular-nums shrink-0 w-16 text-right">{d.lost.toFixed(1)}h · {d.count}x</div>
                        </div>
                      );
                    })}
                  </div>
                </div>
              )}

              {/* Daily efficiency trend */}
              {dailyEffSorted&&dailyEffSorted.length>1&&(()=>{
                const vals=dailyEffSorted.filter(d=>d.eff!=null);
                if (vals.length<2) return null;
                const maxV=Math.max(...vals.map(d=>d.eff),TARGET+5);
                const minV=Math.min(...vals.map(d=>d.eff),TARGET-10);
                const rng=maxV-minV||1;
                const W=100/(vals.length-1);
                const yP=v=>100-((v-minV)/rng*100);
                const tY=yP(TARGET);
                const pts=vals.map((d,i)=>`${i*W},${yP(d.eff)}`).join(" ");
                const byDow={};
                vals.forEach(d=>{
                  const dow=new Date(d.date+"T12:00:00").toLocaleDateString("en",{weekday:"short"});
                  if (!byDow[dow]) byDow[dow]={sum:0,count:0};
                  byDow[dow].sum+=d.eff; byDow[dow].count++;
                });
                const dowAvg=Object.entries(byDow).map(([d,v])=>({day:d,avg:Math.round(v.sum/v.count*10)/10})).sort((a,b)=>b.avg-a.avg);
                return (
                  <div>
                    <div className="text-[10px] font-semibold uppercase tracking-wider text-slate-400 mb-2">Daily efficiency trend</div>
                    <div className="relative bg-stone-50 border border-stone-200 rounded-lg p-3" style={{height:120}}>
                      <svg width="100%" height="88%" viewBox="0 0 100 100" preserveAspectRatio="none">
                        <line x1="0" y1={tY} x2="100" y2={tY} stroke="#16a34a" strokeWidth="0.5" strokeDasharray="2,2"/>
                        <polyline points={pts} fill="none" stroke="#3b82f6" strokeWidth="1.5" vectorEffect="non-scaling-stroke"/>
                        {vals.map((d,i)=>(
                          <circle key={i} cx={i*W} cy={yP(d.eff)} r="1.5"
                            fill={d.eff>=TARGET?"#16a34a":d.eff>=76.5?"#d97706":"#dc2626"}
                            vectorEffect="non-scaling-stroke"/>
                        ))}
                      </svg>
                      <div className="absolute bottom-1 left-3 right-3 flex justify-between">
                        <span className="text-[8px] text-slate-400">{vals[0].date.slice(5)}</span>
                        <span className="text-[9px] text-emerald-600 font-semibold">{TARGET}% target</span>
                        <span className="text-[8px] text-slate-400">{vals[vals.length-1].date.slice(5)}</span>
                      </div>
                    </div>
                    {dowAvg.length>=3 && (
                      <div className="mt-2 flex items-center gap-2 flex-wrap">
                        <span className="text-[10px] text-slate-400 font-semibold uppercase tracking-wider">By day:</span>
                        {dowAvg.map((d,i)=>(
                          <span key={d.day} className="text-[11px] font-semibold px-2 py-0.5 rounded"
                            style={{background:i===0?"#dcfce7":i===dowAvg.length-1?"#fff1f2":"#f1f5f9",
                                    color:i===0?"#15803d":i===dowAvg.length-1?"#be123c":"#475569"}}>
                            {d.day} {d.avg.toFixed(1)}%
                          </span>
                        ))}
                      </div>
                    )}
                  </div>
                );
              })()}
            </div>

              {/* AI Monthly Summary */}
              <AISummaryPanel data={data} rangeF={rangeF} buFilter={buFilter} />

            </div>
          );
        })()}
      </div>
    </div>
  );
}

// AI Summary Panel──────────────
function AISummaryPanel({ data, rangeF, buFilter }) {
  const [status,   setStatus]   = useState("idle"); // idle|loading|done|error
  const [summary,  setSummary]  = useState(null);
  const [copied,   setCopied]   = useState(false);

  const RANGE_LABELS = {
    today:"Today", yesterday:"Yesterday", this_week:"This week",
    last_week:"Last week", this_month:"This month", last_month:"Last month"
  };

  const buildPrompt = () => {
    if (!data) return "";
    const { thisEff, prevEff, thisUnits, thisLost, thisHrs, resources, byShift, reasonCount, safetyCount, ncCount, totalDowntimeHrs } = data;
    const buLabel = buFilter==="__ALL__" ? "All BUs" : buFilter;
    const rangeLabel = RANGE_LABELS[rangeF]||rangeF;

    let prompt = `You are analyzing production shift report data for SMI (Southmedic), a medical device manufacturer.

`;
    prompt += `Period: ${rangeLabel} | BU: ${buLabel}

`;
    prompt += `OVERALL PERFORMANCE
`;
    prompt += `- Efficiency: ${thisEff!=null?thisEff.toFixed(1)+"% (target 90%)":"no data"}
`;
    if (prevEff!=null) prompt += `- vs previous period: ${prevEff.toFixed(1)}% (${thisEff>=prevEff?"+":""}${(thisEff-prevEff).toFixed(1)}%)
`;
    prompt += `- Total units: ${thisUnits.toLocaleString()}
`;
    prompt += `- Hours worked: ${thisHrs.toFixed(0)}h
`;
    prompt += `- Lost/earned hours: ${thisLost.toFixed(1)}h
`;
    if (totalDowntimeHrs>0) prompt += `- Total downtime: ${totalDowntimeHrs.toFixed(1)}h
`;
    if (safetyCount>0) prompt += `- Safety incidents: ${safetyCount}
`;
    if (ncCount>0) prompt += `- NC incidents: ${ncCount}
`;

    prompt += `
SHIFT BREAKDOWN
`;
    [1,2,3].forEach(id => {
      const s = byShift[id]||{earned:0,hrs:0,units:0};
      const sEff = s.hrs>0 ? (s.earned/s.hrs*100).toFixed(1) : null;
      const label = ["","Midnight (11pm-7am)","Days (7am-3pm)","Afternoon (3pm-11pm)"][id];
      prompt += `- ${label}: ${sEff!=null?sEff+"%":"no data"}, ${s.units.toLocaleString()} units, ${s.hrs.toFixed(0)}h
`;
    });

    // Top struggling resources (below 90%)
    const struggling = resources.filter(r=>r.eff!=null&&r.eff<90).sort((a,b)=>a.lost-b.lost).slice(0,10);
    if (struggling.length>0) {
      prompt += `
RESOURCES BELOW TARGET (90%)
`;
      for (const r of struggling) {
        prompt += `- ${r.resource}: ${r.eff.toFixed(1)}% eff, ${r.lost.toFixed(1)}h lost`;
        const dtTop = Object.entries(r.downtimeReasons||{}).sort((a,b)=>b[1]-a[1])[0];
        if (dtTop) prompt += `, top downtime: ${dtTop[0]} (${dtTop[1].toFixed(0)}h)`;
        else if (r.topReason) prompt += `, top reason: ${r.topReason}`;
        if (r.allNotes&&r.allNotes.length>0) {
          const noteTexts = r.allNotes.slice(0,3).map(n=>`"${n.note}"`).join("; ");
          prompt += `, notes: ${noteTexts}`;
        }
        prompt += "
";
      }
    }

    // Downtime reasons summary
    if (Object.keys(reasonCount).length>0) {
      prompt += `
TOP UNDERPERFORMANCE REASONS
`;
      Object.entries(reasonCount).sort((a,b)=>(b[1].lost||0)-(a[1].lost||0)).slice(0,5).forEach(([r,d])=>{
        prompt += `- ${r}: ${d.count} occurrences, ${d.lost.toFixed(1)}h lost
`;
      });
    }

    prompt += `
Please provide a concise management summary with:
`;
    prompt += `1. HEADLINE (1 sentence: overall performance assessment)
`;
    prompt += `2. KEY ISSUES (bullet points: top 3-4 specific problems with resource names and hours)
`;
    prompt += `3. BRIGHT SPOTS (bullet points: what went well, resources above target)
`;
    prompt += `4. RECOMMENDATIONS (bullet points: 2-3 concrete actionable items based on the data)

`;
    prompt += `Be specific — use actual resource names, hour figures, and percentages from the data. Keep it under 300 words. Write for a production manager audience.`;
    return prompt;
  };

  const generate = async () => {
    setStatus("loading");
    setSummary(null);
    try {
      const prompt = buildPrompt();
      const resp = await fetch("https://api.anthropic.com/v1/messages", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          model: "claude-sonnet-4-6",
          max_tokens: 1000,
          messages: [{ role: "user", content: prompt }]
        })
      });
      const result = await resp.json();
      if (result.content?.[0]?.text) {
        setSummary(result.content[0].text);
        setStatus("done");
      } else {
        throw new Error(result.error?.message||"No response");
      }
    } catch(e) {
      console.error(e);
      setStatus("error");
      setSummary("Error: " + e.message);
    }
  };

  const copy = () => {
    if (!summary) return;
    const rangeLabel = RANGE_LABELS[rangeF]||rangeF;
    const buLabel = buFilter==="__ALL__" ? "All BUs" : buFilter;
    const header = `SMI Production Summary — ${buLabel} — ${rangeLabel}\n${"=".repeat(50)}\n\n`;
    navigator.clipboard.writeText(header + summary).then(()=>{
      setCopied(true);
      setTimeout(()=>setCopied(false), 2500);
    });
  };

  const rangeLabel = RANGE_LABELS[rangeF]||rangeF;
  const buLabel = buFilter==="__ALL__" ? "All BUs" : buFilter;

  return (
    <div className="border-2 border-blue-200 rounded-xl bg-blue-50 overflow-hidden">
      {/* Header */}
      <div className="px-4 py-3 flex items-center justify-between bg-gradient-to-r from-blue-900 to-blue-700">
        <div>
          <div className="text-white font-bold text-sm">AI Production Summary</div>
          <div className="text-blue-200 text-[10px]">{buLabel} · {rangeLabel}</div>
        </div>
        <div className="flex items-center gap-2">
          {summary && (
            <button onClick={copy}
              className="px-3 py-1.5 rounded text-[11px] font-semibold text-white border border-blue-400 hover:bg-blue-700"
              style={{backgroundColor: copied?"#16a34a":"transparent"}}>
              {copied ? "✓ Copied!" : "Copy"}
            </button>
          )}
          <button onClick={generate} disabled={status==="loading"||!data}
            className="px-4 py-1.5 rounded text-[11px] font-bold text-blue-900 disabled:opacity-50"
            style={{backgroundColor: status==="loading"?"#93c5fd":"#f0f9ff"}}>
            {status==="loading" ? "⏳ Analyzing…" : status==="done" ? "↻ Regenerate" : "✦ Generate Summary"}
          </button>
        </div>
      </div>

      {/* Body */}
      {status==="idle" && (
        <div className="px-4 py-6 text-center text-slate-500 text-sm">
          <div className="text-2xl mb-2">✦</div>
          <div className="font-semibold text-slate-700 mb-1">AI-powered management summary</div>
          <div className="text-[12px] text-slate-400">Analyzes efficiency, downtime, WO notes and trends for the selected period and generates a concise report ready to copy and share.</div>
        </div>
      )}

      {status==="loading" && (
        <div className="px-4 py-8 text-center">
          <div className="inline-block w-6 h-6 border-2 border-blue-500 border-t-transparent rounded-full animate-spin mb-3"></div>
          <div className="text-sm text-slate-500">Analyzing {buLabel} data for {rangeLabel}…</div>
        </div>
      )}

      {(status==="done"||status==="error") && summary && (
        <div className="px-4 py-4">
          <div className="bg-white rounded-lg border border-blue-100 p-4 text-sm text-slate-700 leading-relaxed whitespace-pre-wrap font-mono text-[12px]">
            {summary}
          </div>
        </div>
      )}
    </div>
  );
}

// ── Main App ───────────────────────────────────────────────────────────────
function ShiftReportApp() {
  const [activeTab,    setActiveTab]    = useState("history");  // "history"|"analytics"
  const [allDocs,      setAllDocs]      = useState(null);
  const [allLogsSnap,  setAllLogsSnap]  = useState(null);
  const [loading,      setLoading]      = useState(true);
  const [exportState,  setExportState]  = useState("idle");
  const [exportMsg,    setExportMsg]    = useState("");
  const [initials,     setInitials]     = useState(localStorage.getItem("build_tracker_initials")||"");
  const [showInitials, setShowInitials] = useState(false);

  useEffect(() => {
    // Load all shift reports + safety logs in parallel
    Promise.all([
      SHIFT_REPORTS_REF.get(),
      SHIFT_LOGS_REF.get(),
    ]).then(([reportsSnap, logsSnap]) => {
      const docs = reportsSnap.docs.map(d=>({id:d.id,...d.data()}));
      setAllDocs(docs);
      setAllLogsSnap(logsSnap);
      setLoading(false);
    }).catch(e => {
      console.error("Load failed:", e);
      setAllDocs([]);
      setLoading(false);
    });
  }, []);

  const exportToSheets = async (monthFilter) => {
    setExportState("exporting");
    setExportMsg(monthFilter?`Exporting ${monthFilter}…`:"Exporting all reports…");
    try {
      const token = await getGoogleAccessToken();
      let docs = allDocs||[];
      if (monthFilter) {
        docs = docs.filter(d=>{
          if (!d.date) return false;
          const dt=new Date(d.date+"T12:00:00");
          const tab=dt.toLocaleDateString("en-US",{month:"short",year:"numeric"});
          return tab===monthFilter;
        });
      }
      const tabCount = await exportReportsToSheet(docs, token);
      setExportState("done");
      setExportMsg(`✓ Exported ${docs.length} reports across ${tabCount} tab${tabCount!==1?"s":""}`);
      setTimeout(()=>{ setExportState("idle"); setExportMsg(""); }, 5000);
    } catch(e) {
      console.error(e);
      setExportState("error");
      setExportMsg("Export failed — "+e.message);
      setTimeout(()=>{ setExportState("idle"); setExportMsg(""); }, 5000);
    }
  };

  const saveInitials = (val) => {
    localStorage.setItem("build_tracker_initials", val.trim().toUpperCase());
    setInitials(val.trim().toUpperCase());
    setShowInitials(false);
  };

  const BT_URL = "https://goshotrifonov.github.io/report/BuildTracker.html";

  return (
    <div className="flex flex-col h-screen bg-stone-50">
      {/* Header */}
      <div style={{backgroundColor:"#1e3a5f"}} className="flex items-center justify-between px-4 py-3 shadow-md flex-shrink-0">
        <div className="flex items-center gap-3">
          <div>
            <div className="text-white font-bold text-base leading-tight">SMI Shift Reports</div>
            <div className="text-blue-200 text-[10px] font-semibold uppercase tracking-wider">History & Analytics</div>
          </div>
        </div>
        <div className="flex items-center gap-2">
          {/* Initials */}
          {showInitials ? (
            <div className="flex items-center gap-1">
              <input autoFocus className="px-2 py-1 text-xs rounded border border-slate-300 w-16 text-center uppercase"
                value={initials} onChange={e=>setInitials(e.target.value.toUpperCase())}
                onKeyDown={e=>{ if(e.key==="Enter") saveInitials(initials); if(e.key==="Escape") setShowInitials(false); }}
                maxLength={4} placeholder="ABC"/>
              <button onClick={()=>saveInitials(initials)} className="px-2 py-1 text-xs bg-blue-500 text-white rounded font-semibold">✓</button>
            </div>
          ) : (
            <button onClick={()=>setShowInitials(true)}
              className="text-[11px] font-bold px-2 py-1 rounded text-blue-200 hover:bg-blue-800 border border-blue-700">
              {initials||"Set initials"}
            </button>
          )}
          {/* Export to Sheets */}
          <button onClick={()=>exportToSheets()} disabled={exportState==="exporting"||!allDocs}
            title="Export all shift reports to Google Sheets"
            style={{backgroundColor:exportState==="done"?"#16a34a":exportState==="error"?"#dc2626":exportState==="exporting"?"#60a5fa":"#1e4d8c"}}
            className="flex items-center gap-1.5 px-3 py-1.5 rounded text-white text-[11px] font-semibold border border-blue-700">
            <Sheet className="w-3.5 h-3.5"/>
            {exportState==="exporting"?"Exporting…":exportState==="done"?"✓ Done":exportState==="error"?"Error":"Sheets"}
          </button>
          {/* Back to BuildTracker */}
          <a href={BT_URL}
            className="flex items-center gap-1.5 px-3 py-1.5 rounded text-[11px] font-semibold text-blue-200 hover:bg-blue-800 border border-blue-700">
            <ExternalLink className="w-3.5 h-3.5"/> BuildTracker
          </a>
        </div>
      </div>

      {/* Export message bar */}
      {exportMsg && (
        <div className={`px-4 py-2 text-center text-[11px] font-semibold ${exportState==="done"?"bg-emerald-100 text-emerald-800":exportState==="error"?"bg-rose-100 text-rose-800":"bg-blue-50 text-blue-800"}`}>
          {exportMsg}
        </div>
      )}

      {/* Tab bar */}
      <div className="flex border-b border-stone-200 bg-white flex-shrink-0">
        <button onClick={()=>setActiveTab("history")}
          className={`flex-1 flex items-center justify-center gap-2 py-3 text-sm font-semibold border-b-2 transition-colors ${activeTab==="history"?"border-blue-600 text-blue-700 bg-blue-50":"border-transparent text-slate-500 hover:text-slate-700"}`}>
          <Clock className="w-4 h-4"/> History
        </button>
        <button onClick={()=>setActiveTab("analytics")}
          className={`flex-1 flex items-center justify-center gap-2 py-3 text-sm font-semibold border-b-2 transition-colors ${activeTab==="analytics"?"border-blue-600 text-blue-700 bg-blue-50":"border-transparent text-slate-500 hover:text-slate-700"}`}>
          <BarChart2 className="w-4 h-4"/> Analytics
        </button>
      </div>

      {/* Content */}
      <div className="flex-1 overflow-hidden">
        {loading && (
          <div className="flex items-center justify-center h-full text-slate-400">
            <div className="text-center">
              <div className="text-2xl mb-2">⏳</div>
              <div className="text-sm">Loading shift reports…</div>
            </div>
          </div>
        )}
        {!loading && allDocs && (
          activeTab==="history"
            ? <HistoryTab allDocs={allDocs} />
            : <AnalyticsTab allDocs={allDocs} allLogsSnap={allLogsSnap} />
        )}
      </div>
    </div>
  );
}

ReactDOM.render(<ShiftReportApp />, document.getElementById("root"));
</script>
</body>
</html>
